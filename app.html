/* ═══════ HERRAMIENTAS ═══════ */
function SecEjercicios({ramos=[],user}){
  const [bloques,setBloques]=useState([]);
  const [selB,setSelB]=useState(null);
  const [msgs,setMsgs]=useState([]);
  const [inp,setInp]=useState('');
  const [streaming,setStreaming]=useState(false);
  const [streamBuf,setStreamBuf]=useState('');
  const [showNew,setShowNew]=useState(false);
  const [showSrc,setShowSrc]=useState(false);
  const [srcMode,setSrcMode]=useState('arch');
  const [actSrc,setActSrc]=useState([]);
  const [urlInp,setUrlInp]=useState('');
  const fRef=useRef(null);
  const msgEndRef=useRef(null);
  const [form,setForm]=useState({titulo:'',ramo:'',tipo:'Prueba',conPauta:false});
  const bloque=bloques.find(b=>b.id===selB);
  const ramo=ramos.find(r=>r.id===(bloque?.ramo||''));
  const archRamo=ramo?.archivos||[];

  useEffect(()=>{
    if(!supabaseClient||!user) return;
    supabaseClient.from('ejercicios_blocks').select('*').eq('user_id',user.id).order('created_at')
      .then(({data})=>{if(data) setBloques(data.map(b=>({id:b.id,titulo:b.titulo,ramo:b.ramo_id,tipo:b.tipo,conPauta:b.con_pauta,ts:b.created_at})));});
  },[user]);

  const [blockFiles,setBlockFiles]=useState([]);
  const [uploadingFile,setUploadingFile]=useState(false);

  // Load persistent files when selecting a block
  useEffect(()=>{
    setBlockFiles([]);
    if(!selB||!supabaseClient||!user) return;
    supabaseClient.storage.from('ramo-files').list(`${user.id}/ejercicios/${selB}`)
      .then(async({data})=>{
        if(!data||!data.length) return;
        const files=[];
        for(const f of data){
          const path=`${user.id}/ejercicios/${selB}/${f.name}`;
          const{data:urlData}=await supabaseClient.storage.from('ramo-files').createSignedUrl(path,3600);
          const displayName=f.name.replace(/^\d+_/,'');
          files.push({title:displayName,storagePath:path,storageUrl:urlData?.signedUrl||null});
        }
        setBlockFiles(files);
        setActSrc(prev=>[...prev,...files]);
      });
  },[selB]);

  useEffect(()=>{msgEndRef.current?.scrollIntoView({behavior:'smooth'});},[msgs,streamBuf]);

  const upFile=e=>{
    const files=Array.from(e.target.files||[]);
    if(!files.length) return;
    files.forEach(file=>{
      const reader=new FileReader();
      reader.onload=async ev=>{
        const b64=ev.target.result.split(',')[1];
        setActSrc(prev=>prev.find(s=>s.title===file.name)?prev:[...prev,{title:file.name,base64:b64,mediaType:file.type||'application/pdf'}]);
        // Persist to storage
        if(supabaseClient&&user&&selB){
          const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
          const path=`${user.id}/ejercicios/${selB}/${Date.now()}_${safeName}`;
          await supabaseClient.storage.from('ramo-files').upload(path,file,{upsert:true});
          setBlockFiles(prev=>[...prev,{title:file.name,storagePath:path}]);
        }
      };
      reader.readAsDataURL(file);
    });
  };

  const togRamoFile=a=>setActSrc(prev=>{
    const found=prev.find(s=>s.title===a.n);
    if(found)return prev.filter(s=>s.title!==a.n);
    // storageUrl would be a real Supabase Storage URL in production
    return [...prev,{title:a.n,storageUrl:null,base64:null}];
  });

  const addUrl=()=>{if(!urlInp.trim())return;setActSrc(prev=>[...prev,{title:urlInp.trim(),storageUrl:urlInp.trim()}]);setUrlInp('');};

  const sendMsg=async()=>{
    const text=inp.trim();
    if(!text||streaming)return;
    setInp('');
    const userMsg={role:'user',content:text};
    const nextMsgs=[...msgs,userMsg];
    setMsgs(nextMsgs);
    setStreaming(true);setStreamBuf('');
    try{
      const validSources=actSrc.filter(s=>s.base64||s.storageUrl);
      const resp=await fetch('/api/ejercicios-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sources:validSources,messages:nextMsgs,conPauta:bloque?.conPauta||false})});
      if(!resp.ok){const e=await resp.json();throw new Error(e.error||'Error del servidor');}
      const reader=resp.body.getReader();const dec=new TextDecoder();let full='';
      while(true){
        const {done,value}=await reader.read();if(done)break;
        dec.decode(value).split('\n').forEach(line=>{
          if(!line.startsWith('data: '))return;
          try{const j=JSON.parse(line.slice(6));
            if(j.chunk){full+=j.chunk;setStreamBuf(full);}
            if(j.done){setMsgs(p=>[...p,{role:'assistant',content:full,srcs:actSrc.map(s=>s.title)}]);setStreamBuf('');}
          }catch{}
        });
      }
    }catch(err){setMsgs(p=>[...p,{role:'assistant',content:'**Error:** '+err.message,isError:true,retryText:text}]);}
    finally{setStreaming(false);}
  };

  const retrySend=(text)=>{setMsgs(p=>p.slice(0,-1));setInp(text);setTimeout(()=>sendMsg(),100);};

  const [formFiles,setFormFiles]=useState([]);
  const formFileRef=useRef(null);
  const upFormFile=e=>{
    Array.from(e.target.files||[]).forEach(file=>{
      const reader=new FileReader();
      reader.onload=ev=>{
        const b64=ev.target.result.split(',')[1];
        setFormFiles(prev=>prev.find(f=>f.title===file.name)?prev:[...prev,{title:file.name,base64:b64,mediaType:file.type||'application/pdf'}]);
      };
      reader.readAsDataURL(file);
    });
  };

  const createBlock=async()=>{
    if(!form.titulo||!supabaseClient||!user)return;
    const{data,error}=await supabaseClient.from('ejercicios_blocks').insert({user_id:user.id,ramo_id:form.ramo||null,titulo:form.titulo,tipo:form.tipo,con_pauta:form.conPauta}).select('id').single();
    if(error){console.error('Error creando bloque:',error.message);return;}
    setBloques(p=>[...p,{id:data.id,titulo:form.titulo,ramo:form.ramo,tipo:form.tipo,conPauta:form.conPauta,ts:'ahora'}]);
    setSelB(data.id);setMsgs([]);setShowNew(false);
    if(formFiles.length>0){
      setActSrc(formFiles);
      // Persist formFiles to storage
      for(const f of formFiles){
        if(f.base64&&supabaseClient){
          const safeName=f.title.replace(/[^a-zA-Z0-9._-]/g,'_');
          const path=`${user.id}/ejercicios/${data.id}/${Date.now()}_${safeName}`;
          const blob=await fetch(`data:${f.mediaType||'application/pdf'};base64,${f.base64}`).then(r=>r.blob());
          await supabaseClient.storage.from('ramo-files').upload(path,blob,{upsert:true,contentType:f.mediaType||'application/pdf'});
        }
      }
    }
    setForm({titulo:'',ramo:'',tipo:'Prueba',conPauta:false});setFormFiles([]);
  };

  return(
    <div style={{display:'flex',flex:1,overflow:'hidden'}}>
      <div style={{width:224,flexShrink:0,borderRight:'1px solid var(--ln)',background:'var(--w)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'13px 13px 8px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div style={{fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--k4)'}}>Ejercicios</div>
          <button onClick={()=>setShowNew(true)} style={{width:22,height:22,borderRadius:6,border:'none',background:'transparent',cursor:'pointer',color:'var(--k3)',display:'grid',placeItems:'center'}}><IcoPlus s={12}/></button>
        </div>
        <div style={{overflowY:'auto',flex:1,minHeight:0}}>
          {bloques.length===0&&<div style={{padding:'20px 16px',textAlign:'center',color:'var(--k4)',fontSize:12}}>Sin bloques aún.<br/>Haz clic en + para crear.</div>}
          {bloques.map(b=>(<div key={b.id} onClick={()=>{setSelB(b.id);setActSrc([]);setShowSrc(false);setMsgs([]);setBlockFiles([]);}} style={{padding:'10px 13px',cursor:'pointer',borderBottom:'1px solid var(--ls)',background:selB===b.id?'var(--p)':'transparent',position:'relative'}}>{selB===b.id&&<div style={{position:'absolute',left:0,top:8,bottom:8,width:3,borderRadius:'0 3px 3px 0',background:'linear-gradient(125deg,#1c6ec8,#3a26a0)'}}></div>}<div style={{fontSize:12,fontWeight:600}}>{b.titulo}</div><div style={{display:'flex',gap:6,marginTop:4,flexWrap:'wrap'}}><span style={{fontSize:10,padding:'2px 7px',borderRadius:999,background:'var(--p2)',color:'var(--k4)',fontWeight:500}}>{b.tipo}</span>{b.conPauta&&<span style={{fontSize:10,padding:'2px 6px',borderRadius:999,background:'rgba(22,84,176,.1)',color:'#1654b0',fontWeight:500}}>+Pauta</span>}</div><div style={{width:8,height:8,borderRadius:2,background:ramos.find(r=>r.id===b.ramo)?.color||'#1654b0',marginTop:4,display:'inline-block'}}></div></div>))}
        </div>
      </div>
      <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',background:'var(--p)',overflow:'hidden',position:'relative'}}>
        {!bloque&&<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:10,color:'var(--k4)'}}><IcoCpu s={28}/><div style={{fontSize:14,fontWeight:500}}>Selecciona o crea un bloque</div></div>}
        {bloque&&<>
          <div style={{padding:'12px 20px',borderBottom:'1px solid var(--ln)',background:'var(--w)',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
            <div style={{width:26,height:26,borderRadius:7,background:`linear-gradient(135deg,${ramos.find(r=>r.id===bloque.ramo)?.color||'#1654b0'}cc,${ramos.find(r=>r.id===bloque.ramo)?.color||'#1654b0'}77)`,flexShrink:0,display:'grid',placeItems:'center'}}><IcoCpu s={13}/></div>
            <div style={{flex:1}}><input value={bloque.titulo} onChange={e=>setBloques(p=>p.map(x=>x.id===selB?{...x,titulo:e.target.value}:x))} style={{fontSize:13,fontWeight:600,border:'none',outline:'none',background:'transparent',color:'var(--k)',width:'100%',fontFamily:'inherit'}}/><div style={{fontSize:11,color:'var(--k3)'}}>IA · {bloque.tipo} · {ramos.find(r=>r.id===bloque.ramo)?.nombre||bloque.ramo}{bloque.conPauta?' · Con pauta':''}</div></div>
            <button onClick={()=>{if(confirm('¿Eliminar este bloque de ejercicios?')){setBloques(p=>p.filter(x=>x.id!==selB));setSelB(null);}}} style={{padding:'5px 8px',borderRadius:7,border:'1px solid var(--ln)',background:'var(--w)',cursor:'pointer',color:'var(--er)',fontSize:11,fontWeight:500,flexShrink:0}}>Eliminar</button>
            <button onClick={()=>setShowSrc(s=>!s)} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,fontWeight:500,padding:'5px 10px',borderRadius:8,border:'1px solid var(--ln)',background:showSrc?'var(--p2)':'var(--w)',cursor:'pointer',color:showSrc?'var(--k)':'var(--k3)',flexShrink:0}}>
              <IcoFile s={12}/>Fuentes{actSrc.length>0&&<span style={{background:ramos.find(r=>r.id===bloque.ramo)?.color||'#1654b0',color:'white',borderRadius:'50%',width:15,height:15,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:700}}>{actSrc.length}</span>}
            </button>
          </div>
          {showSrc&&(<div style={{background:'var(--w)',borderBottom:'1px solid var(--ln)',padding:'12px 20px',flexShrink:0}}>
            <Seg value={srcMode} onChange={setSrcMode} options={[{v:'arch',l:'Archivos del ramo'},{v:'url',l:'URL'},{v:'bib',l:'Biblioteca'}]}/>
            <div style={{marginTop:10}}>
              {srcMode==='arch'&&(<div>{blockFiles.length>0&&<div style={{display:'flex',flexDirection:'column',gap:4,marginBottom:8}}>{blockFiles.map((f,i)=>(<div key={i} style={{display:'flex',alignItems:'center',gap:6,padding:'4px 9px',borderRadius:7,border:'1px solid var(--ln)',background:'var(--p2)',fontSize:11,fontWeight:500,color:'var(--k)'}}><IcoFile s={11}/><span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.title}</span><button onClick={async()=>{if(f.storagePath&&supabaseClient) await supabaseClient.storage.from('ramo-files').remove([f.storagePath]);setBlockFiles(p=>p.filter((_,j)=>j!==i));setActSrc(p=>p.filter(s=>s.title!==f.title));}} style={{border:'none',background:'none',cursor:'pointer',color:'var(--k4)',padding:'0 2px',lineHeight:1,flexShrink:0,fontSize:15}}>×</button></div>))}</div>}<div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:8}}>{archRamo.map((a,i)=>(<button key={i} onClick={()=>togRamoFile(a)} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'4px 9px',borderRadius:7,border:`1px solid ${actSrc.find(s=>s.title===a.n)?'#1654b0':'var(--ln)'}`,background:actSrc.find(s=>s.title===a.n)?'rgba(22,84,176,.09)':'var(--p)',fontSize:11,fontWeight:500,color:actSrc.find(s=>s.title===a.n)?'#1654b0':'var(--k3)',cursor:'pointer'}}><IcoFile s={11}/>{a.n}{actSrc.find(s=>s.title===a.n)&&<IcoOk s={10}/>}</button>))}</div><button onClick={()=>fRef.current?.click()} disabled={uploadingFile} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,fontWeight:500,color:'#1654b0',border:'1px dashed rgba(22,84,176,.3)',background:'transparent',padding:'5px 10px',borderRadius:7,cursor:uploadingFile?'default':'pointer',opacity:uploadingFile?.6:1}}><IcoUp s={11}/>{uploadingFile?'Subiendo…':'Subir archivo (PDF, DOCX…)'}</button><input ref={fRef} type="file" multiple accept=".pdf,.docx,.txt" style={{display:'none'}} onChange={upFile}/></div>)}
              {srcMode==='url'&&(<div style={{display:'flex',gap:8}}><input value={urlInp} onChange={e=>setUrlInp(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addUrl()} placeholder="https://..." style={{flex:1,padding:'7px 11px',borderRadius:8,border:'1px solid var(--ln)',background:'var(--w)',font:'inherit',fontSize:12,outline:'none'}}/><Btn onClick={addUrl} variant="pri" size="sm">Añadir</Btn></div>)}
              {srcMode==='bib'&&(<div style={{display:'flex',flexDirection:'column',gap:4}}>{RAMOS.flatMap(r=>r.archivos.map(a=>({...a,rn:r.nombre,rk:r.id}))).map((a,i)=>(<button key={i} onClick={()=>togRamoFile(a)} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',borderRadius:7,border:`1px solid ${actSrc.find(s=>s.title===a.n)?'#1654b0':'var(--ln)'}`,background:actSrc.find(s=>s.title===a.n)?'rgba(22,84,176,.09)':'var(--p)',cursor:'pointer',fontSize:11,fontWeight:500,color:actSrc.find(s=>s.title===a.n)?'#1654b0':'var(--k3)'}}><IcoFile s={11}/><span style={{flex:1}}>{a.n}</span><span style={{color:'var(--k4)',fontSize:10}}>{a.rn}</span>{actSrc.find(s=>s.title===a.n)&&<IcoOk s={10}/>}</button>))}</div>)}
            </div>
          </div>)}
          <div style={{flex:1,overflowY:'auto',padding:'16px 20px 110px'}}>
            {msgs.length===0&&!streaming&&<div style={{textAlign:'center',color:'var(--k4)',padding:'40px 20px'}}><IcoCpu s={28}/><div style={{marginTop:12,fontSize:13,lineHeight:1.6}}>Adjunta material del ramo y pide ejercicios<br/>en el estilo exacto de tus evaluaciones.</div></div>}
            {msgs.map((m,i)=>(
              <div key={i} style={{marginTop:14}}>
                {m.role==='user'?<div style={{maxWidth:'75%',padding:'10px 14px',borderRadius:16,borderBottomRightRadius:5,background:'var(--p2)',color:'var(--k)',marginLeft:'auto',fontSize:13,lineHeight:1.5}}>{m.content}</div>
                :<div style={{fontSize:13,lineHeight:1.65,color:'var(--k)',paddingBottom:4}}><ChatMsg text={m.content}/>{m.isError&&m.retryText&&<button onClick={()=>retrySend(m.retryText)} style={{marginTop:6,display:'flex',alignItems:'center',gap:5,fontSize:11,fontWeight:500,color:'#1654b0',border:'1px solid rgba(22,84,176,.25)',background:'rgba(22,84,176,.06)',padding:'5px 12px',borderRadius:7,cursor:'pointer'}}>Reintentar</button>}{m.srcs&&m.srcs.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:5,marginTop:8}}>{m.srcs.map((s,j)=><div key={j} style={{display:'inline-flex',alignItems:'center',gap:4,padding:'3px 8px',borderRadius:6,background:'var(--p2)',fontSize:10,color:'var(--k3)',fontWeight:500}}><IcoFile s={10}/>{s}</div>)}</div>}</div>}
              </div>
            ))}
            {streaming&&streamBuf&&<div style={{marginTop:14,fontSize:13,lineHeight:1.65,color:'var(--k)'}}><ChatMsg text={streamBuf}/><span style={{display:'inline-block',width:8,height:14,background:'var(--k)',borderRadius:2,marginLeft:3,animation:'blink 1s step-end infinite',verticalAlign:'text-bottom'}}/></div>}
            {streaming&&!streamBuf&&<div style={{marginTop:14,padding:'10px 14px',borderRadius:12,background:'var(--p2)',display:'inline-flex',gap:6,alignItems:'center',fontSize:12,color:'var(--k4)'}}>Analizando material y generando ejercicios…</div>}
            <div ref={msgEndRef}/>
          </div>
          <div style={{position:'absolute',bottom:14,left:16,right:16,background:'var(--w)',border:'1px solid var(--ln)',borderRadius:15,padding:'7px 9px',display:'flex',alignItems:'center',gap:7,boxShadow:'0 4px 24px -8px rgba(0,0,0,.12)'}}>
            <button onClick={()=>setShowSrc(s=>!s)} style={{width:28,height:28,borderRadius:8,border:'1px solid var(--ln)',background:'var(--p)',cursor:'pointer',display:'grid',placeItems:'center',color:'var(--k3)',flexShrink:0}}><IcoPlus s={13}/></button>
            <input value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&sendMsg()} placeholder={streaming?'Generando…':'Pide ejercicios, soluciones, pistas…'} disabled={streaming} style={{flex:1,border:'none',outline:'none',fontSize:13,background:'transparent',color:'var(--k)',fontFamily:'inherit'}}/>
            <button onClick={sendMsg} disabled={streaming||!inp.trim()} style={{width:28,height:28,borderRadius:'50%',background:streaming||!inp.trim()?'var(--p2)':'linear-gradient(125deg,#1654b0,#3a26a0)',border:'none',display:'grid',placeItems:'center',cursor:streaming?'default':'pointer',flexShrink:0}}><IcoSend/></button>
          </div>
        </>}
      </div>
      <Modal open={showNew} onClose={()=>setShowNew(false)} title="Nuevos ejercicios con IA">
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <Fld label="Título" value={form.titulo} onChange={v=>setForm(p=>({...p,titulo:v}))} ph="Ej: Práctica Certamen 2" required/>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <Sel label="Ramo" value={form.ramo} onChange={v=>setForm(p=>({...p,ramo:v}))} options={ramos.map(r=>({v:r.id,l:r.nombre||r.name||''}))}/>
            <Sel label="Tipo de evaluación" value={form.tipo} onChange={v=>setForm(p=>({...p,tipo:v}))} options={[{v:'Prueba',l:'Prueba'},{v:'Control',l:'Control'},{v:'Quiz',l:'Quiz'},{v:'Examen',l:'Examen'},{v:'Tarea',l:'Tarea'}]}/>
          </div>
          <div>
            <label style={{fontSize:12,fontWeight:500,color:'var(--k3)',display:'block',marginBottom:6}}>Material de referencia (pruebas anteriores, guías, apuntes…)</label>
            <div onClick={()=>formFileRef.current?.click()} style={{border:'1.5px dashed var(--ln)',borderRadius:10,padding:'16px',cursor:'pointer',textAlign:'center',background:'var(--p)'}} onMouseEnter={e=>e.currentTarget.style.background='var(--p2)'} onMouseLeave={e=>e.currentTarget.style.background='var(--p)'}>
              <IcoUp s={20}/><div style={{fontSize:12,color:'var(--k4)',marginTop:6}}>Arrastra o haz clic · PDF, DOCX, TXT</div>
            </div>
            <input ref={formFileRef} type="file" multiple accept=".pdf,.docx,.txt" style={{display:'none'}} onChange={upFormFile}/>
            {formFiles.length>0&&<div style={{marginTop:8,display:'flex',flexWrap:'wrap',gap:5}}>{formFiles.map((f,i)=><div key={i} style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:6,background:'rgba(22,84,176,.08)',fontSize:11,color:'#1654b0'}}><IcoFile s={10}/>{f.title}<button onClick={e=>{e.stopPropagation();setFormFiles(p=>p.filter((_,j)=>j!==i));}} style={{border:'none',background:'none',cursor:'pointer',color:'var(--k4)',fontSize:13,lineHeight:1,padding:0}}>×</button></div>)}</div>}
          </div>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',borderRadius:10,background:'var(--p)',border:'1px solid var(--ln)'}}>
            <div><div style={{fontSize:13,fontWeight:500}}>Incluir pauta con soluciones</div><div style={{fontSize:11,color:'var(--k4)',marginTop:2}}>La IA incluye solución paso a paso de cada ejercicio</div></div>
            <Tog value={form.conPauta} onChange={v=>setForm(p=>({...p,conPauta:v}))}/>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}><Btn onClick={()=>{setShowNew(false);setFormFiles([]);}}>Cancelar</Btn><Btn onClick={createBlock} variant="pri" disabled={!form.titulo}><IcoCpu s={12}/>Crear bloque</Btn></div>
        </div>
      </Modal>
    </div>
  );
}

function SecApuntes({ramos=[]}){
  const COLORS=['var(--k)','#1654b0','#b00d6e','#0e6e72','#b25e09','#8b5cf6','#d70015'];
  const COLOR_NAMES=['Negro','Azul','Rosa','Verde','Naranja','Morado','Rojo'];
  const [notas,setNotas]=useState([]);
  const [selN,setSelN]=useState(null);
  const [collapsedH,setCollapsedH]=useState({});
  const [selColor,setSelColor]=useState('var(--k)');
  const [showColorPicker,setShowColorPicker]=useState(false);
  const nota=notas.find(n=>n.id===selN);

  const updateNota=(id,patch)=>setNotas(p=>p.map(n=>n.id===id?{...n,...patch}:n));
  const updateBlock=(nid,bid,patch)=>setNotas(p=>p.map(n=>n.id===nid?{...n,blocks:n.blocks.map(b=>b.id===bid?{...b,...patch}:b)}:n));
  const addBlock=(nid,type)=>{
    const id=Date.now();
    setNotas(p=>p.map(n=>n.id===nid?{...n,blocks:[...n.blocks,{id,type,text:'',collapsed:false}]}:n));
  };
  const delBlock=(nid,bid)=>setNotas(p=>p.map(n=>n.id===nid?{...n,blocks:n.blocks.filter(b=>b.id!==bid)}:n));
  const toggleCollapse=(nid,bid)=>setCollapsedH(p=>({...p,[nid+'-'+bid]:!p[nid+'-'+bid]}));

  const newNota=()=>{
    const id=Date.now();
    setNotas(p=>[...p,{id,titulo:'Nueva nota',ramo:'',f:'ahora',blocks:[{id:1,type:'h1',text:'Nueva nota'}]}]);
    setSelN(id);
  };

  // Determine which blocks are visible (collapsed headings hide their children)
  const getVisibleBlocks=(blocks)=>{
    const visible=[];
    let skipUntilLevel=null;
    for(const b of blocks){
      const isH=b.type==='h1'||b.type==='h2'||b.type==='h3';
      const hLevel=b.type==='h1'?1:b.type==='h2'?2:b.type==='h3'?3:99;
      if(skipUntilLevel!==null){
        if(isH&&hLevel<=skipUntilLevel){skipUntilLevel=null;}
        else{continue;}
      }
      visible.push(b);
      if(isH&&collapsedH[selN+'-'+b.id]){skipUntilLevel=hLevel;}
    }
    return visible;
  };

  const renderBlock=(b)=>{
    const isH=b.type==='h1'||b.type==='h2'||b.type==='h3';
    const collapsed=collapsedH[selN+'-'+b.id];
    const hStyle={h1:{fontSize:20,fontWeight:700,marginTop:12},h2:{fontSize:16,fontWeight:600,marginTop:10},h3:{fontSize:14,fontWeight:600,marginTop:8}};
    return(
      <div key={b.id} style={{display:'flex',alignItems:'flex-start',gap:4,marginBottom:3,group:'block'}} className="eb-wrap">
        {isH&&(
          <button onClick={()=>toggleCollapse(selN,b.id)} style={{width:18,height:18,border:'none',background:'transparent',cursor:'pointer',color:'var(--k4)',display:'grid',placeItems:'center',flexShrink:0,marginTop:isH?4:3,opacity:.5}}>
            <IcoCh dir={collapsed?'r':'d'} s={10}/>
          </button>
        )}
        {!isH&&<div style={{width:18,flexShrink:0}}/>}
        <div style={{flex:1,minWidth:0}}>
          {b.type==='bullet'
            ?<div style={{display:'flex',alignItems:'flex-start',gap:6}}>
              <span style={{color:'var(--k3)',marginTop:3,fontSize:13}}>•</span>
              <div contentEditable suppressContentEditableWarning onBlur={e=>updateBlock(selN,b.id,{text:e.currentTarget.textContent})} style={{flex:1,outline:'none',fontSize:13,lineHeight:1.65,color:b.color||'var(--k)',wordBreak:'break-word'}}>{b.text}</div>
            </div>
            :<div contentEditable suppressContentEditableWarning onBlur={e=>updateBlock(selN,b.id,{text:e.currentTarget.textContent})} style={{outline:'none',color:b.color||'var(--k)',wordBreak:'break-word',...(isH?hStyle[b.type]:{fontSize:13,lineHeight:1.65})}}>{b.text}</div>
          }
        </div>
        <button className="eb" onClick={()=>delBlock(selN,b.id)} style={{width:18,height:18,border:'none',background:'transparent',cursor:'pointer',color:'var(--er)',display:'grid',placeItems:'center',flexShrink:0}}>
          <IcoX s={10}/>
        </button>
      </div>
    );
  };

  return(
    <div style={{display:'flex',flex:1,overflow:'hidden'}}>
      {/* Lista de notas */}
      <div style={{width:224,flexShrink:0,borderRight:'1px solid var(--ln)',background:'var(--w)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'13px 13px 8px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div style={{fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--k4)'}}>Apuntes</div>
          <button onClick={newNota} style={{width:22,height:22,borderRadius:6,border:'none',background:'transparent',cursor:'pointer',color:'var(--k3)',display:'grid',placeItems:'center'}}><IcoPlus s={12}/></button>
        </div>
        <div style={{overflowY:'auto',flex:1,minHeight:0}}>
          {notas.map(n=>(
            <div key={n.id} onClick={()=>setSelN(n.id)} style={{padding:'10px 13px',cursor:'pointer',borderBottom:'1px solid var(--ls)',background:selN===n.id?'var(--p)':'transparent',position:'relative'}}>
              {selN===n.id&&<div style={{position:'absolute',left:0,top:8,bottom:8,width:3,borderRadius:'0 3px 3px 0',background:'linear-gradient(125deg,#1c6ec8,#3a26a0)'}}></div>}
              <div style={{fontSize:12,fontWeight:600}}>{n.titulo}</div>
              <div style={{display:'flex',gap:6,marginTop:4,alignItems:'center'}}>
                {n.ramo&&<div style={{width:6,height:6,borderRadius:'50%',background:ramos.find(r=>r.id===n.ramo)?.color||'#1654b0',flexShrink:0}}></div>}
                <span style={{fontSize:10,color:'var(--k4)'}}>{ramos.find(r=>r.id===n.ramo)?.nombre||'Sin ramo'} · {n.f}</span>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Editor */}
      {nota&&(
        <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',background:'var(--w)',overflow:'hidden'}}>
          {/* Toolbar */}
          <div style={{padding:'8px 20px',borderBottom:'1px solid var(--ln)',display:'flex',alignItems:'center',gap:8,flexShrink:0,flexWrap:'wrap'}}>
            {/* Título editable */}
            <input value={nota.titulo} onChange={e=>updateNota(nota.id,{titulo:e.target.value})} style={{fontSize:13,fontWeight:600,border:'none',outline:'none',background:'transparent',color:'var(--k)',flex:1,minWidth:120}} placeholder="Título de la nota"/>
            {/* Vincular ramo */}

                  {COLORS.map((c,i)=><button key={c} title={COLOR_NAMES[i]} onClick={()=>{setSelColor(c);setShowColorPicker(false);}} style={{width:20,height:20,borderRadius:'50%',border:selColor===c?'2.5px solid #1654b0':'2px solid transparent',background:c,cursor:'pointer'}}/>)}
                </div>
              )}
            </div>
            {/* Block type buttons */}
            {[['h1','T1'],['h2','T2'],['h3','T3'],['p','¶'],['bullet','•']].map(([type,lbl])=>(
              <button key={type} onClick={()=>addBlock(nota.id,type)} title={'Añadir '+type} style={{fontSize:11,fontWeight:600,padding:'3px 8px',borderRadius:6,border:'1px solid var(--ln)',background:'var(--p)',cursor:'pointer',color:'var(--k3)'}}>{lbl}</button>
            ))}
            <button onClick={()=>{if(confirm('¿Eliminar esta nota?')){setNotas(p=>p.filter(x=>x.id!==selN));setSelN(null);}}} style={{padding:'3px 8px',borderRadius:6,border:'1px solid var(--ln)',background:'var(--w)',cursor:'pointer',color:'var(--er)',fontSize:11,fontWeight:500}}>Eliminar</button>
          </div>

          {/* Contenido */}
          <div style={{flex:1,overflowY:'auto',padding:'24px 32px'}}>
            {getVisibleBlocks(nota.blocks||[]).map(b=>renderBlock(b))}
            <button onClick={()=>addBlock(nota.id,'p')} style={{marginTop:16,display:'flex',alignItems:'center',gap:6,fontSize:12,color:'var(--k4)',border:'1px dashed var(--ln)',background:'transparent',padding:'6px 14px',borderRadius:8,cursor:'pointer'}}>
              <IcoPlus s={11}/>Añadir bloque
            </button>
          </div>
        </div>
      )}
    </div>
  );
}
/* WorkEditor — contentEditable div with ref-controlled innerHTML */
function WorkEditor({content,onChange,elRef}){
  const inner=useRef(null);
  const r=elRef||inner;
  useEffect(()=>{if(r.current&&r.current.innerHTML!==content)r.current.innerHTML=content;},[content]);
  return(
    <div ref={r} contentEditable suppressContentEditableWarning
      onInput={e=>onChange(e.currentTarget.innerHTML)}
      style={{flex:1,overflowY:'auto',padding:'32px 48px',outline:'none',fontSize:14,lineHeight:1.75,color:'var(--k)',fontFamily:'inherit',background:'var(--w)',minHeight:0}}
    />
  );
}

/* mdToHtml — minimal markdown → HTML for the work editor */
function mdToHtml(md){
  if(!md)return'';
  let h=md;
  // Code blocks
  h=h.replace(/```[\s\S]*?```/g,m=>`<pre style="background:#f5f5f7;padding:12px;border-radius:8px;overflow:auto"><code>${m.slice(3,m.lastIndexOf('```')).trim()}</code></pre>`);
  // Headers
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  // Bold/italic
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  // Tables (simple)
  h=h.replace(/\|(.+)\|/g,(m)=>`<tr>${m.slice(1,-1).split('|').map(c=>`<td style="border:1px solid #ddd;padding:6px 10px">${c.trim()}</td>`).join('')}</tr>`);
  h=h.replace(/(<tr>[\s\S]*?<\/tr>)/g,'<table style="border-collapse:collapse;width:100%;margin:12px 0">$1</table>');
  // Remove separator rows (---) inside tables
  h=h.replace(/<tr>(<td[^>]*>[-:| ]+<\/td>)+<\/tr>/g,'');
  // Lists
  const lines=h.split('\n');
  const out=[];
  let inList=false;
  for(const line of lines){
    if(/^- /.test(line)){if(!inList){out.push('<ul style="margin:8px 0 8px 24px">');inList=true;}out.push(`<li>${line.slice(2)}</li>`);}
    else{if(inList){out.push('</ul>');inList=false;}
      if(/^<(h[1-6]|pre|table|ul|ol|tr)/.test(line.trim()))out.push(line);
      else if(line.trim())out.push(`<p style="margin:0 0 10px">${line}</p>`);
    }
  }
  if(inList)out.push('</ul>');
  return out.join('\n');
}

/* SlidePreview — visual preview of PPTX slides */
function SlidePreview({slides,color}){
  const [sel,setSel]=useState(0);
  const slide=slides[sel]||{};
  const bg=color||'linear-gradient(135deg,#1654b0,#14102e)';
  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',padding:24,background:'var(--p2)'}}>
        <div style={{width:560,height:315,borderRadius:10,overflow:'hidden',boxShadow:'0 8px 40px rgba(0,0,0,.2)',position:'relative',background:'var(--w)'}}>
          {(slide.type==='portada'||slide.type==='cierre')?(
            <div style={{width:'100%',height:'100%',background:bg,display:'flex',flexDirection:'column',alignItems:'flex-start',justifyContent:'center',padding:40}}>
              <div style={{fontSize:26,fontWeight:700,color:'white',marginBottom:10,lineHeight:1.2}}>{slide.title}</div>
              {slide.subtitle&&<div style={{fontSize:14,color:'rgba(255,255,255,.8)'}}>{slide.subtitle}</div>}
              {slide.details&&<div style={{fontSize:11,color:'rgba(255,255,255,.6)',marginTop:20}}>{slide.details}</div>}
            </div>
          ):(
            <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column'}}>
              <div style={{background:bg,padding:'10px 20px',flexShrink:0}}><div style={{fontSize:14,fontWeight:700,color:'white'}}>{slide.title}</div></div>
              <div style={{flex:1,padding:'14px 22px',overflowY:'auto'}}>
                {(slide.bullets||[]).map((b,i)=><div key={i} style={{display:'flex',gap:8,marginBottom:8,fontSize:13}}><span style={{color:'#1654b0',flexShrink:0}}>●</span><span>{b}</span></div>)}
              </div>
            </div>
          )}
          <div style={{position:'absolute',bottom:6,right:10,fontSize:9,color:'var(--k4)'}}>{sel+1}/{slides.length}</div>
        </div>
      </div>
      <div style={{flexShrink:0,overflowX:'auto',display:'flex',gap:6,padding:'10px 16px',borderTop:'1px solid var(--ln)',background:'var(--w)'}}>
        {slides.map((s,i)=>(
          <button key={i} onClick={()=>setSel(i)} style={{flexShrink:0,width:80,height:45,borderRadius:6,border:`2px solid ${sel===i?'#1654b0':'var(--ln)'}`,background:s.type==='portada'||s.type==='cierre'?bg:'var(--p)',cursor:'pointer',overflow:'hidden',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div style={{fontSize:7,padding:'2px 4px',color:s.type==='portada'||s.type==='cierre'?'white':'var(--k3)',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:72}}>{s.title||''}</div>
          </button>
        ))}
      </div>
    </div>
  );
}

function SecTrabajos({ramos=[],user}){
  const [trabajos,setTrabajos]=useState([]);
  const [selT,setSelT]=useState(null);
  const [showNew,setShowNew]=useState(false);
  const [form,setForm]=useState({titulo:'',ramo:'',tipo:'pdf',instrucciones:'',plantilla:'informe_lab'});
  const [instrArchivos,setInstrArchivos]=useState([]);
  const instrFileRef=useRef(null);
  const editorRef=useRef(null);
  const trab=trabajos.find(t=>t.id===selT);
  const execCmd=(cmd,val=null)=>{document.execCommand(cmd,false,val);};

  useEffect(()=>{
    if(!supabaseClient||!user) return;
    supabaseClient.from('trabajos').select('*').eq('user_id',user.id).order('created_at')
      .then(({data})=>{if(data) setTrabajos(data.map(t=>({id:t.id,titulo:t.titulo,ramo:t.ramo_id,tipo:t.tipo,estado:t.estado||'editor',prog:100,content:t.content_html||'',slidesJson:t.slides_json})));});
  },[user]);
  const TIPOS_OUT=[{v:'pdf',l:'Documento PDF'},{v:'docx',l:'Word (.docx)'},{v:'pptx',l:'PowerPoint (.pptx)'}];
  const PLANTILLAS_OUT=[{v:'informe_lab',l:'Informe de Laboratorio'},{v:'ensayo',l:'Ensayo Académico'},{v:'presentacion',l:'Presentación'},{v:'informe_general',l:'Informe General'},{v:'libre',l:'Libre (sin plantilla)'}];

  const upInstrFile=e=>{
    Array.from(e.target.files||[]).forEach(file=>{
      const reader=new FileReader();
      reader.onload=ev=>{
        const b64=ev.target.result.split(',')[1];
        setInstrArchivos(prev=>prev.find(f=>f.title===file.name)?prev:[...prev,{title:file.name,base64:b64,mediaType:file.type||'application/pdf'}]);
      };
      reader.readAsDataURL(file);
    });
  };

  const startGenerate=async()=>{
    if(!form.titulo||!supabaseClient||!user)return;
    const{data:dbRow,error:dbErr}=await supabaseClient.from('trabajos').insert({user_id:user.id,ramo_id:form.ramo||null,titulo:form.titulo,tipo:form.tipo,estado:'generando',instrucciones:form.instrucciones,plantilla:form.plantilla}).select('id').single();
    if(dbErr){console.error('Error creando trabajo:',dbErr.message);return;}
    const newId=dbRow.id;
    const newTrab={id:newId,titulo:form.titulo,ramo:form.ramo,tipo:form.tipo,estado:'generando',prog:0,content:'',slidesJson:null};
    setTrabajos(p=>[...p,newTrab]);
    setSelT(newId);setShowNew(false);
    const body={titulo:form.titulo,tipo:form.tipo,plantilla:form.tipo==='pptx'?'presentacion':form.plantilla,instruccionesTexto:form.instrucciones,instruccionesArchivo:instrArchivos[0]||null,materialRamo:[]};
    try{
      const resp=await fetch('/api/trabajos-generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!resp.ok){const e=await resp.json();throw new Error(e.error||'Error del servidor');}
      const reader=resp.body.getReader();const dec=new TextDecoder();let full='';let prog=5;
      while(true){
        const {done,value}=await reader.read();if(done)break;
        dec.decode(value).split('\n').forEach(line=>{
          if(!line.startsWith('data: '))return;
          try{const j=JSON.parse(line.slice(6));
            if(j.chunk){full+=j.chunk;prog=Math.min(95,prog+1.5);setTrabajos(p=>p.map(t=>t.id===newId?{...t,prog:Math.round(prog)}:t));}
            if(j.done){
              let finalContent='';let slidesJson=null;
              if(form.tipo==='pptx'){try{const raw=full.match(/```(?:json)?\s*([\s\S]*?)```/)?.[1]?.trim()??full;slidesJson=JSON.parse(raw);}catch{finalContent=mdToHtml(full);}}
              else{finalContent=mdToHtml(full);}
              setTrabajos(prev=>prev.map(t=>t.id===newId?{...t,estado:'editor',prog:100,content:finalContent,slidesJson}:t));
              supabaseClient.from('trabajos').update({estado:'editor',content_html:finalContent,slides_json:slidesJson}).eq('id',newId);
            }
          }catch{}
        });
      }
    }catch(err){setTrabajos(prev=>prev.map(t=>t.id===newId?{...t,estado:'editor',prog:100,content:`<p><strong>Error al generar:</strong> ${err.message}</p>`}:t));}
    setInstrArchivos([]);setForm({titulo:'',ramo:'',tipo:'pdf',instrucciones:'',plantilla:'informe_lab'});
  };

  const downloadFile=async()=>{
    if(!trab)return;
    if(trab.tipo==='pdf'){
      if(!window.html2pdf){alert('html2pdf no cargado. Usa Ctrl+P para imprimir como PDF.');return;}
      const el=editorRef.current;if(!el)return;
      window.html2pdf().set({margin:1.5,filename:trab.titulo+'.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:2},jsPDF:{unit:'cm',format:'a4',orientation:'portrait'}}).from(el).save();
      return;
    }
    try{
      const resp=await fetch('/api/trabajos-download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tipo:trab.tipo,titulo:trab.titulo,contentHtml:trab.content||'',slidesJson:trab.slidesJson||null,ramoColor:ramos.find(r=>r.id===trab.ramo)?.color||'#1654b0'})});
      if(!resp.ok){const e=await resp.json();alert('Error: '+e.error);return;}
      const blob=await resp.blob();
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=trab.titulo+'.'+trab.tipo;a.click();
      setTimeout(()=>URL.revokeObjectURL(url),3000);
    }catch(err){alert('Error al descargar: '+err.message);}
  };

  const trabRamoColor=(ramos.find(r=>r.id===trab?.ramo)?.color)||'#1654b0';
  const ramoGrad=`linear-gradient(135deg,${trabRamoColor}cc,${trabRamoColor}77)`;

  return(
    <div style={{display:'flex',flex:1,overflow:'hidden'}}>
      <div style={{width:224,flexShrink:0,borderRight:'1px solid var(--ln)',background:'var(--w)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'13px 13px 8px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div style={{fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--k4)'}}>Trabajos</div>
          <button onClick={()=>setShowNew(true)} style={{width:22,height:22,borderRadius:6,border:'none',background:'transparent',cursor:'pointer',color:'var(--k3)',display:'grid',placeItems:'center'}}><IcoPlus s={12}/></button>
        </div>
        <div style={{overflowY:'auto',flex:1,minHeight:0}}>
          {trabajos.length===0&&<div style={{padding:'20px 16px',textAlign:'center',color:'var(--k4)',fontSize:12}}>Sin trabajos aún.<br/>Haz clic en + para crear.</div>}
          {trabajos.map(t=>(<div key={t.id} onClick={()=>setSelT(t.id)} style={{padding:'10px 13px',cursor:'pointer',borderBottom:'1px solid var(--ls)',background:selT===t.id?'var(--p)':'transparent',position:'relative'}}>{selT===t.id&&<div style={{position:'absolute',left:0,top:8,bottom:8,width:3,borderRadius:'0 3px 3px 0',background:'linear-gradient(125deg,#1c6ec8,#3a26a0)'}}></div>}<div style={{fontSize:12,fontWeight:600}}>{t.titulo}</div><div style={{display:'flex',gap:6,marginTop:4,alignItems:'center'}}><span style={{fontSize:10,padding:'2px 6px',borderRadius:4,background:'var(--p2)',color:'var(--k4)',fontWeight:600,fontFamily:'monospace'}}>·{t.tipo}</span><span style={{fontSize:10,color:t.estado==='editor'||t.estado==='listo'?'var(--ok)':'var(--wn)',fontWeight:600}}>{t.estado==='generando'?'Generando…':'Listo'}</span></div>{t.estado==='generando'&&<div style={{height:2,borderRadius:2,background:'var(--p2)',marginTop:5,overflow:'hidden'}}><div style={{height:'100%',width:t.prog+'%',background:`linear-gradient(135deg,${ramos.find(r=>r.id===t.ramo)?.color||'#1654b0'}cc,${ramos.find(r=>r.id===t.ramo)?.color||'#1654b0'}77)`,transition:'width .4s',borderRadius:2}}></div></div>}</div>))}
        </div>
      </div>
      <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',background:'var(--p)',overflow:'hidden'}}>
        {!trab&&<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:10,color:'var(--k4)'}}><IcoBriefcase s={28}/><div style={{fontSize:14,fontWeight:500}}>Selecciona o crea un trabajo</div></div>}
        {trab&&(trab.estado==='generando'?(
          <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:40}}>
            <div style={{width:60,height:60,borderRadius:16,background:ramoGrad,margin:'0 auto 20px',display:'grid',placeItems:'center'}}><IcoBriefcase s={28}/></div>
            <div style={{fontSize:15,fontWeight:600,marginBottom:8}}>Generando {trab.titulo}…</div>
            <div style={{fontSize:13,color:'var(--k3)',marginBottom:20}}>La IA está redactando tu trabajo.</div>
            <div style={{width:280,height:6,borderRadius:3,background:'var(--p2)',overflow:'hidden',marginBottom:8}}><div style={{height:'100%',width:trab.prog+'%',background:ramoGrad,borderRadius:3,transition:'width .4s'}}></div></div>
            <div style={{fontSize:12,color:'var(--k4)'}}>{trab.prog}% completado</div>
          </div>
        ):(
          <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:'var(--w)'}}>
            <div style={{padding:'8px 16px',borderBottom:'1px solid var(--ln)',display:'flex',alignItems:'center',gap:4,flexShrink:0,background:'var(--w)',flexWrap:'wrap'}}>
              <input value={trab.titulo} onChange={e=>setTrabajos(p=>p.map(x=>x.id===selT?{...x,titulo:e.target.value}:x))} style={{fontSize:12,fontWeight:600,color:'var(--k)',flex:1,border:'none',outline:'none',background:'transparent',fontFamily:'inherit',minWidth:120}} placeholder="Título del trabajo"/>
              <button onClick={()=>{if(confirm('¿Eliminar este trabajo?')){setTrabajos(p=>p.filter(x=>x.id!==selT));setSelT(null);}}} style={{padding:'5px 8px',borderRadius:7,border:'1px solid var(--ln)',background:'var(--w)',cursor:'pointer',color:'var(--er)',fontSize:11,fontWeight:500,flexShrink:0}}>Eliminar</button>

              ))}
              <div style={{width:1,height:18,background:'var(--ln)',margin:'0 2px'}}/>
              {[['formatBlock','H1','<h1>'],['formatBlock','H2','<h2>'],['formatBlock','P','<p>']].map(([cmd,lbl,val])=>(

/* ═══════ CALENDARIO ═══════ */
function SecCalendario({user,ramos=[],sbCol=false}){
  const DIAS=['Lu','Ma','Mi','Ju','Vi','Sa','Do'];
  const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const _now=new Date();
  const [mes,setMes]=useState(_now.getMonth());
  const [year,setYear]=useState(_now.getFullYear());
  const [selDay,setSelDay]=useState(null);
  const [evs,setEvs]=useState([]);
  const [showAdd,setShowAdd]=useState(false);
  const [showPE,setShowPE]=useState(false);
  const [nev,setNev]=useState({t:'',k:'',f:'',tipo:'evaluacion'});

  const hoy=mes===_now.getMonth()&&year===_now.getFullYear()?_now.getDate():null;
  const off=new Date(year,mes,1).getDay();
  const adj=off===0?6:off-1;
  const tot=new Date(year,mes+1,0).getDate();
  const celdas=[...Array(adj).fill(null),...Array.from({length:tot},(_,i)=>i+1)];

  const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('es-CL',{day:'numeric',month:'short'});
  const daysLeft=d=>Math.round((new Date(d+'T12:00:00')-new Date().setHours(0,0,0,0))/86400000);

  useEffect(()=>{
    if(!supabaseClient||!user) return;
    supabaseClient.from('tasks').select('*,ramos(name,color,id)').eq('user_id',user.id).order('due_date')
      .then(({data})=>{
        if(!data) return;
        setEvs(data.map(t=>({
          id:t.id,
          t:t.title||'',
          k:t.ramo_id||t.ramos?.id||'',
          r:t.ramos?.name||'',
          c:t.ramos?.color||'#1654b0',
          rawDate:t.due_date||null,
          f:t.due_date?fmtDate(t.due_date):'',
          d:t.due_date?daysLeft(t.due_date):999,
          done:t.completed||false,
          tipo:t.type||'evaluacion',
        })));
      });
  },[user]);

  // Build EVTS map (day → events) for current month
  const EVTS={};
  evs.forEach(ev=>{
    if(!ev.rawDate) return;
    const d=new Date(ev.rawDate+'T12:00:00');
    if(d.getMonth()===mes&&d.getFullYear()===year){
      const day=d.getDate();
      if(!EVTS[day]) EVTS[day]=[];
      EVTS[day].push(ev);
    }
  });

  const togEv=async(id)=>{
    const ev=evs.find(e=>e.id===id);
    if(!ev) return;
    setEvs(p=>p.map(e=>e.id===id?{...e,done:!e.done}:e));
    if(supabaseClient) await supabaseClient.from('tasks').update({completed:!ev.done}).eq('id',id);
  };

  const delEv=async(id)=>{
    setEvs(p=>p.filter(e=>e.id!==id));
    if(supabaseClient) await supabaseClient.from('tasks').delete().eq('id',id);
  };

  const addEv=async()=>{
    if(!nev.t.trim()||!nev.f) return;
    const ramo=ramos.find(r=>r.id===nev.k);
    if(supabaseClient&&user){
      const{data,error}=await supabaseClient.from('tasks').insert({
        user_id:user.id,title:nev.t,ramo_id:nev.k||null,due_date:nev.f,completed:false,type:nev.tipo,
      }).select('*,ramos(name,color,id)').single();
      if(!error&&data){
        setEvs(p=>[...p,{
          id:data.id,t:data.title,k:data.ramo_id||'',r:data.ramos?.name||'',c:data.ramos?.color||ramo?.color||'#1654b0',
          rawDate:data.due_date,f:fmtDate(data.due_date),d:daysLeft(data.due_date),done:false,tipo:data.tipo||'evaluacion',
        }]);
      }
    }
    setNev({t:'',k:'',f:'',tipo:'evaluacion'});setShowAdd(false);
  };

  // Filtered list: if day selected show only that day's events, else all
  const filteredEvs=selDay?evs.filter(ev=>{
    if(!ev.rawDate) return false;
    const d=new Date(ev.rawDate+'T12:00:00');
    return d.getDate()===selDay&&d.getMonth()===mes&&d.getFullYear()===year;
  }):evs;

  const actEvs=filteredEvs.filter(e=>!e.done);
  const pastEvs=filteredEvs.filter(e=>e.done);

  const prevMonth=()=>{setSelDay(null);if(mes===0){setMes(11);setYear(y=>y-1);}else setMes(m=>m-1);};
  const nextMonth=()=>{setSelDay(null);if(mes===11){setMes(0);setYear(y=>y+1);}else setMes(m=>m+1);};

  return(
    <div style={{flex:1,overflowY:'auto',minWidth:0,padding:'32px 40px'}}>
      <h1 style={{fontFamily:"'Instrument Serif',serif",fontSize:38,fontWeight:400,letterSpacing:'-0.025em',lineHeight:1.05,marginBottom:28}}>Calendario.</h1>
      <div style={{display:'grid',gridTemplateColumns:'minmax(0,1fr) 300px',gap:48,alignItems:'start',width:'100%',minWidth:0}}>

        {/* Calendar grid */}
        <div style={{minWidth:0,overflow:'hidden'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <div style={{fontSize:15,fontWeight:600}}>{MESES[mes]} {year}</div>
              {selDay&&<button onClick={()=>setSelDay(null)} style={{fontSize:11,padding:'2px 8px',borderRadius:999,border:'1px solid var(--ln)',background:'var(--p2)',cursor:'pointer',color:'var(--k3)'}}>✕ {selDay} {MESES[mes].slice(0,3)}</button>}
            </div>
            <div style={{display:'flex',gap:4}}>
              <button onClick={prevMonth} style={{width:26,height:26,borderRadius:7,border:'none',background:'var(--p2)',cursor:'pointer',fontSize:14,color:'var(--k3)',display:'grid',placeItems:'center'}}>‹</button>
              <button onClick={nextMonth} style={{width:26,height:26,borderRadius:7,border:'none',background:'var(--p2)',cursor:'pointer',fontSize:14,color:'var(--k3)',display:'grid',placeItems:'center'}}>›</button>
            </div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',marginBottom:4}}>
            {DIAS.map(d=><div key={d} style={{textAlign:'center',fontSize:10,fontWeight:600,color:'var(--k4)',padding:'3px 0',letterSpacing:'.04em'}}>{d}</div>)}
          </div>
          <div key={sbCol?'c':'e'} style={{display:'grid',gridTemplateColumns:'repeat(7,minmax(0,1fr))',gap:2,width:'100%'}}>
            {celdas.map((dia,i)=>{
              const isHoy=dia===hoy&&hoy!==null;
              const isSel=dia!==null&&dia===selDay;
              const hasEvts=dia&&EVTS[dia]&&EVTS[dia].length>0;
              return(
                <div key={i} onClick={()=>dia&&setSelDay(isSel?null:dia)}
                  style={{aspectRatio:'1',borderRadius:8,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-start',paddingTop:5,fontSize:12,
                    fontWeight:isHoy?700:400,
                    background:isHoy?'linear-gradient(125deg,#0e6e72,#1654b0,#2638b8,#3a26a0)':isSel?'var(--p2)':'transparent',
                    border:isSel&&!isHoy?'1.5px solid #1654b0':'1.5px solid transparent',
                    color:isHoy?'white':dia?'var(--k)':'transparent',
                    cursor:dia?'pointer':'default',
                    transition:'background .12s',
                  }}>
                  {dia}
                  {hasEvts&&(
                    <div style={{display:'flex',gap:2,marginTop:2,flexWrap:'wrap',justifyContent:'center',padding:'0 2px'}}>
                      {EVTS[dia].slice(0,3).map((ev,j)=>(
                        <div key={j} style={{width:4,height:4,borderRadius:'50%',background:isHoy?'rgba(255,255,255,.8)':ev.done?'var(--k4)':ev.c}}/>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          {/* Legend */}
          <div style={{marginTop:12,display:'flex',gap:12,flexWrap:'wrap'}}>
            {[...new Set(evs.filter(e=>e.rawDate&&new Date(e.rawDate+'T12:00:00').getMonth()===mes).map(e=>e.k))].map(kid=>{
              const r=ramos.find(r=>r.id===kid);
              if(!r) return null;
              return <div key={kid} style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'var(--k3)'}}><div style={{width:8,height:8,borderRadius:'50%',background:r.color||'#1654b0'}}/>{r.nombre}</div>;
            })}
          </div>
        </div>

        {/* Task list */}
        <div style={{display:'flex',flexDirection:'column',gap:16}}>
          <div>
            <Hdr title={selDay?`${selDay} de ${MESES[mes]}`:'Todas las tareas'} onAdd={()=>setShowAdd(true)} lbl="Añadir"/>
            {actEvs.length===0&&<div style={{fontSize:12,color:'var(--k4)',padding:'12px 0'}}>{selDay?'Sin tareas este día.':'Sin tareas pendientes.'}</div>}
            {actEvs.map(ev=>(
              <div key={ev.id} className="eb-wrap" style={{display:'grid',gridTemplateColumns:'18px 3px 1fr auto 18px',gap:8,padding:'9px 0',borderBottom:'1px solid var(--ls)',alignItems:'center'}}>
                <button onClick={()=>togEv(ev.id)} style={{width:16,height:16,borderRadius:'50%',border:'1.5px solid var(--k4)',background:'transparent',cursor:'pointer',display:'grid',placeItems:'center',flexShrink:0}}/>
                <div style={{height:26,borderRadius:2,background:`linear-gradient(135deg,${ev.c||'#1654b0'}cc,${ev.c||'#1654b0'}77)`}}/>
                <div>
                  <div style={{fontSize:12,fontWeight:500}}>{ev.t}</div>
                  <div style={{fontSize:10,color:'var(--k3)',marginTop:1}}>{ev.r}{ev.tipo&&ev.tipo!=='evaluacion'?` · ${ev.tipo}`:''}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:11,fontWeight:700,color:ev.d<=3?'var(--er)':ev.d<=7?'var(--wn)':'var(--k3)'}}>{ev.f||'—'}</div>
                  {ev.rawDate&&<div style={{fontSize:9,color:'var(--k4)',marginTop:1}}>{ev.d>=0?`en ${ev.d}d`:`hace ${-ev.d}d`}</div>}
                </div>
                <button className="eb" onClick={()=>delEv(ev.id)} style={{width:16,height:16,border:'none',background:'transparent',cursor:'pointer',color:'var(--er)',display:'grid',placeItems:'center',borderRadius:4}}><IcoTrash s={10}/></button>
              </div>
            ))}
            {pastEvs.length>0&&(
              <button onClick={()=>setShowPE(s=>!s)} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:'var(--k4)',border:'none',background:'transparent',cursor:'pointer',padding:'6px 0'}}>
                <IcoCh dir={showPE?'d':'r'} s={10}/>{showPE?'Ocultar completadas':`Ver ${pastEvs.length} completada${pastEvs.length>1?'s':''}`}
              </button>
            )}
            {showPE&&pastEvs.map(ev=>(
              <div key={ev.id} className="eb-wrap" style={{display:'grid',gridTemplateColumns:'18px 3px 1fr auto 18px',gap:8,padding:'8px 0',borderBottom:'1px solid var(--ls)',alignItems:'center',opacity:.45}}>
                <button onClick={()=>togEv(ev.id)} style={{width:16,height:16,borderRadius:'50%',border:'none',background:'var(--ok)',cursor:'pointer',display:'grid',placeItems:'center',flexShrink:0}}><IcoOk s={9}/></button>
                <div style={{height:22,borderRadius:2,background:`linear-gradient(135deg,${ev.c||'#1654b0'}cc,${ev.c||'#1654b0'}77)`}}/>
                <div style={{fontSize:11,fontWeight:500,textDecoration:'line-through'}}>{ev.t}</div>
                <div style={{fontSize:10,color:'var(--k4)'}}>{ev.f}</div>
                <button className="eb" onClick={()=>delEv(ev.id)} style={{width:16,height:16,border:'none',background:'transparent',cursor:'pointer',color:'var(--er)',display:'grid',placeItems:'center',borderRadius:4}}><IcoTrash s={10}/></button>
              </div>
            ))}
          </div>
        </div>
      </div>

      <Modal open={showAdd} onClose={()=>setShowAdd(false)} title="Nueva tarea / evaluación" w={380}>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <Fld label="Título" value={nev.t} onChange={v=>setNev(p=>({...p,t:v}))} ph="Ej: Prueba Física 2" required/>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <Sel label="Ramo" value={nev.k} onChange={v=>setNev(p=>({...p,k:v}))} options={[{v:'',l:'Sin ramo'},...ramos.map(r=>({v:r.id,l:r.nombre||r.name||''}))]}/>
            <Sel label="Tipo" value={nev.tipo} onChange={v=>setNev(p=>({...p,tipo:v}))} options={[{v:'evaluacion',l:'Evaluación'},{v:'entrega',l:'Entrega'},{v:'tarea',l:'Tarea'},{v:'otro',l:'Otro'}]}/>
          </div>
          <div>
            <div style={{fontSize:12,fontWeight:500,color:'var(--k3)',marginBottom:4}}>Fecha</div>
            <input type="date" value={nev.f} onChange={e=>setNev(p=>({...p,f:e.target.value}))} style={{width:'100%',padding:'8px 10px',border:'1px solid var(--ln)',borderRadius:8,fontSize:13,outline:'none',background:'var(--w)',color:'var(--k)'}}/>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:4}}>
            <Btn onClick={()=>setShowAdd(false)}>Cancelar</Btn>
            <Btn onClick={addEv} variant="pri" disabled={!nev.t.trim()||!nev.f}>Añadir</Btn>
          </div>
        </div>
      </Modal>
    </div>
  );
}

function PieChart({data}){
  const total=data.reduce((a,d)=>a+d.v,0);
  let start=0;
  const slices=data.map(d=>{const pct=d.v/total;const s=start;start+=pct;return{...d,start:s,pct};});
  const r=60,cx=80,cy=80;
  const arc=(s,e,r)=>{const a1=s*2*Math.PI-Math.PI/2,a2=e*2*Math.PI-Math.PI/2;const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);const lg=e-s>0.5?1:0;return `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${lg} 1 ${x2} ${y2} Z`;};
  return(
    <svg viewBox="0 0 160 160" width={160} height={160}>
      {slices.map((s,i)=><path key={i} d={arc(s.start,s.start+s.pct,r)} fill={s.c} opacity={0.9}/>)}
      <circle cx={cx} cy={cy} r={r*0.55} fill="var(--w)"/>
      <text x={cx} y={cy-6} textAnchor="middle" style={{fontSize:18,fontWeight:700,fill:'var(--k)',fontFamily:'inherit'}}>{total.toLocaleString()}</text>
      <text x={cx} y={cy+12} textAnchor="middle" style={{fontSize:9,fill:'var(--k4)',fontFamily:'inherit'}}>mensajes IA</text>
    </svg>
  );
}

          {mode==='register'&&<>

// Helper: compute weighted grade average from evaluation_modules (1-7 scale)
function computeNota(evMods){
  let num=0,den=0;
  (evMods||[]).forEach(m=>{
    const graded=(m.items||[]).filter(it=>it.grade!=null&&it.grade!=='');
    if(graded.length>0){
      const avg=graded.reduce((a,it)=>a+Number(it.grade),0)/graded.length;
      num+=avg*(m.weight||0);den+=(m.weight||0);
    }
  });
  return den>0?parseFloat((num/den).toFixed(1)):0;
}
// Helper: normalize a raw ramo row from Supabase
function normalizeRamo(r, units, files){
  const evMods=r.evaluation_modules||r.evals||[];
  const attSessions=r.attendance_sessions||r.asist_reg||[];
  const present=attSessions.filter(s=>s.status==='present'||s.st==='presente').length;
  const asist=attSessions.length>0?Math.round((present/attSessions.length)*100):0;
  const asist_reg=attSessions.map(s=>({
    ...s,
    f:s.date||s.f||'',
    t:s.type||s.t||'Clase',
    st:s.status?(s.status==='present'?'presente':s.status==='absent'?'ausente':'tardanza'):(s.st||'ausente'),
  }));
  const temario=units?(units||[]).map(u=>({id:u.id,titulo:u.name||u.titulo||'',archivos:u.materias||u.archivos||[]})):(r.temario||[]);
  const archivos=files?(files||[]).map(f=>({id:f.id,n:f.name,f:(f.created_at||'').slice(0,10),programa:!!f.is_programa,storage_path:f.storage_path})):(r.archivos||[]);
  return {
    ...r,
    nombre:r.nombre||r.name||'',
    codigo:r.codigo||r.code||'',
    seccion:r.seccion||r.section||'',
    profesor:r.profesor||r.professor||'',
    evaluation_modules:evMods,
    nota:computeNota(evMods),
    asist,
    asist_reg,
    archivos,
    temario,
  };
}

function generateUsername(nombre,apellido1,apellido2){
  const clean=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
  const n=clean(nombre).slice(0,3);
  const a1=clean(apellido1);
  const a2=clean(apellido2).slice(0,3);
  if(!n||!a1) return '';
  return a2?`${n}.${a1}.${a2}`:`${n}.${a1}`;
}

function App(){
  const {tweaks,setTweak}=useTweaks(TWEAK_DEFAULTS);
  const [sec,setSec]=useState('inicio');
  const [sbCol,setSbCol]=useState(false);
  const [ramosCol,setRamosCol]=useState(false);
  const [ramos,setRamos]=useState(RAMOS);
  const [cuads,setCuads]=useState(CUADS_INIT);
  const [user,setUser]=useState(null);
  const [profile,setProfile]=useState(null);
  const [authLoading,setAuthLoading]=useState(!!supabaseClient);
  const dark=tweaks.theme==='dark';
  const tv=dark?{'--w':'#1c1c1e','--p':'#111113','--p2':'#2c2c2e','--ln':'rgba(255,255,255,.09)','--ls':'rgba(255,255,255,.05)','--k':'#f5f5f7','--k2':'#ebebef','--k3':'#adadb0','--k4':'#8e8e93','--ok':'#30d158','--wn':'#ff9f0a','--er':'#ff453a','--header-bg':'rgba(28,28,30,.92)',background:'#111113',color:'var(--k)'}:{background:'#f5f5f7','--header-bg':'rgba(255,255,255,.88)',color:'var(--k)'};

  useEffect(()=>{
    if(!supabaseClient){setAuthLoading(false);return;}
    supabaseClient.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user??null);
      setAuthLoading(false);
    });
    const{data:{subscription}}=supabaseClient.auth.onAuthStateChange((_,session)=>{
      setUser(session?.user??null);
    });
    return()=>subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if(!user||!supabaseClient){setProfile(null);setRamos([]);setCuads([]);return;}
    supabaseClient.from('profiles').select('name,apellido1,apellido2,carrera,study_year,university,subscription_status,username').eq('id',user.id).single()
      .then(({data})=>setProfile(data));
    Promise.all([
      supabaseClient.from('ramos').select('*').eq('user_id',user.id).order('created_at'),
      supabaseClient.from('units').select('*').eq('user_id',user.id).order('"order"'),
      supabaseClient.from('ramo_files').select('*').eq('user_id',user.id),
    ]).then(([{data},{data:unitsData},{data:filesData}])=>{
        const allUnits=unitsData||[];
        const allFiles=filesData||[];
        const normalized=(data||[]).map(r=>normalizeRamo(r,allUnits.filter(u=>u.ramo_id===r.id),allFiles.filter(f=>f.ramo_id===r.id)));
        setRamos(normalized);RAMOS.length=0;RAMOS.push(...normalized);
        // Load cuads AFTER ramos so RAMOS[] is populated for color lookup
        return Promise.all([
          supabaseClient.from('learning_models').select('id,name,color,ramo_id').eq('user_id',user.id).order('created_at'),
          supabaseClient.from('aprender_blocks').select('id,project_id,title,"order",created_at').eq('user_id',user.id).order('order'),
          supabaseClient.from('aprender_block_chats').select('id,block_id').eq('user_id',user.id)
        ]);
      }).then(results=>{
        if(!results) return;
        const [{data:models},{data:blocks},{data:chats}]=results;
        if(!models) return;
        const blocksByProject={};
        (blocks||[]).forEach(b=>{if(!blocksByProject[b.project_id])blocksByProject[b.project_id]=[];blocksByProject[b.project_id].push(b);});
        const chatsByBlock={};
        (chats||[]).forEach(c=>{chatsByBlock[c.block_id]=(chatsByBlock[c.block_id]||0)+1;});
        setCuads(models.map(lm=>{
          const ramoColor=lm.ramo_id?RAMOS.find(r=>r.id===lm.ramo_id)?.color:null;
          const color=ramoColor||lm.color||'#1654b0';
          return {
            rid:lm.id,nombre:lm.name,color,ramoId:lm.ramo_id,
            bloques:(blocksByProject[lm.id]||[]).sort((a,b)=>a.order-b.order).map(ab=>({
              id:ab.id,t:ab.title,s:'',msgs:chatsByBlock[ab.id]||0,
              ts:(chatsByBlock[ab.id]||0)>0?'activo':'vacío',color
            }))
          };
        }));
      });
  },[user]);

  // Sync cuad colors to ramo colors when ramos load (handles race condition)
  useEffect(()=>{
    if(!ramos.length) return;
    setCuads(prev=>prev.map(c=>{
      if(!c.ramoId) return c;
      const rc=ramos.find(r=>r.id===c.ramoId)?.color;
      if(!rc||rc===c.color) return c;
      return {...c,color:rc,bloques:c.bloques.map(b=>({...b,color:rc}))};
    }));
  },[ramos]);

  const handleNav=id=>{
    if(id==='aprender-tutorial'){setSec('aprender');}else{setSec(id);}
  };

  const bibRid=sec.startsWith('bib-')?sec.slice(4):sec==='biblioteca'?null:null;

  if(authLoading) return <div style={{display:'grid',placeItems:'center',height:'100%',fontSize:14,color:'var(--k4)',background:'var(--p)'}}>Cargando…</div>;
  if(!user&&supabaseClient) return <LoginScreen/>;

  return(
    <div style={{display:'flex',width:'100%',height:'100%',overflow:'hidden',...tv}}>
      <Sidebar active={sec} onNav={handleNav} collapsed={sbCol} setCollapsed={setSbCol} profile={profile}/>
      <div style={{flex:1,overflow:'hidden',minWidth:0,minHeight:0,display:'flex',flexDirection:'column'}}>
          <Topbar sec={sec} sbCol={sbCol} onShow={()=>setSbCol(false)}/>
          <div style={{flex:1,overflow:'hidden',minHeight:0,display:'flex'}}>
            {sec==='inicio'&&<SecInicio onNav={handleNav} cuads={cuads} user={user} profile={profile} ramos={ramos}/>}
            {sec==='ramos'&&<SecRamos ramos={ramos} setRamos={setRamos} colC={ramosCol} setColC={setRamosCol} user={user}/>}
            {sec==='aprender'&&<SecAprender cuads={cuads} setCuads={setCuads} user={user} ramos={ramos}/>}
            {sec==='calendario'&&<SecCalendario user={user} ramos={ramos} sbCol={sbCol}/>}
            {sec==='yo'&&<SecYo tweaks={tweaks} setTweak={setTweak} onNav={handleNav} user={user} profile={profile} ramos={ramos}/>}
            {sec==='ejercicios'&&<SecEjercicios ramos={ramos} user={user}/>}
            {sec==='apuntes'&&<SecApuntes ramos={ramos}/>}
            {sec==='trabajos'&&<SecTrabajos ramos={ramos} user={user}/>}
            {(sec==='biblioteca'||sec.startsWith('bib-'))&&<SecBiblioteca initRid={sec.startsWith('bib-')?sec.slice(4):null} ramos={ramos}/>}
          </div>
      </div>
      <TweaksPanel>
        <div style={{fontSize:10,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'rgba(41,38,27,.38)'}}>Apariencia</div>
        <TwkRadio label="Modo" value={tweaks.theme} options={['light','dark']} onChange={v=>setTweak('theme',v)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
