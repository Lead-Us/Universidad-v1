function useTweaks(defaults){
  const [v,setV]=useState(()=>{try{const s=localStorage.getItem('app_tweaks');return s?{...defaults,...JSON.parse(s)}:defaults;}catch{return defaults;}});
  const set=useCallback((k,val)=>{const e=typeof k==='object'?k:{[k]:val};setV(p=>{const next={...p,...e};try{localStorage.setItem('app_tweaks',JSON.stringify(next));}catch{}return next;});window.parent.postMessage({type:'__edit_mode_set_keys',edits:e},'*');},[]);
  return {tweaks:v,setTweak:set};
}
function TweaksPanel({children}){
  const [open,setOpen]=useState(false);
  useEffect(()=>{const h=e=>{if(e?.data?.type==='__activate_edit_mode')setOpen(true);if(e?.data?.type==='__deactivate_edit_mode')setOpen(false);};window.addEventListener('message',h);window.parent.postMessage({type:'__edit_mode_available'},'*');return()=>window.removeEventListener('message',h);},[]);
  const dismiss=()=>{setOpen(false);window.parent.postMessage({type:'__edit_mode_dismissed'},'*');};
  if(!open) return null;
  return(<div style={{position:'fixed',right:14,bottom:14,zIndex:9999,width:240,background:'rgba(250,249,247,.94)',backdropFilter:'blur(20px)',border:'.5px solid rgba(255,255,255,.6)',borderRadius:13,boxShadow:'0 12px 40px rgba(0,0,0,.18)',font:'11.5px/1.4 ui-sans-serif,system-ui,sans-serif',overflow:'hidden'}}><div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 8px 9px 13px',borderBottom:'.5px solid rgba(0,0,0,.08)'}}><b style={{fontSize:12,fontWeight:600}}>Tweaks</b><button onClick={dismiss} style={{appearance:'none',border:0,background:'transparent',color:'rgba(41,38,27,.5)',width:20,height:20,borderRadius:5,cursor:'pointer',fontSize:12}}>✕</button></div><div style={{padding:'8px 13px 13px',display:'flex',flexDirection:'column',gap:9}}>{children}</div></div>);
}

/* ═══════ MARKDOWN-LIKE CHAT RENDERER ═══════ */
function ChatMsg({text}){
  // Renders headers, bold, code blocks, inline code, and math blocks
  const lines=text.split('\n');
  const out=[];let codeBlock=[];let inCode=false;let codeKey=0;
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    if(l.startsWith('```')){
      if(inCode){out.push(<pre key={`code-${codeKey++}`} style={{background:'var(--p2)',borderRadius:8,padding:'12px 14px',fontSize:12,fontFamily:'ui-monospace,monospace',overflowX:'auto',margin:'8px 0',lineHeight:1.6,whiteSpace:'pre-wrap'}}>{codeBlock.join('\n')}</pre>);codeBlock=[];inCode=false;}else{inCode=true;}continue;
    }
    if(inCode){codeBlock.push(l);continue;}
    // Math block $$...$$
    if(l.startsWith('$$')&&l.endsWith('$$')&&l.length>4){out.push(<div key={i} style={{background:'rgba(22,84,176,.06)',borderRadius:8,padding:'10px 14px',margin:'6px 0',fontFamily:'ui-monospace,monospace',fontSize:13,color:'#1654b0',textAlign:'center'}}>{l.slice(2,-2)}</div>);continue;}
    if(l.startsWith('$$')){out.push(<div key={i} style={{fontFamily:'ui-monospace,monospace',fontSize:13,color:'#1654b0',padding:'2px 0'}}>{l.slice(2)}</div>);continue;}
    if(l===''){out.push(<div key={i} style={{height:6}}/>);continue;}
    // Heading
    if(l.startsWith('### ')){out.push(<div key={i} style={{fontWeight:700,fontSize:13,marginTop:8,marginBottom:2,color:'var(--k)'}}>{l.slice(4)}</div>);continue;}
    if(l.startsWith('## ')){out.push(<div key={i} style={{fontWeight:700,fontSize:14,marginTop:8,marginBottom:2,color:'var(--k)'}}>{l.slice(3)}</div>);continue;}
    // Regular line with inline formatting
    out.push(<div key={i} style={{lineHeight:1.65}}>{renderInline(l)}</div>);
  }
  return <>{out}</>;
}
function renderInline(text){
  const parts=[];let rem=text;let ki=0;
  while(rem.length>0){
    // boxed result
    const bm=rem.match(/\\boxed\{([^}]+)\}/);
    // bold
    const bld=rem.match(/\*\*(.+?)\*\*/);
    // inline math $...$
    const mth=rem.match(/\$([^$]+)\$/);
    // inline code `...`
    const cod=rem.match(/`([^`]+)`/);
    const candidates=[bm&&{idx:rem.indexOf('\\boxed{'),type:'boxed',m:bm},bld&&{idx:rem.indexOf('**'),type:'bold',m:bld},mth&&{idx:rem.indexOf('$'),type:'math',m:mth},cod&&{idx:rem.indexOf('`'),type:'code',m:cod}].filter(Boolean);
    if(candidates.length===0){parts.push(rem);break;}
    const first=candidates.reduce((a,b)=>a.idx<=b.idx?a:b);
    if(first.idx>0) parts.push(rem.slice(0,first.idx));
    if(first.type==='boxed') parts.push(<span key={ki++} style={{background:'rgba(22,84,176,.1)',color:'#1654b0',borderRadius:5,padding:'2px 7px',fontFamily:'ui-monospace,monospace',fontSize:12,fontWeight:700}}>{first.m[1]}</span>);
    else if(first.type==='bold') parts.push(<strong key={ki++}>{first.m[1]}</strong>);
    else if(first.type==='math') parts.push(<code key={ki++} style={{fontFamily:'ui-monospace,monospace',fontSize:12,background:'rgba(22,84,176,.07)',color:'#1654b0',padding:'1px 5px',borderRadius:4}}>{first.m[1]}</code>);
    else if(first.type==='code') parts.push(<code key={ki++} style={{fontFamily:'ui-monospace,monospace',fontSize:12,background:'var(--p2)',color:'var(--k)',padding:'1px 5px',borderRadius:4}}>{first.m[1]}</code>);
    rem=rem.slice(first.idx+first.m[0].length);
  }
  return parts;
}

/* ═══════ HORARIO MODAL ═══════ */
function HorarioModal({open,onClose,semana,horStart,horEnd,horHeight,onViewChange,schedule=[],setSchedule,user}){
  const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb'];
  const TIPOS=['Cátedra','Laboratorio','Ayudantía','Taller','Otro'];
  const DIA_IDX={Lun:0,Mar:1,'Mié':2,Jue:3,Vie:4,'Sáb':5};
  const TIPO_DB={Cátedra:'catedra',Laboratorio:'laboratorio','Ayudantía':'ayudantia',Taller:'taller',Otro:'otro'};
  const TIPO_LABEL={catedra:'Cátedra',laboratorio:'Laboratorio',ayudantia:'Ayudantía',taller:'Taller',otro:'Otro'};
  const [vs,setVs]=useState(horStart||8);
  const [ve,setVe]=useState(horEnd||18);
  const [vh,setVh]=useState(horHeight||200);
  const [bloques,setBloques]=useState([]);
  const [editId,setEditId]=useState(null);
  const [showAdd,setShowAdd]=useState(false);
  const [saving,setSaving]=useState(false);
  const emptyBloque={tipo:'Cátedra',horaInicio:'08:00',horaFin:'09:30',sala:'',ramo:'',dias:[]};
  const [form,setForm]=useState(emptyBloque);

  // Cargar bloques desde Supabase cada vez que se abre el modal
  useEffect(()=>{
    if(!open) return;
    const DIA_LBL={0:'Lun',1:'Mar',2:'Mié',3:'Jue',4:'Vie',5:'Sáb'};
    const groups={};
    (schedule||[]).forEach(s=>{
      const key=`${s.ramo_id}|${s.start_time}|${s.end_time}|${s.block_type||''}|${s.sala||''}`;
      if(!groups[key]) groups[key]={dbIds:[],tipo:TIPO_LABEL[s.block_type]||'Cátedra',horaInicio:s.start_time||'',horaFin:s.end_time||'',sala:s.sala||'',ramo:s.ramo_id||'',dias:[]};
      if(DIA_LBL[s.day_of_week]) groups[key].dias.push(DIA_LBL[s.day_of_week]);
      groups[key].dbIds.push(s.id);
    });
    setBloques(Object.entries(groups).map(([key,g])=>({id:key,...g})));
  },[open]);

  const saveBloque=async()=>{
    if(form.dias.length===0) return;
    setSaving(true);
    const tipoDb=TIPO_DB[form.tipo]||'catedra';
    // Si es edición, primero borramos los rows anteriores
    if(editId){
      const old=bloques.find(b=>b.id===editId);
      if(old?.dbIds?.length&&supabaseClient) await supabaseClient.from('schedule').delete().in('id',old.dbIds);
    }
    const rows=form.dias.map(d=>({
      user_id:user?.id,
      ramo_id:form.ramo||null,
      day_of_week:DIA_IDX[d]??0,
      start_time:form.horaInicio,
      end_time:form.horaFin,
      block_type:tipoDb,
      sala:form.sala||null,
    }));
    let newRows=rows;
    if(supabaseClient&&user){
      const{data}=await supabaseClient.from('schedule').insert(rows).select('*,ramos(name,color)');
      if(data) newRows=data;
      // Actualizar estado local de schedule
      if(editId){
        const old=bloques.find(b=>b.id===editId);
        setSchedule(prev=>(prev||[]).filter(s=>!old?.dbIds?.includes(s.id)).concat(newRows));
      } else {
        setSchedule(prev=>[...(prev||[]),...newRows]);
      }
    }
    const newId=Date.now()+'';
    const newBl={id:newId,dbIds:newRows.map(r=>r.id||r),tipo:form.tipo,horaInicio:form.horaInicio,horaFin:form.horaFin,sala:form.sala,ramo:form.ramo,dias:[...form.dias]};
    if(editId){setBloques(prev=>prev.map(b=>b.id===editId?newBl:b));setEditId(null);}
    else{setBloques(prev=>[...prev,newBl]);}
    setForm(emptyBloque);setShowAdd(false);setSaving(false);
  };

  const delBloque=async(id)=>{
    const b=bloques.find(x=>x.id===id);
    if(b?.dbIds?.length&&supabaseClient){
      await supabaseClient.from('schedule').delete().in('id',b.dbIds);
      setSchedule(prev=>(prev||[]).filter(s=>!b.dbIds.includes(s.id)));
    }
    setBloques(prev=>prev.filter(x=>x.id!==id));
  };

  const startEdit=b=>{setForm({tipo:b.tipo||'Cátedra',horaInicio:b.horaInicio||'08:00',horaFin:b.horaFin||'09:30',sala:b.sala||'',ramo:b.ramo||'',dias:Array.isArray(b.dias)?[...b.dias]:[]});setEditId(b.id);setShowAdd(true);};
  const toggleDia=d=>setForm(p=>({...p,dias:p.dias.includes(d)?p.dias.filter(x=>x!==d):[...p.dias,d]}));

  return(
    <Modal open={open} onClose={onClose} title="Personalizar horario semanal" w={580}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontSize:12,color:'var(--k3)'}}>{bloques.length} bloque{bloques.length!==1?'s':''} configurado{bloques.length!==1?'s':''}</div>
          <Btn onClick={()=>{setForm(emptyBloque);setEditId(null);setShowAdd(true);}} variant="pri" size="sm"><IcoPlus s={11}/>Nuevo bloque</Btn>
        </div>
        {bloques.map(b=>{const ramo=RAMOS.find(r=>r.id===b.ramo);return(
          <div key={b.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderRadius:10,background:'var(--p)',border:'1px solid var(--ls)'}}>
            <div style={{width:14,height:14,borderRadius:3,background:`linear-gradient(135deg,${ramo?.color||'#1654b0'}cc,${ramo?.color||'#1654b0'}77)`,flexShrink:0}}></div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600}}>{ramo?.nombre||ramo?.name||'—'} <span style={{fontWeight:400,color:'var(--k3)'}}>· {b.tipo}</span></div>
              <div style={{fontSize:11,color:'var(--k4)',marginTop:2}}>{b.dias.join(', ')} · {b.horaInicio}–{b.horaFin}{b.sala?` · ${b.sala}`:''}</div>
            </div>
            <button onClick={()=>startEdit(b)} style={{width:26,height:26,borderRadius:7,border:'none',background:'var(--p2)',cursor:'pointer',display:'grid',placeItems:'center',color:'var(--k3)'}}><IcoEdit s={12}/></button>
            <button onClick={()=>delBloque(b.id)} style={{width:26,height:26,borderRadius:7,border:'none',background:'transparent',cursor:'pointer',display:'grid',placeItems:'center',color:'var(--er)'}}><IcoTrash s={12}/></button>
          </div>
        );})}
        {showAdd&&(
          <div style={{padding:'16px',borderRadius:12,background:'var(--w)',border:'1.5px solid rgba(22,84,176,.25)',marginTop:4}}>
            <div style={{fontSize:13,fontWeight:600,marginBottom:12,color:'#1654b0'}}>{editId?'Editar bloque':'Nuevo bloque'}</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
              <Sel label="Ramo" value={form.ramo} onChange={v=>setForm(p=>({...p,ramo:v}))} options={[{v:'',l:'— Sin ramo —'},...RAMOS.map(r=>({v:r.id,l:r.nombre||r.name||''}))]}/>
              <Sel label="Tipo" value={form.tipo} onChange={v=>setForm(p=>({...p,tipo:v}))} options={TIPOS.map(t=>({v:t,l:t}))}/>
              <Fld label="Hora inicio" value={form.horaInicio} onChange={v=>setForm(p=>({...p,horaInicio:v}))} ph="08:00"/>
              <Fld label="Hora fin" value={form.horaFin} onChange={v=>setForm(p=>({...p,horaFin:v}))} ph="09:30"/>
              <Fld label="Sala" value={form.sala} onChange={v=>setForm(p=>({...p,sala:v}))} ph="A-204"/>
            </div>
            <div style={{marginBottom:12}}>
              <div style={{fontSize:12,fontWeight:500,color:'var(--k3)',marginBottom:6}}>Días de la semana <span style={{color:'var(--er)'}}>*</span></div>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {DIAS.map(d=>(
                  <button key={d} onClick={()=>toggleDia(d)} style={{padding:'5px 12px',borderRadius:7,border:`1.5px solid ${form.dias.includes(d)?'#1654b0':'var(--ln)'}`,background:form.dias.includes(d)?'rgba(22,84,176,.09)':'var(--p)',fontSize:12,fontWeight:form.dias.includes(d)?600:400,color:form.dias.includes(d)?'#1654b0':'var(--k3)',cursor:'pointer'}}>
                    {d}
                  </button>
                ))}
              </div>
              {form.dias.length>=2&&<div style={{marginTop:6,fontSize:11,color:'var(--k3)'}}>Se crearán {form.dias.length} bloques a la vez.</div>}
            </div>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
              <Btn onClick={()=>{setShowAdd(false);setEditId(null);setForm(emptyBloque);}}>Cancelar</Btn>
              <Btn onClick={saveBloque} variant="pri" disabled={saving||form.dias.length===0}>{saving?'Guardando…':editId?'Guardar cambios':`Crear${form.dias.length>1?` (${form.dias.length} bloques)`:''}`}</Btn>
            </div>
          </div>
        )}
        {/* Vista del horario */}
        <div style={{marginTop:4,padding:'14px 16px',borderRadius:12,background:'var(--p)',border:'1px solid var(--ls)'}}>
          <div style={{fontSize:12,fontWeight:600,color:'var(--k)',marginBottom:12}}>Vista del horario</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:12}}>
            <div>
              <div style={{fontSize:11,fontWeight:500,color:'var(--k3)',marginBottom:4}}>Hora inicio</div>
              <select value={vs} onChange={e=>setVs(parseInt(e.target.value))} style={{width:'100%',padding:'6px 8px',borderRadius:7,border:'1px solid var(--ln)',background:'var(--w)',color:'var(--k)',fontSize:12}}>
                {Array.from({length:16},(_,i)=>i+5).map(h=><option key={h} value={h}>{String(h).padStart(2,'0')}:00</option>)}
              </select>
            </div>
            <div>
              <div style={{fontSize:11,fontWeight:500,color:'var(--k3)',marginBottom:4}}>Hora fin</div>
              <select value={ve} onChange={e=>setVe(parseInt(e.target.value))} style={{width:'100%',padding:'6px 8px',borderRadius:7,border:'1px solid var(--ln)',background:'var(--w)',color:'var(--k)',fontSize:12}}>
                {Array.from({length:16},(_,i)=>i+6).map(h=><option key={h} value={h}>{String(h).padStart(2,'0')}:00</option>)}
              </select>
            </div>
            <div>
              <div style={{fontSize:11,fontWeight:500,color:'var(--k3)',marginBottom:4}}>Alto ({vh}px)</div>
              <input type="range" min={120} max={500} step={10} value={vh} onChange={e=>setVh(parseInt(e.target.value))} style={{width:'100%',marginTop:6}}/>
            </div>
          </div>
          <div style={{display:'flex',justifyContent:'flex-end'}}>
            <Btn onClick={()=>onViewChange(vs,ve,vh)} variant="pri" size="sm">Aplicar vista</Btn>
          </div>
        </div>
        <div style={{display:'flex',justifyContent:'flex-end',marginTop:4}}>
          <Btn onClick={onClose} variant="pri">Cerrar</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ═══════ RAMOS ═══════ */
function RamoColorPicker({value,onChange,colors}){
  return(<div><div style={{fontSize:12,fontWeight:500,color:'var(--k3)',marginBottom:8}}>Color identificador</div><div style={{display:'flex',gap:8,flexWrap:'wrap'}}>{colors.map(c=>(<button key={c} onClick={()=>onChange(c)} style={{width:26,height:26,borderRadius:'50%',border:value===c?`3px solid ${c}`:'2px solid transparent',outline:value===c?'2px solid var(--w)':'none',outlineOffset:'-4px',background:c,cursor:'pointer',boxShadow:value===c?`0 0 0 2px ${c}`:'none'}}/>))}</div></div>);
}

function SecRamos({ramos,setRamos,colC,setColC,user}){
  const [rid,setRid]=useState(null);
  const [tab,setTab]=useState('notas');
  const [showAddRamo,setShowAddRamo]=useState(false);
  const [showEditRamo,setShowEditRamo]=useState(false);
  const [editRamoData,setEditRamoData]=useState({id:'',nombre:'',codigo:'',profesor:'',seccion:'',color:'#1654b0',credits:''});
  const RAMO_COLORS=['#b00d6e','#1654b0','#0e6e72','#8b5cf6','#b25e09','#d70015','#1a8a82'];
  const [nRamo,setNRamo]=useState({nombre:'',codigo:'',profesor:'',seccion:'',color:'#1654b0',credits:''});
  const ramo=ramos.find(r=>r.id===rid)||(rid===null?ramos[0]:undefined);
  const ramoGrad=c=>`linear-gradient(135deg,${c}cc,${c}77)`;

  const updateRamo=async(rid,patch)=>{
    const extra={};
    if(patch.evaluation_modules) extra.nota=computeNota(patch.evaluation_modules);
    if(patch.attendance_sessions){
      const p=patch.attendance_sessions.filter(s=>s.status==='present').length;
      extra.asist=patch.attendance_sessions.length>0?Math.round((p/patch.attendance_sessions.length)*100):0;
      extra.asist_reg=patch.attendance_sessions.map(s=>({...s,f:s.date||s.f||'',t:s.type||s.t||'Clase',st:s.status==='present'?'presente':s.status==='absent'?'ausente':'tardanza'}));
    }
    setRamos(prev=>prev.map(r=>r.id===rid?{...r,...patch,...extra}:r));
    RAMOS.forEach((r,i)=>{if(r.id===rid)RAMOS[i]={...RAMOS[i],...patch,...extra};});
    if(supabaseClient&&user){
      const DB_FIELDS=['evaluation_modules','attendance_sessions','name','code','professor','section','credits','color','classroom'];
      const dbPatch={};
      DB_FIELDS.forEach(f=>{if(patch[f]!==undefined)dbPatch[f]=patch[f];});
      if(Object.keys(dbPatch).length>0) await supabaseClient.from('ramos').update(dbPatch).eq('id',rid);
    }
  };

  const openEditRamo=(r,e)=>{
    e.stopPropagation();
    setEditRamoData({id:r.id,nombre:r.nombre||r.name||'',codigo:r.codigo||r.code||'',
      profesor:r.profesor||r.professor||'',seccion:r.seccion||r.section||'',
      color:r.color||'#1654b0',credits:r.credits!=null?String(r.credits):''});
    setShowEditRamo(true);
  };

  const saveEditRamo=async()=>{
    if(!editRamoData.nombre.trim()) return;
    const patch={
      name:editRamoData.nombre.trim(),code:editRamoData.codigo||null,
      professor:editRamoData.profesor||null,section:editRamoData.seccion||null,
      color:editRamoData.color,credits:editRamoData.credits?parseInt(editRamoData.credits):null,
      // also update friendly aliases in state
      nombre:editRamoData.nombre.trim(),codigo:editRamoData.codigo,
      profesor:editRamoData.profesor,seccion:editRamoData.seccion,
    };
    await updateRamo(editRamoData.id,patch);
    setShowEditRamo(false);
  };

  const deleteRamo=async(id)=>{
    if(!confirm('¿Eliminar este ramo? Se borrarán todas sus evaluaciones y registros.')) return;
    setRamos(p=>p.filter(r=>r.id!==id));
    RAMOS.splice(RAMOS.findIndex(r=>r.id===id),1);
    if(rid===id) setRid(null);
    if(supabaseClient) await supabaseClient.from('ramos').delete().eq('id',id);
  };

  const addRamo=async()=>{
    if(!nRamo.nombre) return;
    if(supabaseClient&&user){
      const{data,error}=await supabaseClient.from('ramos').insert({
        user_id:user.id,name:nRamo.nombre,code:nRamo.codigo||null,
        professor:nRamo.profesor||null,section:nRamo.seccion||null,
        color:nRamo.color,credits:nRamo.credits?parseInt(nRamo.credits):null,
        evaluation_modules:[],attendance_sessions:[]
      }).select().single();
      if(!error&&data){
        setRamos(p=>[...p,normalizeRamo(data,[],[])]);setRid(data.id);
      }
    } else {
      const id='r'+Date.now();
      setRamos(p=>[...p,{id,nombre:nRamo.nombre,codigo:nRamo.codigo,seccion:nRamo.seccion||'001',profesor:nRamo.profesor,color:nRamo.color,credits:nRamo.credits?parseInt(nRamo.credits):null,nota:0,asist:0,evaluation_modules:[],asist_reg:[],archivos:[],temario:[]}]);
      setRid(id);
    }
    setShowAddRamo(false);setNRamo({nombre:'',codigo:'',profesor:'',seccion:'',color:'#1654b0',credits:''});
  };

  return(<>
    <div style={{display:'flex',flex:1,overflow:'hidden'}}>
      <div style={{width:colC?0:224,minWidth:colC?0:224,transition:'width .2s,min-width .2s',overflow:'hidden',borderRight:'1px solid var(--ln)',background:'var(--w)',display:'flex',flexDirection:'column',flexShrink:0}}>
        <div style={{width:224,display:'flex',flexDirection:'column',height:'100%'}}>
          <div style={{padding:'14px 14px 8px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
            <div style={{fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--k4)'}}>Semestre 2025-1</div>
            <div style={{display:'flex',gap:4}}>
              <button onClick={()=>setShowAddRamo(true)} style={{width:22,height:22,borderRadius:6,border:'none',background:'transparent',cursor:'pointer',color:'var(--k3)',display:'grid',placeItems:'center'}}><IcoPlus s={12}/></button>
              <button onClick={()=>setColC(true)} style={{width:22,height:22,borderRadius:6,border:'none',background:'transparent',cursor:'pointer',color:'var(--k3)',display:'grid',placeItems:'center'}}><IcoCh dir="l" s={12}/></button>
            </div>
          </div>
          <div style={{overflowY:'auto',flex:1,minHeight:0}}>
            {ramos.length===0&&<div style={{padding:'20px 16px',textAlign:'center',color:'var(--k4)',fontSize:12}}>Sin ramos.<br/>Haz clic en + para añadir.</div>}
            {ramos.map(r=>(<div key={r.id} className="eb-wrap" onClick={()=>{setRid(r.id);setTab('notas');}} style={{padding:'11px 14px',cursor:'pointer',background:rid===r.id?'var(--p)':'transparent',borderBottom:'1px solid var(--ls)',position:'relative'}}>
              {rid===r.id&&<div style={{position:'absolute',left:0,top:8,bottom:8,width:3,borderRadius:'0 3px 3px 0',background:'linear-gradient(125deg,#1c6ec8,#3a26a0)'}}></div>}
              <div style={{display:'flex',alignItems:'center',gap:9}}>
                <div style={{width:18,height:24,borderRadius:4,background:ramoGrad(r.color||'#1654b0'),flexShrink:0}}></div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.nombre}</div>
                  <div style={{fontSize:10,color:'var(--k3)',marginTop:1}}>{r.codigo||''}{r.seccion?` · Sec ${r.seccion}`:''}{r.credits?` · ${r.credits} cr.`:''}</div>
                </div>
                <button className="eb" onClick={e=>openEditRamo(r,e)} style={{width:20,height:20,border:'none',background:'transparent',cursor:'pointer',color:'var(--k4)',display:'grid',placeItems:'center',borderRadius:4,flexShrink:0}}><IcoEdit s={11}/></button>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:7,fontSize:11}}><span style={{color:'var(--k4)'}}>Promedio</span><span style={{fontWeight:700,color:nc(r.nota||0)}}>{(r.nota||0).toFixed(1)}</span></div>
              <div style={{marginTop:4,height:2,borderRadius:2,background:'var(--p2)',overflow:'hidden'}}><div style={{height:'100%',width:`${r.asist||0}%`,background:ramoGrad(r.color||'#1654b0'),borderRadius:2}}></div></div>
              <div style={{fontSize:9.5,color:'var(--k4)',marginTop:2}}>Asistencia {r.asist||0}%</div>
            </div>))}
          </div>
        </div>
      </div>
      {colC&&<button onClick={()=>setColC(false)} style={{width:28,flexShrink:0,border:'none',borderRight:'1px solid var(--ln)',background:'var(--w)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--k4)'}}><IcoCh s={12}/></button>}
      <div style={{flex:1,overflowY:'auto',background:'var(--p)',display:'flex',flexDirection:'column',minHeight:0}}>
        {!ramo?<div style={{display:'grid',placeItems:'center',height:'100%',color:'var(--k4)',fontSize:13}}>Selecciona o crea un ramo</div>:(<>
        <div style={{background:'var(--w)',borderBottom:'1px solid var(--ln)',padding:'18px 28px 0',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:14}}>
            <div style={{width:28,height:36,borderRadius:7,background:ramoGrad(ramo.color||'#1654b0'),flexShrink:0,boxShadow:`0 6px 16px -6px ${ramo.color||'#1654b0'}80`}}></div>
            <div style={{flex:1}}>
              <h2 style={{fontSize:20,fontWeight:600,letterSpacing:'-0.022em'}}>{ramo.nombre}</h2>
              <div style={{fontSize:12,color:'var(--k3)',marginTop:2}}>{[ramo.codigo,ramo.seccion&&`Sec ${ramo.seccion}`,ramo.profesor].filter(Boolean).join(' · ')}</div>
            </div>
            <div style={{display:'flex',gap:16,alignItems:'center'}}>
              {ramo.credits&&<div style={{textAlign:'center'}}><div style={{fontSize:22,fontWeight:700,color:'var(--k2)'}}>{ramo.credits}</div><div style={{fontSize:10,color:'var(--k3)',marginTop:1}}>créditos</div></div>}
              <div style={{textAlign:'center'}}><div style={{fontSize:24,fontWeight:700,color:nc(ramo.nota||0)}}>{(ramo.nota||0).toFixed(1)}</div><div style={{fontSize:10,color:'var(--k3)',marginTop:1}}>Promedio</div></div>
              <div style={{textAlign:'center'}}><div style={{fontSize:24,fontWeight:700}}>{ramo.asist||0}%</div><div style={{fontSize:10,color:'var(--k3)',marginTop:1}}>Asistencia</div></div>
              <button onClick={e=>openEditRamo(ramo,e)} style={{padding:'6px 12px',borderRadius:8,border:'1px solid var(--ln)',background:'var(--p)',cursor:'pointer',fontSize:12,color:'var(--k3)',display:'flex',alignItems:'center',gap:5}}><IcoEdit s={12}/>Editar</button>
            </div>
          </div>
          <div style={{display:'flex',marginLeft:-28,paddingLeft:28}}>
            {['notas','asistencia','archivos','temario'].map(t=>(<button key={t} onClick={()=>setTab(t)} style={{padding:'7px 18px',fontSize:13,fontWeight:500,border:'none',background:'transparent',cursor:'pointer',color:tab===t?'var(--k)':'var(--k3)',borderBottom:tab===t?`2px solid ${ramo.color||'#1654b0'}`:'2px solid transparent',marginBottom:-1,transition:'all .15s',textTransform:'capitalize'}}>{t}</button>))}
          </div>
        </div>
        <div style={{padding:'24px 28px',flex:1}}>
          {tab==='notas'&&<TabNotas ramo={ramo} updateRamo={updateRamo}/>}
          {tab==='asistencia'&&<TabAsist ramo={ramo} updateRamo={updateRamo}/>}
          {tab==='archivos'&&<TabArch ramo={ramo} user={user} setRamos={setRamos}/>}
          {tab==='temario'&&<TabTemario ramo={ramo} updateRamo={updateRamo} user={user} setRamos={setRamos}/>}
        </div>
        </>)}
      </div>
    </div>
      <Modal open={showAddRamo} onClose={()=>setShowAddRamo(false)} title="Nuevo ramo" w={440}>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <Fld label="Nombre del ramo" value={nRamo.nombre} onChange={v=>setNRamo(p=>({...p,nombre:v}))} ph="Ej: Álgebra Lineal" required/>
            <Fld label="Código" value={nRamo.codigo} onChange={v=>setNRamo(p=>({...p,codigo:v}))} ph="Ej: MAT201"/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <Fld label="Profesor" value={nRamo.profesor} onChange={v=>setNRamo(p=>({...p,profesor:v}))} ph="Dr. Juan Pérez"/>
            <Fld label="Sección" value={nRamo.seccion} onChange={v=>setNRamo(p=>({...p,seccion:v}))} ph="001"/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <Fld label="Créditos SCT" value={nRamo.credits} onChange={v=>setNRamo(p=>({...p,credits:v}))} ph="Ej: 5" type="number"/>
            <div/>
          </div>
          <RamoColorPicker value={nRamo.color} onChange={c=>setNRamo(p=>({...p,color:c}))} colors={RAMO_COLORS}/>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:4}}>
            <Btn onClick={()=>setShowAddRamo(false)}>Cancelar</Btn>
            <Btn onClick={addRamo} variant="pri" disabled={!nRamo.nombre}>Crear ramo</Btn>
          </div>
        </div>
      </Modal>

      <Modal open={showEditRamo} onClose={()=>setShowEditRamo(false)} title="Editar ramo" w={440}>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <Fld label="Nombre del ramo" value={editRamoData.nombre} onChange={v=>setEditRamoData(p=>({...p,nombre:v}))} ph="Ej: Álgebra Lineal" required/>
            <Fld label="Código" value={editRamoData.codigo} onChange={v=>setEditRamoData(p=>({...p,codigo:v}))} ph="Ej: MAT201"/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <Fld label="Profesor" value={editRamoData.profesor} onChange={v=>setEditRamoData(p=>({...p,profesor:v}))} ph="Dr. Juan Pérez"/>
            <Fld label="Sección" value={editRamoData.seccion} onChange={v=>setEditRamoData(p=>({...p,seccion:v}))} ph="001"/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <Fld label="Créditos SCT" value={editRamoData.credits} onChange={v=>setEditRamoData(p=>({...p,credits:v}))} ph="Ej: 5" type="number"/>
            <div/>
          </div>

}
function TabNotas({ramo,updateRamo}){
  const mods=ramo.evaluation_modules||[];
  const [editCell,setEditCell]=useState(null); // {modId, itemId}
  const [cellVal,setCellVal]=useState('');
  const [showAddMod,setShowAddMod]=useState(false);
  const [nMod,setNMod]=useState({name:'',weight:''});
  const [addItemMod,setAddItemMod]=useState(null); // modId
  const [nItem,setNItem]=useState({name:'',date:''});
  const [editWeightId,setEditWeightId]=useState(null);
  const [weightVal,setWeightVal]=useState('');

  const promTotal=computeNota(mods);

  const saveGrade=(modId,itemId,val)=>{
    const grade=val===''?null:Math.min(7,Math.max(1,parseFloat(String(val).replace(',','.'))));
    if(isNaN(grade)&&val!=='') return;
    const newMods=mods.map(m=>m.id===modId?{...m,items:m.items.map(it=>it.id===itemId?{...it,grade:val===''?null:grade}:it)}:m);
    updateRamo(ramo.id,{evaluation_modules:newMods});
    setEditCell(null);
  };

  const saveWeight=(modId,val)=>{
    const w=Math.min(100,Math.max(0,parseInt(val)||0));
    const newMods=mods.map(m=>m.id===modId?{...m,weight:w}:m);
    updateRamo(ramo.id,{evaluation_modules:newMods});
    setEditWeightId(null);
  };

  const addModule=()=>{
    if(!nMod.name.trim()) return;
    const newMod={id:crypto.randomUUID(),name:nMod.name.trim(),weight:parseInt(nMod.weight)||0,items:[]};
    updateRamo(ramo.id,{evaluation_modules:[...mods,newMod]});
    setNMod({name:'',weight:''});setShowAddMod(false);
  };

  const addItem=(modId)=>{
    if(!nItem.name.trim()) return;
    const newItem={id:crypto.randomUUID(),name:nItem.name.trim(),date:nItem.date||null,grade:null};
    const newMods=mods.map(m=>m.id===modId?{...m,items:[...m.items,newItem]}:m);
    updateRamo(ramo.id,{evaluation_modules:newMods});
    setNItem({name:'',date:''});setAddItemMod(null);
  };

  const delItem=(modId,itemId)=>{
    const newMods=mods.map(m=>m.id===modId?{...m,items:m.items.filter(it=>it.id!==itemId)}:m);
    updateRamo(ramo.id,{evaluation_modules:newMods});
  };

  const delModule=(modId)=>{
    updateRamo(ramo.id,{evaluation_modules:mods.filter(m=>m.id!==modId)});
  };

  const totalPeso=mods.reduce((a,m)=>a+(m.weight||0),0);

  return(
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <Hdr title="Evaluaciones"/>
        <Btn onClick={()=>setShowAddMod(true)} variant="pri" size="sm"><IcoPlus s={11}/>Nuevo módulo</Btn>
      </div>
      {mods.length===0&&<div style={{fontSize:12,color:'var(--k4)',padding:'16px 0'}}>Sin evaluaciones configuradas.<br/>Haz clic en "Nuevo módulo" para agregar (Ej: Controles, Pruebas, Tareas).</div>}

      {mods.map((m)=>(
        <div key={m.id} style={{marginBottom:28,background:'var(--w)',borderRadius:12,border:'1px solid var(--ln)',overflow:'hidden'}}>
          {/* Module header */}
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'11px 14px',background:`${ramo.color||'#1654b0'}0a`,borderBottom:'1px solid var(--ls)'}}>
            <div style={{flex:1,fontSize:13,fontWeight:600}}>{m.name}</div>
            <div style={{display:'flex',alignItems:'center',gap:4,fontSize:11,color:'var(--k4)'}}>
              Pondera:
              {editWeightId===m.id?(
                <input autoFocus type="number" min="0" max="100" value={weightVal} onChange={e=>setWeightVal(e.target.value)}
                  onBlur={()=>saveWeight(m.id,weightVal)} onKeyDown={e=>{if(e.key==='Enter')saveWeight(m.id,weightVal);if(e.key==='Escape')setEditWeightId(null);}}
                  style={{width:46,padding:'1px 4px',border:'1px solid var(--ln)',borderRadius:4,fontSize:11,textAlign:'center',outline:'none',background:'var(--w)'}}/>
              ):(
                <button onClick={()=>{setEditWeightId(m.id);setWeightVal(String(m.weight||0));}} style={{fontWeight:700,color:m.weight>0?'var(--k2)':'var(--er)',background:'transparent',border:'none',cursor:'pointer',fontSize:11,padding:'1px 4px',borderRadius:4}}>{m.weight||0}%</button>
              )}
            </div>
            <button onClick={()=>{setAddItemMod(m.id);setNItem({name:'',date:''}); }} style={{width:22,height:22,border:'none',background:'transparent',cursor:'pointer',color:'var(--k3)',display:'grid',placeItems:'center',borderRadius:5}}><IcoPlus s={11}/></button>
            <button onClick={()=>delModule(m.id)} style={{width:22,height:22,border:'none',background:'transparent',cursor:'pointer',color:'var(--er)',display:'grid',placeItems:'center',borderRadius:5,opacity:.6}}><IcoTrash s={11}/></button>
          </div>

          {/* Add item row */}
          {addItemMod===m.id&&(
            <div style={{display:'flex',gap:8,padding:'8px 14px',borderBottom:'1px solid var(--ls)',background:'rgba(22,84,176,.04)'}}>
              <input autoFocus value={nItem.name} onChange={e=>setNItem(p=>({...p,name:e.target.value}))} onKeyDown={e=>{if(e.key==='Enter')addItem(m.id);if(e.key==='Escape')setAddItemMod(null);}} placeholder="Nombre (ej: Control 1)" style={{flex:1,padding:'5px 8px',border:'1px solid var(--ln)',borderRadius:6,fontSize:12,outline:'none',background:'var(--w)'}}/>
              <input type="date" value={nItem.date} onChange={e=>setNItem(p=>({...p,date:e.target.value}))} style={{padding:'5px 8px',border:'1px solid var(--ln)',borderRadius:6,fontSize:12,outline:'none',background:'var(--w)',color:'var(--k)'}}/>
              <Btn onClick={()=>addItem(m.id)} variant="pri" size="sm">Añadir</Btn>
              <Btn onClick={()=>setAddItemMod(null)} size="sm">Cancelar</Btn>
            </div>
          )}

          {/* Items */}
          {(m.items||[]).length===0&&addItemMod!==m.id&&(
            <div style={{padding:'12px 14px',fontSize:12,color:'var(--k4)'}}>Sin evaluaciones en este módulo. Haz clic en + para agregar.</div>
          )}
          {(m.items||[]).map((it)=>(
            <div key={it.id} className="eb-wrap" style={{display:'grid',gridTemplateColumns:'1fr 90px 80px 28px',gap:8,padding:'9px 14px',borderBottom:'1px solid var(--ls)',alignItems:'center'}}>
              <div style={{fontSize:13,fontWeight:500}}>{it.name}</div>
              <div style={{fontSize:11,color:'var(--k4)'}}>{it.date||'—'}</div>
              {/* Grade cell — click to edit */}
              {editCell?.modId===m.id&&editCell?.itemId===it.id?(
                <input autoFocus type="number" min="1" max="7" step="0.1" value={cellVal}
                  onChange={e=>setCellVal(e.target.value)}
                  onBlur={()=>saveGrade(m.id,it.id,cellVal)}
                  onKeyDown={e=>{if(e.key==='Enter')saveGrade(m.id,it.id,cellVal);if(e.key==='Escape')setEditCell(null);}}
                  placeholder="1–7"
                  style={{padding:'3px 6px',border:`1px solid ${ramo.color||'#1654b0'}`,borderRadius:5,fontSize:14,fontWeight:700,textAlign:'center',outline:'none',width:'100%',background:'var(--w)'}}/>
              ):(
                <button onClick={()=>{setEditCell({modId:m.id,itemId:it.id});setCellVal(it.grade!=null?String(it.grade):'');}}
                  style={{fontSize:20,fontWeight:700,color:it.grade!=null?nc(Number(it.grade)):'var(--k4)',background:'transparent',border:'1px dashed '+(it.grade!=null?'transparent':'var(--ln)'),borderRadius:5,cursor:'pointer',padding:'2px 6px',width:'100%',textAlign:'center'}}>
                  {it.grade!=null?Number(it.grade).toFixed(1):'—'}
                </button>
              )}
              <button className="eb" onClick={()=>delItem(m.id,it.id)} style={{width:22,height:22,border:'none',background:'transparent',cursor:'pointer',color:'var(--er)',display:'grid',placeItems:'center',borderRadius:5}}><IcoTrash s={11}/></button>
            </div>
          ))}

          {/* Module average */}
          {(m.items||[]).some(it=>it.grade!=null)&&(()=>{
            const graded=(m.items||[]).filter(it=>it.grade!=null);
            const avg=graded.reduce((a,it)=>a+Number(it.grade),0)/graded.length;
            return <div style={{padding:'8px 14px',fontSize:11,color:'var(--k3)',textAlign:'right'}}>Promedio módulo: <strong style={{color:nc(avg)}}>{avg.toFixed(1)}</strong></div>;
          })()}
        </div>
      ))}

      {/* Total weight warning */}
      {mods.length>0&&totalPeso!==100&&<div style={{fontSize:11,color:'var(--wn)',marginBottom:12,padding:'6px 10px',borderRadius:6,background:'rgba(178,94,9,.08)',border:'1px solid rgba(178,94,9,.2)'}}>⚠ Las ponderaciones suman {totalPeso}% (deben sumar 100% para un promedio correcto)</div>}

      {/* Final average */}
      {mods.length>0&&<div style={{padding:'14px 16px',borderRadius:12,background:promTotal>0?`${ramo.color||'#1654b0'}0a`:'var(--p2)',border:'1px solid var(--ln)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{fontSize:13,color:'var(--k3)'}}>Nota final ponderada</div>
        <div style={{fontSize:28,fontWeight:700,color:promTotal>0?nc(promTotal):'var(--k4)'}}>{promTotal>0?promTotal.toFixed(1):'—'}</div>
      </div>}

      {/* Add module modal */}
      {showAddMod&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.3)',zIndex:200,display:'grid',placeItems:'center'}} onClick={()=>setShowAddMod(false)}>
        <div style={{background:'var(--w)',borderRadius:14,padding:24,width:320,boxShadow:'0 16px 48px rgba(0,0,0,.15)'}} onClick={e=>e.stopPropagation()}>
          <div style={{fontSize:15,fontWeight:600,marginBottom:16}}>Nuevo módulo de evaluación</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <Fld label="Nombre" value={nMod.name} onChange={v=>setNMod(p=>({...p,name:v}))} ph="Ej: Controles, Pruebas, Tareas" required/>
            <Fld label="Ponderación (%)" value={nMod.weight} onChange={v=>setNMod(p=>({...p,weight:v}))} ph="Ej: 30"/>
            <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
              <Btn onClick={()=>setShowAddMod(false)}>Cancelar</Btn>
              <Btn onClick={addModule} variant="pri" disabled={!nMod.name.trim()}>Crear</Btn>
            </div>
          </div>
        </div>
      </div>}
    </div>
  );
}

function TabArch({ramo,user,setRamos}){
  const archs=ramo.archivos||[];
  const fRef=useRef(null);
  const [uploading,setUploading]=useState(false);

  const up=async(e)=>{
    const files=Array.from(e.target.files||[]);
    if(!files.length) return;
    e.target.value='';
    setUploading(true);
    for(const file of files){
      const localId='f'+Date.now()+Math.random().toString(36).slice(2,5);
      const newFile={id:localId,n:file.name,f:new Date().toISOString().slice(0,10),programa:false};
      if(setRamos) setRamos(prev=>prev.map(r=>r.id===ramo.id?{...r,archivos:[...r.archivos,newFile]}:r));
      if(supabaseClient&&user){
        try{
          const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
          const path=`${user.id}/${ramo.id}/${Date.now()}_${safeName}`;
          const{error:upErr}=await supabaseClient.storage.from('ramo-files').upload(path,file,{upsert:true});
          if(!upErr){
            const{data}=await supabaseClient.from('ramo_files').insert({user_id:user.id,ramo_id:ramo.id,name:file.name,size:file.size,storage_path:path,is_programa:false}).select('*').single();
            if(data&&setRamos) setRamos(prev=>prev.map(r=>r.id===ramo.id?{...r,archivos:r.archivos.map(f=>f.id===localId?{...f,id:data.id,storage_path:data.storage_path}:f)}:r));
          }
        }catch(err){console.error('Upload failed:',err);}
      }
    }
    setUploading(false);
  };

  const setProg=async(id)=>{
    if(setRamos) setRamos(prev=>prev.map(r=>r.id===ramo.id?{...r,archivos:r.archivos.map(a=>({...a,programa:a.id===id?!a.programa:false}))}:r));
    if(supabaseClient){
      // Set all to false first, then toggle the selected one
      const file=archs.find(a=>a.id===id);
      const newVal=file?!file.programa:true;
      for(const a of archs){
        if(a.id===id) await supabaseClient.from('ramo_files').update({is_programa:newVal}).eq('id',a.id);
        else if(a.programa) await supabaseClient.from('ramo_files').update({is_programa:false}).eq('id',a.id);
      }
    }
  };

  const delFile=async(id)=>{
    if(!confirm('¿Eliminar este archivo?')) return;
    const file=archs.find(a=>a.id===id);
    if(setRamos) setRamos(prev=>prev.map(r=>r.id===ramo.id?{...r,archivos:r.archivos.filter(a=>a.id!==id)}:r));
    if(supabaseClient&&file){
      if(file.storage_path) await supabaseClient.storage.from('ramo-files').remove([file.storage_path]);
      await supabaseClient.from('ramo_files').delete().eq('id',id);
    }
  };

  const prog=archs.filter(a=>a.programa);
  const rest=archs.filter(a=>!a.programa);
  return(
    <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div style={{fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--k4)'}}>Archivos del ramo</div>
        <Btn onClick={()=>fRef.current?.click()} variant="pri" size="sm" disabled={uploading}><IcoUp s={12}/>{uploading?'Subiendo...':'Importar material'}</Btn>
        <input ref={fRef} type="file" multiple accept=".pdf,.docx,.pptx,.xlsx,.txt,.png,.jpg" style={{display:'none'}} onChange={up}/>
      </div>
      {prog.length>0&&(
        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,fontWeight:600,letterSpacing:'.05em',textTransform:'uppercase',color:'var(--wn)',marginBottom:8}}>Destacado · Programa del ramo</div>
          {prog.map((a,i)=>(
            <div key={a.id} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',borderRadius:10,background:'rgba(178,94,9,.06)',border:'1.5px solid rgba(178,94,9,.25)',marginBottom:6}}>
              <div style={{width:28,height:32,borderRadius:6,background:'rgba(178,94,9,.12)',border:'1px solid rgba(178,94,9,.2)',display:'grid',placeItems:'center',flexShrink:0,color:'var(--wn)'}}><IcoFile/></div>
              <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{a.n}</div><div style={{fontSize:11,color:'var(--wn)',marginTop:1}}>Programa del ramo</div></div>
              <button onClick={()=>setProg(a.id)} title="Quitar destacado" style={{fontSize:12,color:'var(--wn)',background:'transparent',border:'none',cursor:'pointer',padding:'3px 8px',borderRadius:6}}>Quitar ★</button>
            </div>
          ))}
        </div>
      )}
      {rest.map((a,i)=>(
        <div key={a.id||i} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:'1px solid var(--ls)'}}>
          <div style={{width:28,height:32,borderRadius:6,background:'var(--p2)',border:'1px solid var(--ln)',display:'grid',placeItems:'center',flexShrink:0,color:'var(--k3)'}}><IcoFile/></div>
          <div style={{flex:1}}><div style={{fontSize:13,fontWeight:500}}>{a.n}</div><div style={{fontSize:11,color:'var(--k4)',marginTop:1}}>{a.f}</div></div>
          <button onClick={()=>setProg(a.id)} title="Marcar como programa" style={{fontSize:11,color:'var(--k4)',background:'transparent',border:'none',cursor:'pointer',padding:'3px 8px',borderRadius:6,opacity:.7}}>☆ Destacar</button>
          <button onClick={()=>delFile(a.id)} style={{width:24,height:24,borderRadius:6,border:'none',background:'transparent',cursor:'pointer',color:'var(--er)',display:'grid',placeItems:'center'}}><IcoTrash/></button>
        </div>
      ))}
      {archs.length===0&&<div style={{textAlign:'center',padding:'32px 0',color:'var(--k4)',fontSize:13}}>Sin archivos.</div>}
    </div>
  );
}

    const newIds=new Set(newUnidades.map(u=>u.id));
    // Delete removed units
    for(const u of (oldUnidades||[])){
      if(!newIds.has(u.id)&&!String(u.id).startsWith('u')){
        await supabaseClient.from('units').delete().eq('id',u.id);
      }
    }
    // Upsert units
    for(let idx=0;idx<newUnidades.length;idx++){
      const u=newUnidades[idx];
      if(String(u.id).startsWith('u')){
        const{data}=await supabaseClient.from('units').insert({user_id:user.id,ramo_id:ramo.id,name:u.titulo,materias:u.archivos||[],"order":idx}).select().single();
        if(data) newUnidades[idx]={...u,id:data.id};
      } else if(oldIds.has(u.id)){
        supabaseClient.from('units').update({name:u.titulo,materias:u.archivos||[],"order":idx}).eq('id',u.id);
      }
    }
    // Update both local state and parent with real DB ids
    setUnidades([...newUnidades]);
    if(updateRamo) updateRamo(ramo.id,{temario:[...newUnidades]});
  };

  const addUnidad=()=>{if(!newTit.trim()) return;const old=[...unidades];const next=[...unidades,{id:`u${Date.now()}`,titulo:newTit.trim(),archivos:[]}];setUnidades(next);setNewTit('');setShowAdd(false);persistUnidades(next,old);};
  const delUnidad=id=>{const old=[...unidades];const next=unidades.filter(u=>u.id!==id);setUnidades(next);persistUnidades(next,old);setEditingUnit(null);setConfirmDelete(null);};
  const renameUnit=(uid)=>{if(!editName.trim()) return;const old=[...unidades];const next=unidades.map(u=>u.id===uid?{...u,titulo:editName.trim()}:u);setUnidades(next);persistUnidades(next,old);setEditingUnit(null);};
  const toggleFile=(uid,fid)=>{const old=[...unidades];const next=unidades.map(u=>u.id===uid?{...u,archivos:u.archivos.includes(fid)?u.archivos.filter(x=>x!==fid):[...u.archivos,fid]}:u);setUnidades(next);persistUnidades(next,old);};
  const deleteFileFromRamo=async(fid)=>{
    const file=(ramo.archivos||[]).find(a=>a.id===fid);
    // Remove from all units
    const old=[...unidades];const next=unidades.map(u=>({...u,archivos:u.archivos.filter(x=>x!==fid)}));setUnidades(next);persistUnidades(next,old);
    // Remove from ramo.archivos
    if(setRamos) setRamos(prev=>prev.map(r=>r.id===ramo.id?{...r,archivos:r.archivos.filter(a=>a.id!==fid)}:r));
    // Remove from storage + DB
    if(supabaseClient&&file){
      if(file.storage_path) await supabaseClient.storage.from('ramo-files').remove([file.storage_path]);
      await supabaseClient.from('ramo_files').delete().eq('id',fid);
    }
    setConfirmDeleteFile(null);
  };

  const uploadFilesToUnit=async(e,unitId)=>{
    const files=Array.from(e.target.files||[]);
    if(!files.length) return;
    e.target.value='';
    setUploading(unitId);
    for(const file of files){
      const localId='f'+Date.now()+Math.random().toString(36).slice(2,5);
      const newFile={id:localId,n:file.name,f:new Date().toISOString().slice(0,10),programa:false};
      // Add file to ramo.archivos and assign to unit
      if(setRamos) setRamos(prev=>prev.map(r=>r.id===ramo.id?{...r,archivos:[...r.archivos,newFile]}:r));
      const old=[...unidades];
      const next=unidades.map(u=>u.id===unitId?{...u,archivos:[...u.archivos,localId]}:u);
      setUnidades(next);
      persistUnidades(next,old);
      // Upload to Supabase storage + DB
      if(supabaseClient&&user){
        try{
          const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
          const path=`${user.id}/${ramo.id}/${Date.now()}_${safeName}`;
          const{error:upErr}=await supabaseClient.storage.from('ramo-files').upload(path,file,{upsert:true});
          if(!upErr){
            const{data}=await supabaseClient.from('ramo_files').insert({user_id:user.id,ramo_id:ramo.id,name:file.name,size:file.size,storage_path:path,is_programa:false}).select('*').single();
            if(data){
              // Replace local id with real DB id
              if(setRamos) setRamos(prev=>prev.map(r=>r.id===ramo.id?{...r,archivos:r.archivos.map(f=>f.id===localId?{...f,id:data.id,storage_path:data.storage_path}:f)}:r));
              const old2=[...unidades];
              const next2=unidades.map(u=>u.id===unitId?{...u,archivos:u.archivos.map(fid=>fid===localId?data.id:fid)}:u);
              setUnidades(next2);
              persistUnidades(next2,old2);
            }
          }
        }catch(err){console.error('Upload failed:',err);}
      }
    }
    setUploading(null);
  };

  const onDragStart=i=>{setDragIdx(i);};
  const onDragOver=(e,i)=>{e.preventDefault();setDragOver(i);};
  const onDrop=()=>{
    if(dragIdx===null||dragOver===null||dragIdx===dragOver) return;
    const old=[...unidades];const arr=[...unidades];const [item]=arr.splice(dragIdx,1);arr.splice(dragOver,0,item);
    setUnidades(arr);setDragIdx(null);setDragOver(null);persistUnidades(arr,old);
  };

  return(
    <div>
      <Hdr title="Temario del ramo" onAdd={()=>setShowAdd(true)} lbl="Nueva unidad"/>
      <div style={{fontSize:12,color:'var(--k3)',marginBottom:16}}>Arrastra para reordenar. Haz clic en una unidad para asignar archivos.</div>
      {unidades.map((u,i)=>(
        <div key={u.id} draggable onDragStart={()=>onDragStart(i)} onDragOver={e=>onDragOver(e,i)} onDrop={onDrop} onDragEnd={()=>{setDragIdx(null);setDragOver(null);}} style={{marginBottom:6,borderRadius:10,border:`1.5px solid ${dragOver===i?'#1654b0':'var(--ln)'}`,background:dragOver===i?'rgba(22,84,176,.04)':'var(--w)',transition:'all .12s',cursor:'grab',overflow:'hidden'}}>
          <div style={{display:'flex',alignItems:'center',gap:10,padding:'11px 14px'}}>
            <span style={{color:'var(--k4)',cursor:'grab',display:'flex'}}><IcoDrag/></span>
            <div style={{flex:1,fontSize:13,fontWeight:600}}>{u.titulo}</div>
            <div style={{fontSize:11,color:'var(--k4)'}}>{u.archivos.length} archivo{u.archivos.length!==1?'s':''}</div>
            <button onClick={()=>setExpandedU(expandedU===u.id?null:u.id)} style={{width:24,height:24,borderRadius:6,border:'none',background:'var(--p2)',cursor:'pointer',display:'grid',placeItems:'center',color:'var(--k3)'}}><IcoCh dir={expandedU===u.id?'d':'r'} s={11}/></button>
            <button onClick={()=>{setEditingUnit(editingUnit===u.id?null:u.id);setEditName(u.titulo);setConfirmDelete(null);}} title="Editar unidad" style={{width:24,height:24,borderRadius:6,border:'none',background:'transparent',cursor:'pointer',display:'grid',placeItems:'center',color:'var(--k4)'}}><svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          </div>
          {expandedU===u.id&&(
            <div style={{borderTop:'1px solid var(--ls)',padding:'10px 14px 14px 14px',background:'var(--p)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <div style={{fontSize:11,fontWeight:600,color:'var(--k4)',textTransform:'uppercase',letterSpacing:'.05em'}}>Archivos de esta unidad</div>
                <button onClick={()=>{uploadUnitRef.current=u.id;fileInputRef.current?.click();}} disabled={uploading===u.id}
                  style={{display:'flex',alignItems:'center',gap:5,padding:'5px 12px',borderRadius:7,border:'1px solid var(--brand1,#1654b0)',background:'transparent',color:'var(--brand1,#1654b0)',fontSize:11,fontWeight:500,cursor:'pointer',opacity:uploading===u.id?.5:1}}>
                  <IcoUp s={11}/>{uploading===u.id?'Subiendo...':'Subir archivo'}
                </button>
              </div>
              <input ref={fileInputRef} type="file" multiple accept=".pdf,.docx,.pptx,.xlsx,.txt,.png,.jpg" style={{display:'none'}} onChange={(e)=>uploadFilesToUnit(e,uploadUnitRef.current)}/>
              <div style={{display:'flex',flexDirection:'column',gap:5}}>
                {(ramo.archivos||[]).length===0?(
                  <div style={{textAlign:'center',padding:'16px 0',color:'var(--k4)',fontSize:12}}>No hay archivos en este ramo. Sube uno con el botón de arriba.</div>
                ):(ramo.archivos||[]).map(a=>(
                  <div key={a.id}>
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <label style={{flex:1,display:'flex',alignItems:'center',gap:9,padding:'7px 10px',borderRadius:8,background:u.archivos.includes(a.id)?'rgba(22,84,176,.07)':'var(--w)',border:`1px solid ${u.archivos.includes(a.id)?'rgba(22,84,176,.25)':'var(--ln)'}`,cursor:'pointer',fontSize:12}}>
                        <input type="checkbox" checked={u.archivos.includes(a.id)} onChange={()=>toggleFile(u.id,a.id)} style={{width:14,height:14,accentColor:'#1654b0',flexShrink:0}}/>
                        <IcoFile s={12}/>
                        <span style={{flex:1,fontWeight:500}}>{a.n}</span>
                        {a.programa&&<span style={{fontSize:10,color:'var(--wn)',fontWeight:600}}>Programa</span>}
                      </label>
                      <button onClick={()=>setConfirmDeleteFile(confirmDeleteFile===a.id?null:a.id)} title="Eliminar archivo" style={{width:24,height:24,borderRadius:6,border:'none',background:'transparent',cursor:'pointer',display:'grid',placeItems:'center',color:'var(--k4)',flexShrink:0,opacity:.7}}><IcoTrash s={11}/></button>
                    </div>
                    {confirmDeleteFile===a.id&&(
                      <div style={{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',marginTop:4,borderRadius:7,background:'rgba(220,38,38,.05)',border:'1px solid rgba(220,38,38,.15)'}}>
                        <span style={{fontSize:11,color:'var(--er)',fontWeight:500,flex:1}}>¿Eliminar "{a.n}"?</span>
                        <button onClick={()=>deleteFileFromRamo(a.id)} style={{padding:'4px 10px',borderRadius:6,border:'none',background:'var(--er)',color:'#fff',fontSize:11,fontWeight:600,cursor:'pointer'}}>Confirmar</button>
                        <button onClick={()=>setConfirmDeleteFile(null)} style={{padding:'4px 10px',borderRadius:6,border:'1px solid var(--ln)',background:'var(--w)',color:'var(--k3)',fontSize:11,cursor:'pointer'}}>Cancelar</button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
          {editingUnit===u.id&&(
            <div style={{borderTop:'1px solid var(--ls)',padding:'12px 14px',background:'var(--p)'}}>
              <div style={{fontSize:11,fontWeight:600,color:'var(--k4)',marginBottom:8,textTransform:'uppercase',letterSpacing:'.05em'}}>Editar unidad</div>
              <div style={{display:'flex',gap:8,marginBottom:10}}>
                <input autoFocus value={editName} onChange={e=>setEditName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&renameUnit(u.id)}
                  style={{flex:1,padding:'7px 12px',borderRadius:8,border:'1px solid var(--ln)',fontSize:13,outline:'none',fontFamily:'inherit',background:'var(--w)',color:'var(--k)'}}/>
                <Btn onClick={()=>renameUnit(u.id)} variant="pri" size="sm">Guardar</Btn>
                <Btn onClick={()=>{setEditingUnit(null);setConfirmDelete(null);}}>Cancelar</Btn>
              </div>
              <div style={{borderTop:'1px solid var(--ls)',paddingTop:10}}>
                {confirmDelete!==u.id?(
                  <button onClick={()=>setConfirmDelete(u.id)} style={{padding:'5px 14px',borderRadius:7,border:'none',background:'var(--er)',color:'#fff',fontSize:12,fontWeight:500,cursor:'pointer',opacity:.9}}>Eliminar unidad</button>
                ):(
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontSize:12,color:'var(--er)',fontWeight:500}}>¿Eliminar esta unidad?</span>
                    <button onClick={()=>delUnidad(u.id)} style={{padding:'5px 14px',borderRadius:7,border:'none',background:'var(--er)',color:'#fff',fontSize:12,fontWeight:600,cursor:'pointer'}}>Confirmar</button>
                    <Btn onClick={()=>setConfirmDelete(null)}>Cancelar</Btn>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      ))}
      {showAdd&&(
        <div style={{padding:'12px',borderRadius:10,border:'1.5px dashed rgba(22,84,176,.3)',background:'rgba(22,84,176,.03)',marginTop:8}}>
          <div style={{display:'flex',gap:8}}>
            <input value={newTit} onChange={e=>setNewTit(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addUnidad()} placeholder="Título de la unidad…" style={{flex:1,padding:'8px 12px',borderRadius:8,border:'1px solid var(--ln)',font:'inherit',fontSize:13,outline:'none'}}/>
            <Btn onClick={addUnidad} variant="pri" size="sm">Añadir</Btn>
            <Btn onClick={()=>{setShowAdd(false);setNewTit('');}}>✕</Btn>
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════ BIBLIOTECA (Finder columns) ═══════ */
/* ═══════ BIBLIOTECA (Finder columns) ═══════ */
function SecBiblioteca({initRid,ramos=[]}){
  const [selRamo,setSelRamo]=useState(initRid||null);
  const [selCarpeta,setSelCarpeta]=useState('todos');
  const [selFile,setSelFile]=useState(null);
  const [colRamos,setColRamos]=useState(false);
  const [colCarpetas,setColCarpetas]=useState(false);
  const [allFiles,setAllFiles]=useState([]);
  const [allFolders,setAllFolders]=useState([]);
  const [signedUrl,setSignedUrl]=useState(null);
  const [loadingUrl,setLoadingUrl]=useState(false);
  const [uploading,setUploading]=useState(false);
  const [showNewFolder,setShowNewFolder]=useState(false);
  const [newFolderName,setNewFolderName]=useState('');
  const [editingFolder,setEditingFolder]=useState(null);
  const [editFolderName,setEditFolderName]=useState('');
  const bibFileRef=useRef(null);

  // Load all ramo_files + ramo_file_folders for the user
  useEffect(()=>{
    if(!supabaseClient) return;
    supabaseClient.from('ramo_files').select('*').then(({data})=>setAllFiles(data||[]));
    supabaseClient.from('ramo_file_folders').select('*').then(({data})=>setAllFolders(data||[]));
  },[]);

  const uploadFiles=async(e)=>{
    const files=Array.from(e.target.files||[]);
    if(!files.length||!supabaseClient||!user||!selRamo) return;
    e.target.value='';
    setUploading(true);
    for(const file of files){
      try{
        const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const path=`${user.id}/biblioteca/${selRamo}/${Date.now()}_${safeName}`;
        const{error:upErr}=await supabaseClient.storage.from('ramo-files').upload(path,file,{upsert:true});
        if(upErr){console.error('Upload error:',upErr.message);continue;}
        const folder=selCarpeta!=='todos'&&selCarpeta!=='programa'?selCarpeta:null;
        const{data:row}=await supabaseClient.from('ramo_files').insert({user_id:user.id,ramo_id:selRamo,name:file.name,size:file.size,storage_path:path,folder}).select('*').single();
        if(row) setAllFiles(prev=>[...prev,row]);
      }catch(err){console.error('File upload failed:',err);}
    }
    setUploading(false);
  };

  const deleteFile=async(fid)=>{
    if(!confirm('¿Eliminar este archivo?')) return;
    const f=allFiles.find(x=>x.id===fid);
    if(f?.storage_path) await supabaseClient.storage.from('ramo-files').remove([f.storage_path]);
    await supabaseClient.from('ramo_files').delete().eq('id',fid);
    setAllFiles(prev=>prev.filter(x=>x.id!==fid));
    if(selFile===fid) setSelFile(null);
  };

  const createFolder=async()=>{
    if(!newFolderName.trim()||!selRamo||!supabaseClient) return;
    const key=newFolderName.trim().toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
    const{data}=await supabaseClient.from('ramo_file_folders').insert({ramo_id:selRamo,key,label:newFolderName.trim()}).select('*').single();
    if(data) setAllFolders(prev=>[...prev,data]);
    setNewFolderName('');setShowNewFolder(false);
  };

  const renameFolder=async(folderId)=>{
    if(!editFolderName.trim()||!supabaseClient) return;
    const newLabel=editFolderName.trim();
    await supabaseClient.from('ramo_file_folders').update({label:newLabel}).eq('id',folderId);
    setAllFolders(prev=>prev.map(f=>f.id===folderId?{...f,label:newLabel}:f));
    setEditingFolder(null);setEditFolderName('');
  };

  const deleteFolder=async(folder)=>{
    if(!confirm(`¿Eliminar la carpeta "${folder.label}"? Los archivos no se borrarán.`)) return;
    await supabaseClient.from('ramo_files').update({folder:null}).eq('folder',folder.key);
    await supabaseClient.from('ramo_file_folders').delete().eq('id',folder.id);
    setAllFolders(prev=>prev.filter(f=>f.id!==folder.id));
    setAllFiles(prev=>prev.map(f=>f.folder===folder.key?{...f,folder:null}:f));
    if(selCarpeta===folder.key) setSelCarpeta('todos');
  };

  // Files for selected ramo
  const ramoFiles=allFiles.filter(f=>f.ramo_id===selRamo);

  // Folders for selected ramo: built-ins + registered custom + implicit (unique folder keys not already covered)
  const customFolders=allFolders.filter(f=>f.ramo_id===selRamo);
  const knownKeys=new Set(['todos','programa',...customFolders.map(f=>f.key)]);
  const implicitKeys=[...new Set(ramoFiles.map(f=>f.folder).filter(k=>k&&!knownKeys.has(k)))];
  const fmtKey=k=>k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  const folders=[
    {id:'todos',label:'Todos los archivos'},
    ...(ramoFiles.some(f=>f.is_programa)?[{id:'programa',label:'Programa'}]:[]),
    ...customFolders.map(f=>({id:f.key,label:f.label})),
    ...implicitKeys.map(k=>({id:k,label:fmtKey(k)})),
  ];

  const getFilesForFolder=(fid)=>{
    if(!fid||fid==='todos') return ramoFiles;
    if(fid==='programa') return ramoFiles.filter(f=>f.is_programa);
    return ramoFiles.filter(f=>f.folder===fid);
  };
  const archivosMostrados=getFilesForFolder(selCarpeta);
  const archivo=selFile?ramoFiles.find(f=>f.id===selFile):null;
  const countForRamo=rid=>allFiles.filter(f=>f.ramo_id===rid).length;
  const fmtSize=b=>{if(!b)return '';if(b<1024)return b+'B';if(b<1048576)return Math.round(b/1024)+'KB';return(b/1048576).toFixed(1)+'MB';};

  // Generate signed URL when a file is selected
  useEffect(()=>{
    setSignedUrl(null);
    if(!archivo?.storage_path||!supabaseClient) return;
    setLoadingUrl(true);
    supabaseClient.storage.from('ramo-files').createSignedUrl(archivo.storage_path,3600)
      .then(({data})=>{setSignedUrl(data?.signedUrl||null);setLoadingUrl(false);});
  },[archivo?.id]);

  return(
    <div style={{display:'flex',flex:1,overflow:'hidden'}}>
      {/* Col 1: Ramos — colapsable */}
      {!colRamos&&<div style={{width:224,flexShrink:0,borderRight:'1px solid var(--ln)',background:'var(--w)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'10px 10px 6px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div style={{fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--k4)'}}>Ramos</div>
          <button onClick={()=>setColRamos(true)} style={{width:20,height:20,border:'none',background:'transparent',cursor:'pointer',color:'var(--k4)',display:'grid',placeItems:'center'}}><IcoCh dir="l" s={10}/></button>
        </div>
        <div style={{overflowY:'auto',flex:1,minHeight:0}}>
          {ramos.length===0&&<div style={{padding:'12px',fontSize:12,color:'var(--k4)'}}>Sin ramos</div>}
          {ramos.map(r=>{const cnt=countForRamo(r.id);return(<div key={r.id} onClick={()=>{setSelRamo(r.id);setSelCarpeta('todos');setSelFile(null);}} style={{padding:'9px 12px',cursor:'pointer',background:selRamo===r.id?'rgba(22,84,176,.1)':'transparent',display:'flex',alignItems:'center',gap:8,borderRight:selRamo===r.id?`2px solid ${r.color||'#1654b0'}`:'2px solid transparent'}}>
            <div style={{width:14,height:18,borderRadius:3,background:`linear-gradient(135deg,${r.color||'#1654b0'}cc,${r.color||'#1654b0'}77)`,flexShrink:0}}></div>
            <div><div style={{fontSize:12.5,fontWeight:600}}>{r.nombre||r.name||'—'}</div><div style={{fontSize:10,color:'var(--k4)'}}>{cnt} archivo{cnt!==1?'s':''}</div></div>
          </div>);})}
        </div>
      </div>}
      {colRamos&&<button onClick={()=>setColRamos(false)} style={{width:24,flexShrink:0,border:'none',borderRight:'1px solid var(--ln)',background:'var(--w)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--k4)'}}><IcoCh s={11}/></button>}

      {/* Col 2: Carpetas — colapsable */}
      {!colCarpetas&&<div style={{width:224,flexShrink:0,borderRight:'1px solid var(--ln)',background:'var(--p)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'10px 10px 6px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div style={{fontSize:11,fontWeight:600,letterSpacing:'.06em',textTransform:'uppercase',color:'var(--k4)'}}>Secciones</div>
          <div style={{display:'flex',gap:2}}>
            {selRamo&&<button onClick={()=>setShowNewFolder(true)} title="Nueva carpeta" style={{width:20,height:20,border:'none',background:'transparent',cursor:'pointer',color:'var(--k4)',display:'grid',placeItems:'center'}}><IcoPlus s={10}/></button>}
            <button onClick={()=>setColCarpetas(true)} style={{width:20,height:20,border:'none',background:'transparent',cursor:'pointer',color:'var(--k4)',display:'grid',placeItems:'center'}}><IcoCh dir="l" s={10}/></button>
          </div>
        </div>
        {showNewFolder&&<div style={{padding:'6px 10px',borderBottom:'1px solid var(--ln)',display:'flex',gap:6}}>
          <input value={newFolderName} onChange={e=>setNewFolderName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&createFolder()} placeholder="Nombre carpeta" style={{flex:1,fontSize:11,padding:'4px 8px',borderRadius:6,border:'1px solid var(--ln)',background:'var(--w)',outline:'none',fontFamily:'inherit'}}/>
          <Btn onClick={createFolder} size="sm" variant="pri">Crear</Btn>
        </div>}
        <div style={{overflowY:'auto',flex:1,minHeight:0}}>
          {!selRamo&&<div style={{padding:'12px',fontSize:12,color:'var(--k4)'}}>Selecciona un ramo</div>}
          {folders.map(c=>{
            const cf=customFolders.find(f=>f.key===c.id);
            const isCustom=!!cf;
            const isEditing=editingFolder===cf?.id;

function SecAprender({cuads,setCuads,user,ramos=[]}){

  const [blockFiles,setBlockFiles]=useState([]);

  const [streaming,setStreaming]=useState(false);
  const [streamBuf,setStreamBuf]=useState('');
  const [blockMemory,setBlockMemory]=useState({});
  const [projectMemory,setProjectMemory]=useState({});
  const fRef=useRef(null);
  const endRef=useRef(null);
  const [nCuad,setNCuad]=useState({nombre:'',rid:''});
  const [nBloque,setNBloque]=useState({t:'',s:'',eid:''});
  const [showEditC,setShowEditC]=useState(false);
  const [editC,setEditC]=useState({rid:'',nombre:'',ramoId:'',color:'#1654b0'});
  const [showEditB,setShowEditB]=useState(false);
  const [editB,setEditB]=useState({id:'',t:'',s:''});

  // Color helpers — always use the cuad's stored color (which is synced to ramo color)
  const cColor=id=>{const c=cuads.find(x=>x.rid===id);return c?.color||'#1654b0';};
  const cGrad=id=>{const col=cColor(id);return `linear-gradient(135deg,${col}cc,${col}77)`;};
  const cFade=id=>{const col=cColor(id);return `linear-gradient(135deg,${col}1a,${col}0d)`;};

  // Load chat history from Supabase when a block is selected
  useEffect(()=>{
    if(!bid||!supabaseClient)return;
    const ck=`${cid}-${bid}`;
    if(chatMap[ck])return; // already loaded
    setLoadingChat(true);
    supabaseClient.from('aprender_block_chats')
      .select('role,content,created_at').eq('block_id',bid).order('created_at')
      .then(({data})=>{
        setLoadingChat(false);
        if(!data||data.length===0)return;
        setChatMap(prev=>({...prev,[ck]:data.map(m=>({role:m.role==='assistant'?'ai':m.role,text:m.content}))}));
      });
  },[bid]);

  useEffect(()=>{
    setBlockFiles([]);
    if(!bid||!supabaseClient)return;
    supabaseClient.from('aprender_block_sources')
      .select('id,name,content,file_path,type').eq('block_id',bid)
      .then(({data})=>setBlockFiles((data||[]).filter(s=>s.type==='file')));
  },[bid]);

  const cuad=cuads.find(c=>c.rid===cid);
  const bloque=cuad?.bloques.find(b=>b.id===bid);
  const ck=`${cid}-${bid}`;
  const msgs=chatMap[ck]||[];
  const ramo=RAMOS.find(r=>r.id===cid);
  const archRamo=ramo?.archivos||[];
  const bfNames=blockFiles.map(f=>f.name);
  const allSrc=[...archRamo.map(a=>a.n),...actSrc.filter(s=>!archRamo.find(a=>a.n===s)),...bfNames.filter(n=>!actSrc.includes(n)&&!archRamo.find(a=>a.n===n))];
  const togSrc=s=>setActSrc(prev=>prev.includes(s)?prev.filter(x=>x!==s):[...prev,s]);

  const send=async()=>{
    const txt=inp.trim();
    if(!txt||streaming)return;
    setInp('');
    const currentMsgs=chatMap[ck]||[];
    const userMsg={role:'user',text:txt};
    const nextMsgs=[...currentMsgs,userMsg];
    setChatMap(prev=>({...prev,[ck]:nextMsgs}));
    setStreaming(true);setStreamBuf('');
    try{
      const fileSources=await Promise.all(blockFiles.map(async f=>{
        if(f.file_path&&supabaseClient){
          const{data}=await supabaseClient.storage.from('ramo-files').createSignedUrl(f.file_path,3600);
          return{title:f.name,content:f.content||'',storageUrl:data?.signedUrl||null};
        }
        return{title:f.name,content:f.content||''};
      }));
      const sources=[...actSrc.map(s=>({title:s,content:''})),...fileSources];
      const resp=await fetch('/api/aprender-chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          sources,
          messages:nextMsgs.map(m=>({role:m.role==='ai'?'assistant':'user',content:m.text})),
          blockMemory:blockMemory[ck]||'',
          projectMemory:projectMemory[cid]||'',
        })
      });
      if(!resp.ok){const e=await resp.json();throw new Error(e.error||'Error del servidor');}
      const reader=resp.body.getReader();const dec=new TextDecoder();let full='';
      while(true){
        const {done,value}=await reader.read();if(done)break;
        dec.decode(value).split('\n').forEach(line=>{
          if(!line.startsWith('data: '))return;
          try{const j=JSON.parse(line.slice(6));
            if(j.chunk){full+=j.chunk;setStreamBuf(full);}
            if(j.done){
              setChatMap(prev=>({...prev,[ck]:[...nextMsgs,{role:'ai',text:full,srcs:actSrc}]}));
              setStreamBuf('');
              if(j.blockMemory)setBlockMemory(prev=>({...prev,[ck]:j.blockMemory}));
              if(j.projectMemory)setProjectMemory(prev=>({...prev,[cid]:j.projectMemory}));
              setCuads(prev=>prev.map(c=>c.rid===cid?{...c,bloques:c.bloques.map(b=>b.id===bid?{...b,msgs:b.msgs+1,ts:'hace 1 min'}:b)}:c));
            }
          }catch{}
        });
      }
    }catch(err){
      setChatMap(prev=>({...prev,[ck]:[...nextMsgs,{role:'ai',text:'**Error:** '+err.message,srcs:[],isError:true,retryText:txt}]}));
    }
    finally{setStreaming(false);}
  };
  useEffect(()=>{endRef.current?.parentElement?.scrollTo(0,endRef.current?.offsetTop||0);},[msgs.length,streamBuf]);

  const addCuad=async()=>{if(!nCuad.nombre||!supabaseClient||!user) return;const ramoId=nCuad.rid||null;const color=ramoId?(ramos.find(r=>r.id===ramoId)?.color||'#1654b0'):'#1654b0';const{data,error}=await supabaseClient.from('learning_models').insert({user_id:user.id,name:nCuad.nombre,color,ramo_id:ramoId}).select('id').single();if(error){console.error('Error creando cuaderno:',error.message);return;}setCuads(prev=>[...prev,{rid:data.id,nombre:nCuad.nombre,color,ramoId,bloques:[]}]);setCid(data.id);setShowAddC(false);setNCuad({nombre:'',rid:''});};
  const addBloque=async()=>{if(!nBloque.t||!supabaseClient||!user||!cid) return;const ord=(cuad?.bloques.length||0)+1;const title=`${String(ord).padStart(2,'0')} · ${nBloque.t}`;const{data,error}=await supabaseClient.from('aprender_blocks').insert({user_id:user.id,project_id:cid,title,order:ord}).select('id').single();if(error){console.error('Error creando bloque:',error.message);return;}const nb={id:data.id,t:title,s:nBloque.s||'Nuevo bloque',msgs:0,ts:'vacío',eid:nBloque.eid||null,color:cuad?.color||'#1654b0'};setCuads(prev=>prev.map(c=>c.rid===cid?{...c,bloques:[...c.bloques,nb]}:c));setBid(data.id);setShowAddB(false);setNBloque({t:'',s:'',eid:''});};
  const addUrl=()=>{if(!urlInp.trim()) return;setActSrc(prev=>[...prev,urlInp.trim()]);setUrlInp('');};
  const upFile=async(e)=>{
    const files=Array.from(e.target.files||[]);
    if(!files.length||!supabaseClient||!user)return;
    e.target.value='';
    setUploadingFile(true);

    for(const file of files){
      try{
        const content=await new Promise(res=>{
          const r=new FileReader();
          r.onload=ev=>res(ev.target.result||'');
          r.onerror=()=>res('');
          r.readAsText(file);
        });
        const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
        const path=`${user.id}/aprender/${bid}/${Date.now()}_${safeName}`;
        const {error:upErr}=await supabaseClient.storage.from('ramo-files').upload(path,file,{upsert:true});
        if(upErr){console.error('Upload error:',upErr.message);continue;}
        const {data:src}=await supabaseClient.from('aprender_block_sources')
          .insert({user_id:user.id,block_id:bid,type:'file',name:file.name,
                   content:content.slice(0,50000),file_path:path})
          .select('id').single();
        if(cuadObj?.ramoId){
          await supabaseClient.from('ramo_files').insert({
            user_id:user.id,ramo_id:cuadObj.ramoId,
            folder:'aprender',name:file.name,size:file.size,storage_path:path
          });
        }
        setBlockFiles(prev=>[...prev,{id:src?.id,name:file.name,content:content.slice(0,50000),type:'file',file_path:path}]);
      }catch(err){console.error('File upload failed:',err);}
    }
    setUploadingFile(false);
  };
  const removeBlockFile=async(fileId,fileName)=>{

  const saveEditCuad=async()=>{

    setShowEditB(false);

  return(
    <div style={{display:'flex',flex:1,overflow:'hidden'}}>
      {/* Col cuadernos */}

        <div style={{width:224,display:'flex',flexDirection:'column',height:'100%'}}>
          <div style={{padding:'13px 13px 8px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>

            {streaming&&!streamBuf&&<div style={{marginTop:14,padding:'10px 14px',borderRadius:12,background:'var(--p2)',display:'inline-flex',gap:6,alignItems:'center',fontSize:12,color:'var(--k4)'}}>Pensando…</div>}
            <div ref={endRef}/>

          <div style={{position:'absolute',bottom:14,left:16,right:16,background:'var(--w)',border:'1px solid var(--ln)',borderRadius:15,padding:'7px 9px',display:'flex',alignItems:'center',gap:7,boxShadow:'0 4px 24px -8px rgba(0,0,0,.12)'}}>
            <button onClick={()=>{setShowSrc(true);setSrcMode('arch');}} style={{width:28,height:28,borderRadius:8,border:'1px solid var(--ln)',background:'var(--p)',cursor:'pointer',display:'grid',placeItems:'center',color:'var(--k3)',flexShrink:0}}><IcoPlus s={13}/></button>

          </div>
        </>:<div style={{display:'grid',placeItems:'center',height:'100%',color:'var(--k4)',fontSize:13}}>Selecciona un bloque</div>}
      </div>
      <Modal open={showAddC} onClose={()=>setShowAddC(false)} title="Nuevo cuaderno"><div style={{display:'flex',flexDirection:'column',gap:12}}><Fld label="Nombre del cuaderno" value={nCuad.nombre} onChange={v=>setNCuad(p=>({...p,nombre:v}))} ph="Ej: Álgebra Lineal"/><Sel label="Vincular con ramo" value={nCuad.rid} onChange={v=>setNCuad(p=>({...p,rid:v}))} options={RAMOS.map(r=>({v:r.id,l:r.nombre+' · '+r.codigo}))}/><div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:4}}><Btn onClick={()=>setShowAddC(false)}>Cancelar</Btn><Btn onClick={addCuad} variant="pri">Crear cuaderno</Btn></div></div></Modal>

      <Modal open={showEditC} onClose={()=>setShowEditC(false)} title="Editar cuaderno">
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <Fld label="Nombre del cuaderno" value={editC.nombre} onChange={v=>setEditC(p=>({...p,nombre:v}))} ph="Ej: Álgebra Lineal" required/>

            </select>
          </div>
          <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:4,alignItems:'center'}}>
            <button onClick={async()=>{if(!confirm('¿Eliminar este cuaderno y todos sus bloques?'))return;const rid=editC.rid;if(supabaseClient){const cuad=cuads.find(c=>c.rid===rid);if(cuad){for(const b of cuad.bloques){await supabaseClient.from('aprender_block_chats').delete().eq('block_id',b.id);await supabaseClient.from('aprender_block_sources').delete().eq('block_id',b.id);await supabaseClient.from('aprender_blocks').delete().eq('id',b.id);}await supabaseClient.from('learning_submodules').delete().eq('model_id',rid);await supabaseClient.from('learning_models').delete().eq('id',rid);}}setCuads(p=>p.filter(c=>c.rid!==rid));if(cid===rid)setCid(null);setBid(null);setShowEditC(false);}} style={{marginRight:'auto',padding:'5px 10px',borderRadius:7,border:'1px solid var(--er)',background:'transparent',cursor:'pointer',color:'var(--er)',fontSize:11,fontWeight:500}}>Eliminar cuaderno</button>

          <Fld label="Descripción breve" value={editB.s} onChange={v=>setEditB(p=>({...p,s:v}))} ph="Ej: Definición épsilon-delta."/>
