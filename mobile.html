                  ))}
                </div>); })()}
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 10 }}>
                    <button onClick={() => { const input = document.createElement('input'); input.type = 'file'; input.accept = '.pdf,.docx,.pptx,.xlsx,.txt,.png,.jpg'; input.multiple = true; input.onchange = async (ev) => { const files = Array.from(ev.target.files || []); for (const file of files) { const localId = 'f' + Date.now() + Math.random().toString(36).slice(2, 5); const newFile = { id: localId, name: file.name, date: new Date().toISOString().slice(0, 10), programa: false }; if (supabaseClient && !_devMode && _userId) { const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_'); const path = `${_userId}/${ramo.id}/${Date.now()}_${safeName}`; const { error } = await supabaseClient.storage.from('ramo-files').upload(path, file, { upsert: true }); if (!error) { const { data } = await dbInsert('ramo_files', { ramo_id: ramo.id, name: file.name, size: file.size, storage_path: path, is_programa: false }); if (data) { const realFile = { id: data.id, name: file.name, date: new Date().toISOString().slice(0, 10), programa: false, storage_path: path }; updateRamo(ramo.id, r => ({ ...r, archivos: [...r.archivos, realFile], temario: r.temario.map(u => u.id === unit.id ? { ...u, archivos: [...u.archivos, data.id] } : u) })); } } } else { updateRamo(ramo.id, r => ({ ...r, archivos: [...r.archivos, newFile], temario: r.temario.map(u => u.id === unit.id ? { ...u, archivos: [...u.archivos, localId] } : u) })); } } }; input.click(); }}

                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                      Editar unidad

                  </div>
                  {editingUnit === unit.id && (
                    <div style={{ marginTop: 12, padding: 12, borderRadius: 8, border: '1.5px solid var(--ln)', background: 'var(--w)' }}>
                      <p style={{ fontSize: 11, fontWeight: 600, color: 'var(--k4)', marginBottom: 8, textTransform: 'uppercase', letterSpacing: '.05em' }}>Editar unidad</p>
                      <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
                        <input autoFocus value={editName} onChange={e => setEditName(e.target.value)} onKeyDown={e => e.key === 'Enter' && renameUnit(unit.id)}
                          style={{ flex: 1, padding: '8px 12px', borderRadius: 7, border: '1px solid var(--ln)', fontSize: 13, outline: 'none', fontFamily: 'inherit', background: 'var(--w)', color: 'var(--k)' }} />

                        <button onClick={() => { setEditingUnit(null); setConfirmDelete(null); }} style={{ padding: '8px 12px', borderRadius: 7, border: '1px solid var(--ln)', background: 'var(--p)', color: 'var(--k3)', fontSize: 12, cursor: 'pointer' }}>Cancelar</button>
                      </div>
                      <div style={{ borderTop: '1px solid var(--ls)', paddingTop: 10 }}>
                        {confirmDelete !== unit.id ? (
                          <button onClick={() => setConfirmDelete(unit.id)}
                            style={{ padding: '6px 14px', borderRadius: 6, border: 'none', background: 'var(--er)', color: '#fff', fontSize: 12, fontWeight: 500, cursor: 'pointer', opacity: .9 }}>

                          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                            <span style={{ fontSize: 12, color: 'var(--er)', fontWeight: 500 }}>Eliminar esta unidad?</span>

          <button onClick={() => setAdding(false)} style={{ padding: '8px 12px', borderRadius: 7, border: '1px solid var(--ln)', background: 'var(--p)', color: 'var(--k3)', fontSize: 13, cursor: 'pointer' }}>×</button>
        </div>
      )}
      {temario.length === 0 && !adding && <p style={{ padding: '20px 0', textAlign: 'center', color: 'var(--k3)', fontSize: 13 }}>Sin unidades — crea una para organizar el temario</p>}
    </div>
  );
}

/* ── Ramo Detail View ── */
function RamoDetail({ ramo, updateRamo, setRamos, pop }) {
  const [tab, setTab] = useState('notas');
  const [showEdit, setShowEdit] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [editForm, setEditForm] = useState({ name: ramo.name, code: ramo.codigo, section: ramo.seccion, professor: ramo.profesor, credits: String(ramo.credits || ''), color: ramo.color || '#1654b0' });
  const c = ramo.color || '#1654b0';
  const tabs = ['notas', 'asistencia', 'archivos', 'temario'];

  const saveEdit = () => {
    const updated = { name: editForm.name.trim(), codigo: editForm.code.trim(), seccion: editForm.section.trim(), profesor: editForm.professor.trim(), credits: parseInt(editForm.credits) || 0, color: editForm.color };
    updateRamo(ramo.id, r => ({ ...r, ...updated }));
    dbUpdate('ramos', { name: updated.name, code: updated.codigo, section: updated.seccion, professor: updated.profesor, credits: updated.credits, color: updated.color }, { id: ramo.id });
    setShowEdit(false);
  };

  const deleteRamo = () => {
    dbDelete('ramos', { id: ramo.id });
    setRamos(prev => prev.filter(r => r.id !== ramo.id));
    pop();
  };

  return (
    <div>
      {/* Header — desktop style */}
      <div style={{ padding: '16px 16px 0' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 14 }}>
          <div style={{ width: 22, height: 36, borderRadius: 6, background: ramoGrad(c), flexShrink: 0, boxShadow: `0 4px 12px -4px ${c}80` }} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <h2 style={{ fontSize: 18, fontWeight: 600, letterSpacing: '-0.022em' }}>{ramo.name}</h2>
            <p style={{ fontSize: 12, color: 'var(--k3)', marginTop: 2 }}>{ramo.codigo} · Sec {ramo.seccion} · {ramo.profesor}</p>
          </div>
          <button onClick={() => setShowEdit(true)} style={{ padding: '7px 14px', borderRadius: 7, border: '1px solid var(--ln)', background: 'var(--w)', color: 'var(--brand1)', fontSize: 13, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit' }}>Editar</button>
        </div>
        {/* Stats row */}
        <div style={{ display: 'flex', gap: 16, alignItems: 'center', marginBottom: 14 }}>
          <div style={{ textAlign: 'center' }}>
            <p style={{ fontSize: 20, fontWeight: 700, color: 'var(--k2)' }}>{ramo.credits || '—'}</p>
            <p style={{ fontSize: 11, color: 'var(--k3)', marginTop: 1 }}>Créditos</p>
          </div>
          <div style={{ textAlign: 'center' }}>
            <p style={{ fontSize: 22, fontWeight: 700, color: ncColor(ramo.nota) }}>{ramo.nota > 0 ? ramo.nota.toFixed(1) : '—'}</p>
            <p style={{ fontSize: 11, color: 'var(--k3)', marginTop: 1 }}>Promedio</p>
          </div>
          <div style={{ textAlign: 'center' }}>
            <p style={{ fontSize: 22, fontWeight: 700 }}>{ramo.asist || 0}%</p>
            <p style={{ fontSize: 11, color: 'var(--k3)', marginTop: 1 }}>Asistencia</p>
          </div>
        </div>
      </div>

      {/* Tab selector — desktop style */}
      <div style={{ display: 'flex', paddingLeft: 16 }}>
        {tabs.map(t => (
          <button key={t} onClick={() => setTab(t)} style={{
            padding: '8px 16px', fontSize: 13, fontWeight: 500,
            borderTop: 'none', borderLeft: 'none', borderRight: 'none',
            borderBottomWidth: 2, borderBottomStyle: 'solid',
            borderBottomColor: tab === t ? c : 'transparent',
            marginBottom: -1, background: 'none',
            color: tab === t ? 'var(--k)' : 'var(--k3)',
            cursor: 'pointer', textTransform: 'capitalize', fontFamily: 'inherit', transition: 'all .15s',
          }}>{t}</button>
        ))}
      </div>
      <div style={{ height: 1, background: 'var(--ln)', margin: '0 16px' }} />

      {tab === 'notas' && <RamoNotas ramo={ramo} updateRamo={updateRamo} />}
      {tab === 'asistencia' && <RamoAsistencia ramo={ramo} updateRamo={updateRamo} />}
      {tab === 'archivos' && <RamoArchivos ramo={ramo} updateRamo={updateRamo} />}
      {tab === 'temario' && <RamoTemario ramo={ramo} updateRamo={updateRamo} />}

      {/* Delete Ramo */}
      <div style={{ padding: '24px 16px 32px', textAlign: 'center' }}>
        {!confirmDelete ? (
          <button onClick={() => setConfirmDelete(true)} style={{ padding: '12px 24px', borderRadius: 10, border: '1px solid var(--er)', background: 'transparent', color: 'var(--er)', fontSize: 14, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit' }}>Eliminar ramo</button>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }}>
            <p style={{ fontSize: 13, color: 'var(--er)', fontWeight: 500 }}>Esta accion no se puede deshacer</p>
            <div style={{ display: 'flex', gap: 10 }}>
              <button onClick={() => setConfirmDelete(false)} style={{ padding: '10px 18px', borderRadius: 8, border: '1px solid var(--ln)', background: 'var(--p)', color: 'var(--k3)', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}>Cancelar</button>
              <button onClick={deleteRamo} style={{ padding: '10px 18px', borderRadius: 8, border: 'none', background: 'var(--er)', color: '#fff', fontSize: 13, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>Confirmar eliminar</button>
            </div>
          </div>
        )}
      </div>

      {/* Edit Ramo Sheet */}
      {showEdit && (
        <div className="sheet-overlay" onClick={() => setShowEdit(false)}>
          <div className="sheet-panel" onClick={e => e.stopPropagation()} style={{ maxHeight: '85vh' }}>
            <div className="sheet-handle" />
            <h3 className="sheet-title">Editar ramo</h3>
            <div style={{ padding: '0 18px 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div className="field">
                <label>Nombre</label>
                <input value={editForm.name} onChange={e => setEditForm(f => ({ ...f, name: e.target.value }))} style={{ width: '100%', padding: '10px 12px', border: '1px solid var(--ln)', borderRadius: 8, fontSize: 15, outline: 'none', background: 'var(--w)', color: 'var(--k)', fontFamily: 'inherit' }} />
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                <div className="field">
                  <label>Codigo</label>
                  <input value={editForm.code} onChange={e => setEditForm(f => ({ ...f, code: e.target.value }))} style={{ width: '100%', padding: '10px 12px', border: '1px solid var(--ln)', borderRadius: 8, fontSize: 15, outline: 'none', background: 'var(--w)', color: 'var(--k)', fontFamily: 'inherit' }} />
                </div>
                <div className="field">
                  <label>Seccion</label>
                  <input value={editForm.section} onChange={e => setEditForm(f => ({ ...f, section: e.target.value }))} style={{ width: '100%', padding: '10px 12px', border: '1px solid var(--ln)', borderRadius: 8, fontSize: 15, outline: 'none', background: 'var(--w)', color: 'var(--k)', fontFamily: 'inherit' }} />
                </div>
              </div>
              <div className="field">
                <label>Profesor</label>
                <input value={editForm.professor} onChange={e => setEditForm(f => ({ ...f, professor: e.target.value }))} style={{ width: '100%', padding: '10px 12px', border: '1px solid var(--ln)', borderRadius: 8, fontSize: 15, outline: 'none', background: 'var(--w)', color: 'var(--k)', fontFamily: 'inherit' }} />
              </div>
              <div className="field">
                <label>Creditos</label>
                <input type="number" value={editForm.credits} onChange={e => setEditForm(f => ({ ...f, credits: e.target.value }))} style={{ width: '100%', padding: '10px 12px', border: '1px solid var(--ln)', borderRadius: 8, fontSize: 15, outline: 'none', background: 'var(--w)', color: 'var(--k)', fontFamily: 'inherit' }} />
              </div>
              <div className="field">
                <label>Color</label>
                <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginTop: 6 }}>
                  {RAMO_COLORS.map(col => (
                    <button key={col} onClick={() => setEditForm(f => ({ ...f, color: col }))} style={{ width: 32, height: 32, borderRadius: 8, background: col, border: editForm.color === col ? '3px solid var(--k)' : '2px solid transparent', cursor: 'pointer', transition: 'border .15s' }} />
                  ))}
                </div>
              </div>
              <div style={{ display: 'flex', gap: 10, marginTop: 8 }}>
                <button onClick={() => setShowEdit(false)} style={{ flex: 1, padding: '12px', borderRadius: 10, border: '1px solid var(--ln)', background: 'var(--p)', color: 'var(--k3)', fontSize: 15, cursor: 'pointer', fontFamily: 'inherit' }}>Cancelar</button>
                <button onClick={saveEdit} style={{ flex: 1, padding: '12px', borderRadius: 10, border: 'none', background: 'var(--brand1)', color: '#fff', fontSize: 15, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>Guardar</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Ramo List ── */
const RAMO_COLORS = ['#b00d6e','#1654b0','#0e6e72','#8b5cf6','#b25e09','#d70015','#1a8a82'];

function SecRamos({ push, ramos, setRamos }) {
  const [showNew, setShowNew] = useState(false);
  const [form, setForm] = useState({ name: '', code: '', section: '', professor: '', credits: '', color: RAMO_COLORS[0] });

  const createRamo = async () => {
    if (!form.name.trim()) return;
    const localRamo = {
      id: 'r' + Date.now(),
      name: form.name.trim(),
      codigo: form.code.trim(),
      seccion: form.section.trim(),
      profesor: form.professor.trim(),
      color: form.color,
      credits: parseInt(form.credits) || 0,
      nota: 0,
      asist: 0,
      evaluation_modules: [],
      attendance: [],
      archivos: [],
      temario: [],
    };
    if (!_devMode) {
      const { data } = await dbInsert('ramos', { name: form.name.trim(), code: form.code.trim(), section: form.section.trim(), professor: form.professor.trim(), credits: parseInt(form.credits) || 0, color: form.color });
      if (data) localRamo.id = data.id;
    }
    setRamos(prev => [...prev, localRamo]);
    setForm({ name: '', code: '', section: '', professor: '', credits: '', color: RAMO_COLORS[0] });
    setShowNew(false);
  };

  return (
    <div style={{ padding: '0 0 20px' }}>
      <div className="sec-header" style={{ paddingTop: 14 }}>
        <h2>{ramos.length} ramos</h2>
        <button onClick={() => setShowNew(true)} style={{ padding: '6px 12px', borderRadius: 6, border: 'none', background: 'var(--brand1)', color: '#fff', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>+ Nuevo</button>
      </div>
      <div className="card" style={{ margin: '0 16px' }}>
        {ramos.map((ramo, i) => {
          const c = ramo.color || '#1654b0';
          return (
            <div key={ramo.id}>
              {i > 0 && <div style={{ height: 1, background: 'var(--ls)', margin: '0 14px' }} />}
              <button onClick={() => push('ramo-detail', { ramoId: ramo.id, title: ramo.name })}

/* ── Chat message renderer ── */
function ChatMsg({ text }) {
  // Simple markdown-like rendering
  const lines = text.split('\n');
  return lines.map((line, i) => {
    if (line.startsWith('## ')) return <p key={i} style={{ fontWeight: 700, fontSize: 15, marginTop: 10, marginBottom: 2 }}>{line.slice(3)}</p>;
    if (line.startsWith('### ')) return <p key={i} style={{ fontWeight: 700, fontSize: 14, marginTop: 8, marginBottom: 2 }}>{line.slice(4)}</p>;
    if (line.startsWith('$$') && line.endsWith('$$')) return <div key={i} style={{ background: 'rgba(22,84,176,.06)', borderRadius: 7, padding: '10px 14px', margin: '7px 0', fontFamily: 'ui-monospace,monospace', fontSize: 13, color: '#1654b0', textAlign: 'center' }}>{line.slice(2, -2)}</div>;
    if (line.startsWith('- ') || line.match(/^\d+\.\s/)) return <p key={i} style={{ paddingLeft: 14, lineHeight: 1.4 }}>{renderInline(line)}</p>;
    if (line.trim() === '') return <div key={i} style={{ height: 6 }} />;
    return <p key={i} style={{ lineHeight: 1.4 }}>{renderInline(line)}</p>;
  });
}

function renderInline(text) {
  // Split on $...$ and **...** and `...`
  const parts = [];
  let rest = text;
  let key = 0;
  const rx = /(\$[^$]+\$|\*\*[^*]+\*\*|`[^`]+`|\\boxed\{[^}]+\})/;
  while (rest) {
    const m = rest.match(rx);
    if (!m) { parts.push(rest); break; }
    if (m.index > 0) parts.push(rest.slice(0, m.index));
    const tok = m[0];
    if (tok.startsWith('\\boxed{')) {
      parts.push(<span key={key++} style={{ background: 'rgba(22,84,176,.1)', color: '#1654b0', borderRadius: 4, padding: '1px 7px', fontFamily: 'ui-monospace,monospace', fontSize: 13, fontWeight: 700 }}>{tok.slice(7, -1)}</span>);
    } else if (tok.startsWith('$')) {
      parts.push(<span key={key++} style={{ fontFamily: 'ui-monospace,monospace', fontSize: 13, background: 'rgba(22,84,176,.07)', color: '#1654b0', padding: '0px 6px', borderRadius: 3 }}>{tok.slice(1, -1)}</span>);
    } else if (tok.startsWith('**')) {
      parts.push(<strong key={key++}>{tok.slice(2, -2)}</strong>);
    } else if (tok.startsWith('`')) {
      parts.push(<code key={key++} style={{ fontFamily: 'ui-monospace,monospace', fontSize: 13, background: 'var(--p2)', padding: '0px 6px', borderRadius: 3 }}>{tok.slice(1, -1)}</code>);
    }
    rest = rest.slice(m.index + tok.length);
  }
  return parts;
}

/* ── Block Chat View ── */
function BlockChat({ block, cuaderno, ramos }) {
  const [msgs, setMsgs] = useState([]);
  const [inp, setInp] = useState('');
  const [loadingChats, setLoadingChats] = useState(true);
  const [blockMemory, setBlockMemory] = useState('');
  const [projectMemory, setProjectMemory] = useState('');

  // Load chats + memory on mount
  useEffect(() => {
    if (_devMode || !supabaseClient) {
      setMsgs(block.chats || []);
      setLoadingChats(false);
      return;
    }
    supabaseClient.from('aprender_block_chats')
      .select('role,content,created_at')
      .eq('block_id', block.id)
      .order('created_at')
      .then(({ data }) => {
        setMsgs((data || []).map(m => ({ role: m.role === 'assistant' ? 'ai' : m.role, text: m.content })));
        setLoadingChats(false);
      });
    // Load block memory
    supabaseClient.from('aprender_block_memory')
      .select('block_memory,project_memory')
      .eq('block_id', block.id)
      .single()
      .then(({ data }) => {
        if (data) {
          setBlockMemory(data.block_memory || '');
          setProjectMemory(data.project_memory || '');
        }
      });
  }, [block.id]);
  const [streaming, setStreaming] = useState(false);
  const [showSrc, setShowSrc] = useState(false);
  const [srcMode, setSrcMode] = useState('arch');
  const [actSrc, setActSrc] = useState([]);
  const [blockFiles, setBlockFiles] = useState([]);
  const [urlInp, setUrlInp] = useState('');
  const scrollRef = useRef(null);
  const fileRef = useRef(null);
  const ramo = ramos.find(r => r.id === cuaderno.ramo_id);
  const c = ramo?.color || '#1654b0';
  const archRamo = ramo?.archivos || [];
  const togSrc = s => setActSrc(prev => prev.includes(s) ? prev.filter(x => x !== s) : [...prev, s]);

  useEffect(() => { scrollRef.current?.scrollTo(0, scrollRef.current.scrollHeight); }, [msgs]);

  const handleUpload = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    for (const file of files) {
      const localId = 'bf' + Date.now();
      setBlockFiles(prev => [...prev, { id: localId, name: file.name }]);
      setActSrc(prev => [...prev, file.name]);
      // Upload to Storage if not dev mode
      if (supabaseClient && !_devMode && _userId) {
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const path = `${_userId}/aprender/${block.id}/${Date.now()}_${safeName}`;
        const { error } = await supabaseClient.storage.from('aprender-files').upload(path, file, { upsert: true });
        if (!error) {
          const content = await new Promise(res => { const r = new FileReader(); r.onload = ev => res(ev.target.result || ''); r.onerror = () => res(''); r.readAsText(file); });
          dbInsert('aprender_block_sources', { block_id: block.id, type: 'file', name: file.name, content: content.slice(0, 50000), file_path: path });
        }
      }
    }
  };

  const addUrl = () => {
    if (!urlInp.trim()) return;
    const name = urlInp.trim();
    setActSrc(prev => [...prev, name]);
    setUrlInp('');
  };

  const [streamBuf, setStreamBuf] = useState('');

  const send = () => {
    if (!inp.trim() || streaming) return;
    const userText = inp.trim();
    const srcs = actSrc.length > 0 ? [...actSrc] : undefined;
    setMsgs(prev => [...prev, { role: 'user', text: userText }]);
    setInp(''); setStreaming(true); setStreamBuf('');

    // Build messages array for API
    const apiMsgs = [...msgs, { role: 'user', text: userText }].map(m => ({ role: m.role === 'ai' ? 'assistant' : m.role, content: m.text }));

    // Build sources for API
    const apiSources = (srcs || []).map(s => {
      const file = archRamo.find(f => f.name === s);
      return { title: s, content: '', storageUrl: file?.storage_path ? `${SUPABASE_URL}/storage/v1/object/authenticated/ramo-files/${file.storage_path}` : undefined };
    });

    if (_devMode) {
      // Dev mode: simulate
      setTimeout(() => {
        setMsgs(prev => [...prev, { role: 'ai', text: 'Respuesta simulada del tutor IA (modo dev).\n\nEn producción se conectará al endpoint real.', srcs }]);
        setStreaming(false); setStreamBuf('');
      }, 800);
      return;
    }

    // Real SSE streaming
    streamChat('/api/aprender-chat', {
      sources: apiSources,
      messages: apiMsgs,
      blockMemory,
      projectMemory,
    }, {
      onChunk: (full) => setStreamBuf(full),
      onDone: (full, meta) => {
        setStreamBuf('');
        setMsgs(prev => [...prev, { role: 'ai', text: full, srcs }]);
        setStreaming(false);
        // Persist to DB
        dbInsert('aprender_block_chats', { block_id: block.id, role: 'user', content: userText });
        dbInsert('aprender_block_chats', { block_id: block.id, role: 'assistant', content: full });
        // Update block memory if returned
        if (meta && meta.blockMemory != null && meta.projectMemory != null) {
          setBlockMemory(meta.blockMemory);
          setProjectMemory(meta.projectMemory);
          dbUpdate('aprender_block_memory', { block_memory: meta.blockMemory, project_memory: meta.projectMemory }, { block_id: block.id });
        }
      },
      onError: (err) => {
        console.error('Chat error:', err);
        setMsgs(prev => [...prev, { role: 'ai', text: 'Error al conectar con el tutor IA. Intenta de nuevo.' }]);
        setStreaming(false); setStreamBuf('');
      },
    });
  };

  const IcoFile = () => <svg width={11} height={11} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', position: 'relative' }}>
      {/* Sources panel */}
      {showSrc && (
        <div style={{ background: 'var(--w)', borderBottom: '1px solid var(--ln)', padding: '12px 16px', flexShrink: 0 }}>
          {/* Segmented control */}
          <div style={{ display: 'flex', padding: 2, borderRadius: 7, background: 'var(--p2)', position: 'relative', marginBottom: 12 }}>
            {[{ v: 'arch', l: 'Archivos' }, { v: 'url', l: 'URL' }, { v: 'bib', l: 'Biblioteca' }].map((o, i) => (
              <button key={o.v} onClick={() => setSrcMode(o.v)} style={{ position: 'relative', zIndex: 1, flex: 1, border: 0, background: srcMode === o.v ? 'var(--w)' : 'transparent', fontWeight: 500, fontSize: 12, padding: '7px 6px', cursor: 'pointer', borderRadius: 5, color: srcMode === o.v ? 'var(--k)' : 'var(--k3)', fontFamily: 'inherit', boxShadow: srcMode === o.v ? '0 1px 3px rgba(0,0,0,.12)' : 'none' }}>{o.l}</button>
            ))}
          </div>

          {/* Archivos del ramo */}
          {srcMode === 'arch' && (
            <div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7, marginBottom: 10 }}>
                {archRamo.map(a => (
                  <button key={a.id} onClick={() => togSrc(a.name)} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '3px 10px', borderRadius: 6, border: `1px solid ${actSrc.includes(a.name) ? '#1654b0' : 'var(--ln)'}`, background: actSrc.includes(a.name) ? 'rgba(22,84,176,.09)' : 'var(--p)', fontSize: 12, fontWeight: 500, color: actSrc.includes(a.name) ? '#1654b0' : 'var(--k3)', cursor: 'pointer', fontFamily: 'inherit' }}>
                    <IcoFile />{a.name}{actSrc.includes(a.name) && <span style={{ color: '#1654b0', fontSize: 11 }}>✓</span>}
                  </button>
                ))}
                {archRamo.length === 0 && <p style={{ fontSize: 12, color: 'var(--k4)' }}>Sin archivos en este ramo</p>}
              </div>
              {/* Uploaded files */}
              {blockFiles.length > 0 && (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 3, marginBottom: 10 }}>
                  {blockFiles.map(f => (
                    <div key={f.id} style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '3px 10px', borderRadius: 6, border: '1px solid var(--ln)', background: 'var(--p2)', fontSize: 12, fontWeight: 500, color: 'var(--k)' }}>
                      <IcoFile /><span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.name}</span>
                      <button onClick={() => { setBlockFiles(prev => prev.filter(x => x.id !== f.id)); setActSrc(prev => prev.filter(x => x !== f.name)); }} style={{ border: 'none', background: 'none', cursor: 'pointer', color: 'var(--k4)', padding: 0, fontSize: 15, lineHeight: 1 }}>×</button>
                    </div>
                  ))}
                </div>
              )}
              <button onClick={() => fileRef.current?.click()} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, fontWeight: 500, color: '#1654b0', border: '1px dashed rgba(22,84,176,.3)', background: 'transparent', padding: '6px 12px', borderRadius: 6, cursor: 'pointer', fontFamily: 'inherit' }}>
                <svg width={10} height={10} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Subir archivo
              </button>
              <input ref={fileRef} type="file" multiple style={{ display: 'none' }} onChange={handleUpload} />
            </div>
          )}

          {/* URL */}
          {srcMode === 'url' && (
            <div style={{ display: 'flex', gap: 8 }}>
              <input value={urlInp} onChange={e => setUrlInp(e.target.value)} onKeyDown={e => e.key === 'Enter' && addUrl()} placeholder="https://..."
                style={{ flex: 1, padding: '8px 12px', borderRadius: 7, border: '1px solid var(--ln)', background: 'var(--w)', fontSize: 13, color: 'var(--k)', outline: 'none', fontFamily: 'inherit' }} />
              <button onClick={addUrl} style={{ padding: '7px 12px', borderRadius: 7, border: 'none', background: 'linear-gradient(125deg,#1654b0,#3a26a0)', color: '#fff', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>Añadir</button>
            </div>

          {/* Biblioteca */}
          {srcMode === 'bib' && (
            <div>
              <p style={{ fontSize: 12, color: 'var(--k3)', marginBottom: 8 }}>Todos los archivos:</p>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                {ramos.flatMap(r => (r.archivos || []).map(a => ({ ...a, rn: r.name, rc: r.color }))).map(a => (
                  <button key={a.id} onClick={() => togSrc(a.name)} style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '7px 12px', borderRadius: 6, border: `1px solid ${actSrc.includes(a.name) ? '#1654b0' : 'transparent'}`, background: actSrc.includes(a.name) ? 'rgba(22,84,176,.07)' : 'var(--p)', fontSize: 12, cursor: 'pointer', textAlign: 'left', color: 'var(--k)', fontFamily: 'inherit', width: '100%' }}>

                    <span style={{ flex: 1, fontWeight: 500 }}>{a.name}</span>

/* ── Aprender Section ── */
function SecAprender({ push, ramos, cuadernos, setCuadernos }) {
  const [showNew, setShowNew] = useState(false);
  const [form, setForm] = useState({ name: '', ramo_id: '' });

  const createCuaderno = async () => {
    if (!form.name.trim()) return;
    const localCuad = {
      id: 'lm' + Date.now(),
      name: form.name.trim(),
      ramo_id: form.ramo_id || null,
      bloques: [],
    };
    if (!_devMode) {
      const insertData = { name: form.name.trim() };
      if (form.ramo_id && form.ramo_id.length > 0) insertData.ramo_id = form.ramo_id;
      const { data } = await dbInsert('learning_models', insertData);
      if (data) localCuad.id = data.id;
    }
    setCuadernos(prev => [...prev, localCuad]);
    setForm({ name: '', ramo_id: '' });
    setShowNew(false);
  };

  return (
    <div style={{ padding: '0 0 20px' }}>
      <div className="sec-header" style={{ paddingTop: 14 }}>
        <h2>Cuadernos</h2>
        <button onClick={() => setShowNew(true)} style={{ padding: '6px 12px', borderRadius: 6, border: 'none', background: 'var(--brand1)', color: '#fff', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>+ Nuevo</button>
      </div>
      <div className="card" style={{ margin: '0 16px' }}>
        {cuadernos.map((cuad, i) => {
          const ramo = ramos.find(r => r.id === cuad.ramo_id);
          const c = ramo?.color || '#1654b0';
          const blockCount = cuad.bloques.length;
          return (
            <div key={cuad.id}>
              {i > 0 && <div style={{ height: 1, background: 'var(--ls)', margin: '0 14px' }} />}
              <button onClick={() => push('cuaderno-blocks', { cuadId: cuad.id, title: cuad.name })}
                style={{ padding: '12px 14px', cursor: 'pointer', background: 'transparent', border: 'none', width: '100%', textAlign: 'left', fontFamily: 'inherit' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <div style={{ width: 14, height: 20, borderRadius: 3, background: ramoGrad(c), flexShrink: 0 }} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p style={{ fontSize: 13, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: 'var(--k)' }}>{cuad.name}</p>
                    <p style={{ fontSize: 11, color: 'var(--k3)', marginTop: 1 }}>{blockCount} bloque{blockCount !== 1 ? 's' : ''} · {ramo?.codigo || ''}</p>
                  </div>
                  <span style={{ color: 'var(--k4)', fontSize: 13 }}>›</span>
                </div>
              </button>
            </div>
          );
        })}
      </div>
      {showNew && (
        <Sheet title="Nuevo cuaderno" onClose={() => setShowNew(false)}>
          <FormRow label="Nombre del cuaderno"><input value={form.name} onChange={e => setForm(p => ({ ...p, name: e.target.value }))} placeholder="Ej: Apuntes Cálculo" className="field-input" /></FormRow>
          <FormRow label="Ramo (opcional)">
            <select value={form.ramo_id} onChange={e => setForm(p => ({ ...p, ramo_id: e.target.value }))} className="field-input">
              <option value="">Sin ramo</option>
              {ramos.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
            </select>
          </FormRow>
          <button className="btn btn-pri" style={{ width: '100%', marginTop: 10 }} onClick={createCuaderno} disabled={!form.name.trim()}>Crear cuaderno</button>
        </Sheet>
      )}
    </div>
  );
}

/* ── Blocks list within a cuaderno ── */
function CuadernoBlocks({ cuaderno, push, ramos, setCuadernos, pop }) {
  const ramo = ramos.find(r => r.id === cuaderno.ramo_id);
  const c = ramo?.color || '#1654b0';
  const [showNew, setShowNew] = useState(false);
  const [blockTitle, setBlockTitle] = useState('');
  const [showEditCuad, setShowEditCuad] = useState(false);
  const [editName, setEditName] = useState(cuaderno.name);
  const [editRamoId, setEditRamoId] = useState(cuaderno.ramo_id || '');
  const [confirmDelete, setConfirmDelete] = useState(false);

  const deleteCuaderno = () => {
    dbDelete('learning_models', { id: cuaderno.id });
    setCuadernos(prev => prev.filter(c => c.id !== cuaderno.id));
    pop();
  };

  const saveCuaderno = async () => {
    const newRamoId = editRamoId && editRamoId.length > 0 ? editRamoId : null;
    setCuadernos(prev => prev.map(c => c.id === cuaderno.id ? { ...c, name: editName.trim(), ramo_id: newRamoId } : c));
    const res = await dbUpdate('learning_models', { name: editName.trim(), ramo_id: newRamoId }, { id: cuaderno.id });
    if (res?.error) console.error('Save cuaderno error:', res.error);
    setShowEditCuad(false);
  };

  const deleteBlock = (blockId) => {
    dbDelete('aprender_blocks', { id: blockId });
    setCuadernos(prev => prev.map(c => c.id === cuaderno.id ? { ...c, bloques: c.bloques.filter(b => b.id !== blockId) } : c));
  };

  const createBlock = async () => {
    if (!blockTitle.trim()) return;
    const localBlock = { id: 'bl' + Date.now(), t: blockTitle.trim(), s: '', msgs: 0, ts: 'ahora', chats: [] };
    if (!_devMode) {
      const { data } = await dbInsert('aprender_blocks', { project_id: cuaderno.id, title: blockTitle.trim(), order: cuaderno.bloques.length + 1 });
      if (data) localBlock.id = data.id;
    }
    setCuadernos(prev => prev.map(c => c.id === cuaderno.id ? { ...c, bloques: [...c.bloques, localBlock] } : c));
    setBlockTitle(''); setShowNew(false);
  };

  return (
    <div style={{ padding: '0 0 20px' }}>
      {/* Cuaderno header with edit */}
      <div style={{ padding: '14px 16px', borderBottom: '1px solid var(--ls)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 16, height: 22, borderRadius: 4, background: ramoGrad(c), flexShrink: 0 }} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <p style={{ fontSize: 14, fontWeight: 600 }}>{cuaderno.name}</p>
            <p style={{ fontSize: 12, color: 'var(--k3)' }}>{ramo?.codigo || ''} · {ramo?.name || ''}</p>
          </div>
          <button onClick={() => setShowEditCuad(true)} style={{ padding: '6px 12px', borderRadius: 6, border: '1px solid var(--ln)', background: 'var(--w)', color: 'var(--k3)', fontSize: 12, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit' }}>Editar</button>
        </div>
      </div>

      <div className="sec-header">
        <h2>Bloques</h2>
        <button onClick={() => setShowNew(true)} style={{ padding: '6px 12px', borderRadius: 6, border: 'none', background: 'var(--brand1)', color: '#fff', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>+ Nuevo</button>
      </div>

      {/* Blocks — tap navigates directly */}
      <div className="card" style={{ margin: '0 16px' }}>
        {cuaderno.bloques.map((block, i) => (
          <div key={block.id}>
            {i > 0 && <div style={{ height: 1, background: 'var(--ls)', margin: '0 14px' }} />}
            <button onClick={() => push('block-chat', { cuadId: cuaderno.id, blockId: block.id, title: block.t })}
              style={{ padding: '12px 14px', cursor: 'pointer', background: 'transparent', border: 'none', width: '100%', textAlign: 'left', fontFamily: 'inherit' }}>
              <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <p style={{ fontSize: 13, fontWeight: 600, lineHeight: 1.3, color: 'var(--k)' }}>{block.t}</p>
                  {block.s && <p style={{ fontSize: 12, color: 'var(--k3)', marginTop: 2, lineHeight: 1.3 }}>{block.s}</p>}
                  <span style={{ fontSize: 11, color: 'var(--k4)', marginTop: 3, display: 'block' }}>{block.msgs} mensaje{block.msgs !== 1 ? 's' : ''} · {block.ts}</span>
                </div>
                <span style={{ color: 'var(--k4)', fontSize: 13, marginTop: 2 }}>›</span>
              </div>
            </button>
          </div>
        ))}
      </div>

      {/* Edit cuaderno sheet */}
      {showEditCuad && (
        <Sheet title="Editar cuaderno" onClose={() => { setShowEditCuad(false); setConfirmDelete(false); }}>
          <FormRow label="Nombre"><input value={editName} onChange={e => setEditName(e.target.value)} className="field-input" /></FormRow>
          <FormRow label="Ramo (opcional)">
            <select value={editRamoId} onChange={e => setEditRamoId(e.target.value)} className="field-input">
              <option value="">Sin ramo</option>
              {ramos.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
            </select>
          </FormRow>
          <button className="btn btn-pri" style={{ width: '100%', marginTop: 10 }} onClick={saveCuaderno} disabled={!editName.trim()}>Guardar cambios</button>

          {/* Delete blocks inside edit */}
          {cuaderno.bloques.length > 0 && (
            <div style={{ marginTop: 16, borderTop: '1px solid var(--ls)', paddingTop: 12 }}>
              <p style={{ fontSize: 11, fontWeight: 600, color: 'var(--k4)', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 8 }}>Bloques</p>
              {cuaderno.bloques.map(b => (
                <div key={b.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '7px 0', borderBottom: '1px solid var(--ls)' }}>
                  <span style={{ fontSize: 12, color: 'var(--k)' }}>{b.t}</span>
                  <button onClick={() => deleteBlock(b.id)} style={{ fontSize: 11, color: 'var(--er)', background: 'none', border: 'none', cursor: 'pointer', padding: '2px 8px' }}>Eliminar</button>
                </div>
              ))}
            </div>
          )}

          {/* Delete cuaderno */}
          <div style={{ marginTop: 16, borderTop: '1px solid var(--ls)', paddingTop: 12 }}>
            {!confirmDelete ? (
              <button onClick={() => setConfirmDelete(true)} style={{ width: '100%', padding: '10px', borderRadius: 'var(--r-sm)', border: 'none', background: 'rgba(215,0,21,.08)', color: 'var(--er)', fontSize: 13, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit' }}>Eliminar cuaderno</button>
            ) : (
              <div style={{ display: 'flex', gap: 10 }}>
                <button onClick={() => setConfirmDelete(false)} style={{ flex: 1, padding: '10px', borderRadius: 'var(--r-sm)', border: '1px solid var(--ln)', background: 'var(--p)', color: 'var(--k3)', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}>Cancelar</button>
                <button onClick={deleteCuaderno} style={{ flex: 1, padding: '10px', borderRadius: 'var(--r-sm)', border: 'none', background: 'var(--er)', color: '#fff', fontSize: 13, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit' }}>Confirmar</button>
              </div>
            )}
          </div>
        </Sheet>
      )}
      {showNew && (
        <Sheet title="Nuevo bloque" onClose={() => setShowNew(false)}>
          <FormRow label="Título del bloque"><input value={blockTitle} onChange={e => setBlockTitle(e.target.value)} placeholder="Ej: Derivadas parciales" className="field-input" /></FormRow>
          <button className="btn btn-pri" style={{ width: '100%', marginTop: 10 }} onClick={createBlock} disabled={!blockTitle.trim()}>Crear bloque</button>
        </Sheet>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────
   SECTION: CALENDARIO (placeholder)
───────────────────────────────────────────── */
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS_SEM = ['Lu','Ma','Mi','Ju','Vi','Sa','Do'];

function SecCalendario({ push, ramos, tasks, setTasks }) {
  const now = new Date();
  const [mes, setMes] = useState(now.getMonth());
  const [year, setYear] = useState(now.getFullYear());
  const [selDay, setSelDay] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [showPast, setShowPast] = useState(false);

  const hoyDay = now.getFullYear() === year && now.getMonth() === mes ? now.getDate() : null;

  // Build calendar grid
  const firstDay = new Date(year, mes, 1).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1; // Monday start
  const daysInMonth = new Date(year, mes + 1, 0).getDate();
  const celdas = [];
  for (let i = 0; i < offset; i++) celdas.push(null);
  for (let d = 1; d <= daysInMonth; d++) celdas.push(d);

  // Map tasks to days
  const tasksByDay = {};
  tasks.forEach(t => {
    const d = new Date(t.due_date + 'T00:00:00');
    if (d.getMonth() === mes && d.getFullYear() === year) {
      const day = d.getDate();
      if (!tasksByDay[day]) tasksByDay[day] = [];
      const ramo = ramos.find(r => r.id === t.ramo_id);
      tasksByDay[day].push({ ...t, c: ramo?.color || '#1654b0', rName: ramo?.name || '' });
    }
  });

  // Filtered task list
  const allEvts = tasks.map(t => {
    const ramo = ramos.find(r => r.id === t.ramo_id);
    const d = daysUntil(t.due_date);
    const dd = new Date(t.due_date + 'T00:00:00');
    const dayOfMonth = dd.getDate();
    const inMonth = dd.getMonth() === mes && dd.getFullYear() === year;
    return { ...t, c: ramo?.color || '#1654b0', rName: ramo?.name || '', d, dayOfMonth, inMonth,
      fDate: dd.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' }) };
  }).filter(t => selDay ? (t.inMonth && t.dayOfMonth === selDay) : true)
    .sort((a, b) => new Date(a.due_date) - new Date(b.due_date));

  const activeEvts = allEvts.filter(t => !t.completed);
  const pastEvts = allEvts.filter(t => t.completed);

  const toggleComplete = (id) => setTasks(prev => prev.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
  const delTask = (id) => setTasks(prev => prev.filter(t => t.id !== id));

  const prevMonth = () => { setSelDay(null); if (mes === 0) { setMes(11); setYear(y => y - 1); } else setMes(m => m - 1); };
  const nextMonth = () => { setSelDay(null); if (mes === 11) { setMes(0); setYear(y => y + 1); } else setMes(m => m + 1); };

  return (
    <div style={{ padding: '0 0 20px' }}>
      {/* Month header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 16px 10px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontSize: 16, fontWeight: 600 }}>{MESES[mes]} {year}</span>
          {selDay && (
            <button onClick={() => setSelDay(null)} style={{ fontSize: 12, padding: '2px 7px', borderRadius: 999, border: '1px solid var(--ln)', background: 'var(--p2)', cursor: 'pointer', color: 'var(--k3)', fontFamily: 'inherit' }}>
              ✕ {selDay} {MESES[mes].slice(0, 3)}
            </button>
          )}
        </div>
        <div style={{ display: 'flex', gap: 6 }}>
          <button onClick={prevMonth} style={{ width: 24, height: 24, borderRadius: 6, border: 'none', background: 'var(--p2)', cursor: 'pointer', fontSize: 15, color: 'var(--k3)', display: 'grid', placeItems: 'center' }}>‹</button>
          <button onClick={nextMonth} style={{ width: 24, height: 24, borderRadius: 6, border: 'none', background: 'var(--p2)', cursor: 'pointer', fontSize: 15, color: 'var(--k3)', display: 'grid', placeItems: 'center' }}>›</button>
        </div>
      </div>

      {/* Calendar grid */}
      <div className="card" style={{ margin: '0 16px', padding: '10px 10px 8px' }}>
        {/* Day names header */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', marginBottom: 3 }}>
          {DIAS_SEM.map(d => <div key={d} style={{ textAlign: 'center', fontSize: 11, fontWeight: 600, color: 'var(--k4)', padding: '2px 0', letterSpacing: '.04em' }}>{d}</div>)}
        </div>
        {/* Day cells */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,minmax(0,1fr))', gap: 2 }}>
          {celdas.map((dia, i) => {
            const isHoy = dia === hoyDay;
            const isSel = dia !== null && dia === selDay;
            const evts = dia ? tasksByDay[dia] : null;
            return (
              <div key={i} onClick={() => dia && setSelDay(isSel ? null : dia)}
                style={{
                  aspectRatio: '1', borderRadius: 7,
                  display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-start',
                  paddingTop: 6, fontSize: 13, fontWeight: isHoy ? 700 : 400,
                  background: isHoy ? 'linear-gradient(125deg,#0e6e72,#1654b0,#2638b8,#3a26a0)' : isSel ? 'var(--p2)' : 'transparent',
                  border: isSel && !isHoy ? '1.5px solid #1654b0' : '1.5px solid transparent',
                  color: isHoy ? 'white' : dia ? 'var(--k)' : 'transparent',
                  cursor: dia ? 'pointer' : 'default', transition: 'background .12s',
                }}>
                {dia || '.'}
                {evts && evts.length > 0 && (
                  <div style={{ display: 'flex', gap: 2, marginTop: 1, flexWrap: 'wrap', justifyContent: 'center' }}>
                    {evts.slice(0, 3).map((ev, j) => (
                      <div key={j} style={{ width: 3, height: 3, borderRadius: '50%', background: isHoy ? 'rgba(255,255,255,.8)' : ev.completed ? 'var(--k4)' : ev.c }} />
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* Task list header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '16px 16px 8px' }}>
        <span style={{ fontSize: 12, fontWeight: 600, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--k4)' }}>
          {selDay ? `${selDay} de ${MESES[mes]}` : 'Todas las tareas'}
        </span>
        <button onClick={() => setShowAdd(true)} style={{ padding: '6px 12px', borderRadius: 6, border: 'none', background: 'var(--brand1)', color: '#fff', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>+ Añadir</button>
      </div>

      {/* Active tasks */}
      <div className="card" style={{ margin: '0 16px', padding: '0 14px' }}>
        {activeEvts.length === 0 ? (
          <div style={{ padding: '18px 0', textAlign: 'center', color: 'var(--k3)', fontSize: 13 }}>
            {selDay ? 'Sin tareas este día' : 'Sin tareas pendientes'}
          </div>
        ) : activeEvts.map((ev, i) => (
          <div key={ev.id}>
            {i > 0 && <div style={{ height: 1, background: 'var(--ls)' }} />}
            <div style={{ display: 'grid', gridTemplateColumns: '16px 3px 1fr auto', gap: 10, padding: '10px 0', alignItems: 'center' }}>
              <button onClick={() => toggleComplete(ev.id)}
                style={{ width: 15, height: 15, borderRadius: '50%', border: '1.5px solid var(--k4)', background: 'transparent', cursor: 'pointer', display: 'grid', placeItems: 'center', flexShrink: 0 }} />
              <div style={{ height: 24, borderRadius: 2, background: `linear-gradient(135deg, ${ev.c}cc, ${ev.c}77)` }} />
              <div style={{ minWidth: 0 }}>
                <p style={{ fontSize: 13, fontWeight: 500, color: 'var(--k)' }}>{ev.title}</p>
                <p style={{ fontSize: 11, color: 'var(--k3)', marginTop: 1 }}>{ev.rName}{ev.type && ev.type !== 'evaluacion' ? ` · ${ev.type}` : ''}</p>
              </div>
              <div style={{ textAlign: 'right' }}>
                <p style={{ fontSize: 12, fontWeight: 700, color: ev.d <= 3 ? 'var(--er)' : ev.d <= 7 ? 'var(--wn)' : 'var(--k3)' }}>{ev.fDate}</p>
                <p style={{ fontSize: 10, color: 'var(--k4)', marginTop: 1 }}>{ev.d >= 0 ? `en ${ev.d}d` : `hace ${-ev.d}d`}</p>
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* Completed tasks toggle */}
      {pastEvts.length > 0 && (
        <div style={{ padding: '10px 16px 0' }}>
          <button onClick={() => setShowPast(p => !p)} style={{ fontSize: 12, color: 'var(--k3)', background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'inherit', display: 'flex', alignItems: 'center', gap: 6 }}>
            <span style={{ transform: showPast ? 'rotate(90deg)' : 'none', transition: 'transform .15s', fontSize: 12 }}>›</span>
            {pastEvts.length} completada{pastEvts.length !== 1 ? 's' : ''}
          </button>
          {showPast && (
            <div className="card" style={{ marginTop: 8, padding: '0 14px' }}>
              {pastEvts.map((ev, i) => (
                <div key={ev.id}>
                  {i > 0 && <div style={{ height: 1, background: 'var(--ls)' }} />}
                  <div style={{ display: 'grid', gridTemplateColumns: '16px 3px 1fr auto', gap: 10, padding: '10px 0', alignItems: 'center', opacity: .45 }}>
                    <button onClick={() => toggleComplete(ev.id)}
                      style={{ width: 15, height: 15, borderRadius: '50%', border: 'none', background: 'var(--ok)', cursor: 'pointer', display: 'grid', placeItems: 'center', flexShrink: 0 }}>
                      <svg width={8} height={8} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </button>
                    <div style={{ height: 20, borderRadius: 2, background: `linear-gradient(135deg, ${ev.c}cc, ${ev.c}77)` }} />
                    <div style={{ minWidth: 0 }}>
                      <p style={{ fontSize: 13, fontWeight: 500, color: 'var(--k)', textDecoration: 'line-through' }}>{ev.title}</p>
                      <p style={{ fontSize: 11, color: 'var(--k3)', marginTop: 1 }}>{ev.rName}</p>
                    </div>
                    <span style={{ fontSize: 12, color: 'var(--k4)' }}>{ev.fDate}</span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Add task sheet */}
      {showAdd && <AddTaskSheet ramos={ramos} onAdd={(t) => { setTasks(prev => [...prev, { ...t, id: 't' + Date.now(), completed: false }]); setShowAdd(false); }} onClose={() => setShowAdd(false)} />}
    </div>
  );
}

/* ─────────────────────────────────────────────

              style={{ padding: '12px 14px', cursor: 'pointer', background: 'transparent', border: 'none', width: '100%', textAlign: 'left', fontFamily: 'inherit' }}>

                      {ramo?.name || ''}{block.msgs != null ? ' · ' + block.msgs + ' msgs' : ''}{block.ts ? ' · ' + block.ts : ''}{block.f ? ' · ' + block.f : ''}
                    </span>
                  </div>
                </div>
                <span style={{ color: 'var(--k4)', fontSize: 13, marginTop: 2 }}>›</span>
              </div>
            </button>
          </div>
        );
      })}
    </div>
  );
}

/* ── Ejercicio chat detail (with sources like Aprender) ── */
function EjercicioChat({ block, ramos, cuaderno }) {
  const [msgs, setMsgs] = useState([]);
  const [inp, setInp] = useState('');

  // Load chats on mount
  useEffect(() => {
    if (_devMode || !supabaseClient) { setMsgs(block.chats || []); return; }
    supabaseClient.from('ejercicios_chats')
      .select('role,content,created_at')
      .eq('block_id', block.id)
      .order('created_at')
      .then(({ data }) => { setMsgs((data || []).map(m => ({ role: m.role === 'assistant' ? 'ai' : m.role, text: m.content }))); });
  }, [block.id]);
  const [streaming, setStreaming] = useState(false);
  const [showSrc, setShowSrc] = useState(false);
  const [srcMode, setSrcMode] = useState('arch');
  const [actSrc, setActSrc] = useState([]);
  const [blockFiles, setBlockFiles] = useState([]);
  const scrollRef = useRef(null);
  const fileRef = useRef(null);
  const ramo = ramos.find(r => r.id === cuaderno.ramo_id);
  const c = ramo?.color || '#e67e22';
  const archRamo = ramo?.archivos || [];
  const togSrc = s => setActSrc(prev => prev.includes(s) ? prev.filter(x => x !== s) : [...prev, s]);

  useEffect(() => { scrollRef.current?.scrollTo(0, scrollRef.current.scrollHeight); }, [msgs]);

  const handleUpload = (e) => { Array.from(e.target.files || []).forEach(f => { setBlockFiles(prev => [...prev, { id: 'bf' + Date.now(), name: f.name }]); setActSrc(prev => [...prev, f.name]); }); e.target.value = ''; };

  const [streamBuf, setStreamBuf] = useState('');

  const send = () => {
    if (!inp.trim() || streaming) return;
    const userText = inp.trim();
    const srcs = actSrc.length > 0 ? [...actSrc] : undefined;
    setMsgs(prev => [...prev, { role: 'user', text: userText }]); setInp(''); setStreaming(true); setStreamBuf('');

    const apiMsgs = [...msgs, { role: 'user', text: userText }].map(m => ({ role: m.role === 'ai' ? 'assistant' : m.role, content: m.text }));
    const apiSources = (srcs || []).map(s => {
      const file = archRamo.find(f => f.name === s);
      return { title: s, storageUrl: file?.storage_path ? `${SUPABASE_URL}/storage/v1/object/authenticated/ramo-files/${file.storage_path}` : undefined };
    });

    if (_devMode) {
      setTimeout(() => { setMsgs(prev => [...prev, { role: 'ai', text: 'Ejercicios simulados (modo dev).', srcs }]); setStreaming(false); setStreamBuf(''); }, 800);
      return;
    }

    streamChat('/api/ejercicios-chat', { sources: apiSources, messages: apiMsgs, conPauta: !!block.conPauta }, {
      onChunk: (full) => setStreamBuf(full),
      onDone: (full) => {
        setStreamBuf(''); setMsgs(prev => [...prev, { role: 'ai', text: full, srcs }]); setStreaming(false);
        dbInsert('ejercicios_chats', { block_id: block.id, role: 'user', content: userText, sources: [] });
        dbInsert('ejercicios_chats', { block_id: block.id, role: 'assistant', content: full, sources: srcs ? srcs.map(s => ({ title: s })) : [] });
      },
      onError: (err) => { console.error(err); setMsgs(prev => [...prev, { role: 'ai', text: 'Error al generar ejercicios.' }]); setStreaming(false); setStreamBuf(''); },
    });
  };

  const IcoFile = () => <svg width={11} height={11} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', position: 'relative' }}>
      {/* Sources panel */}
      {showSrc && (
        <div style={{ background: 'var(--w)', borderBottom: '1px solid var(--ln)', padding: '12px 16px', flexShrink: 0 }}>
          <div style={{ display: 'flex', padding: 2, borderRadius: 7, background: 'var(--p2)', marginBottom: 12 }}>
            {[{ v: 'arch', l: 'Archivos' }, { v: 'bib', l: 'Biblioteca' }].map(o => (
              <button key={o.v} onClick={() => setSrcMode(o.v)} style={{ flex: 1, border: 0, background: srcMode === o.v ? 'var(--w)' : 'transparent', fontWeight: 500, fontSize: 12, padding: '7px 6px', cursor: 'pointer', borderRadius: 5, color: srcMode === o.v ? 'var(--k)' : 'var(--k3)', fontFamily: 'inherit', boxShadow: srcMode === o.v ? '0 1px 3px rgba(0,0,0,.12)' : 'none' }}>{o.l}</button>
            ))}
          </div>
          {srcMode === 'arch' && (
            <div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 7, marginBottom: 10 }}>
                {archRamo.map(a => (
                  <button key={a.id} onClick={() => togSrc(a.name)} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '3px 10px', borderRadius: 6, border: `1px solid ${actSrc.includes(a.name) ? '#1654b0' : 'var(--ln)'}`, background: actSrc.includes(a.name) ? 'rgba(22,84,176,.09)' : 'var(--p)', fontSize: 12, fontWeight: 500, color: actSrc.includes(a.name) ? '#1654b0' : 'var(--k3)', cursor: 'pointer', fontFamily: 'inherit' }}>
                    <IcoFile />{a.name}{actSrc.includes(a.name) && <span style={{ color: '#1654b0', fontSize: 11 }}>✓</span>}
                  </button>
                ))}
                {archRamo.length === 0 && <p style={{ fontSize: 12, color: 'var(--k4)' }}>Sin archivos en este ramo</p>}
              </div>
              {blockFiles.length > 0 && blockFiles.map(f => (
                <div key={f.id} style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '3px 10px', borderRadius: 6, border: '1px solid var(--ln)', background: 'var(--p2)', fontSize: 12, fontWeight: 500, color: 'var(--k)', marginBottom: 3 }}>
                  <IcoFile /><span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.name}</span>
                  <button onClick={() => { setBlockFiles(prev => prev.filter(x => x.id !== f.id)); setActSrc(prev => prev.filter(x => x !== f.name)); }} style={{ border: 'none', background: 'none', cursor: 'pointer', color: 'var(--k4)', padding: 0, fontSize: 15 }}>×</button>
                </div>
              ))}
              <button onClick={() => fileRef.current?.click()} style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, fontWeight: 500, color: '#1654b0', border: '1px dashed rgba(22,84,176,.3)', background: 'transparent', padding: '6px 12px', borderRadius: 6, cursor: 'pointer', fontFamily: 'inherit' }}>
                <svg width={10} height={10} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Subir archivo
              </button>
              <input ref={fileRef} type="file" multiple style={{ display: 'none' }} onChange={handleUpload} />
            </div>
          )}
          {srcMode === 'bib' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
              {ramos.flatMap(r => (r.archivos || []).map(a => ({ ...a, rn: r.name, rc: r.color }))).map(a => (
                <button key={a.id} onClick={() => togSrc(a.name)} style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '7px 12px', borderRadius: 6, border: `1px solid ${actSrc.includes(a.name) ? '#1654b0' : 'transparent'}`, background: actSrc.includes(a.name) ? 'rgba(22,84,176,.07)' : 'var(--p)', fontSize: 12, cursor: 'pointer', textAlign: 'left', color: 'var(--k)', fontFamily: 'inherit', width: '100%' }}>
                  <div style={{ width: 8, height: 8, borderRadius: 2, background: ramoGrad(a.rc || '#1654b0'), flexShrink: 0 }} />
                  <span style={{ flex: 1, fontWeight: 500 }}>{a.name}</span>
                  <span style={{ fontSize: 11, color: 'var(--k4)' }}>{a.rn}</span>
                  {actSrc.includes(a.name) && <span style={{ color: '#1654b0', fontSize: 11 }}>✓</span>}
                </button>
              ))}
            </div>
          )}
        </div>
      )}

      <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto', padding: '12px 16px 80px', background: 'var(--p)' }}>
        {msgs.length === 0 ? (
          <div style={{ textAlign: 'center', marginTop: 40 }}>
            <div style={{ width: 32, height: 32, borderRadius: 8, background: ramoGrad(c), margin: '0 auto 12px', display: 'grid', placeItems: 'center', fontSize: 16 }}>⚡</div>
            <p style={{ fontSize: 14, fontWeight: 600, marginBottom: 3 }}>{block.t}</p>
            <p style={{ fontSize: 13, color: 'var(--k3)' }}>{block.tipo} · {ramo?.name || ''}</p>
          </div>
        ) : msgs.map((msg, i) => (
          <div key={i} style={{ marginTop: i > 0 ? 8 : 0 }}>
            {msg.role === 'user' ? <div style={{ maxWidth: '80%', padding: '10px 14px', borderRadius: 14, borderBottomRightRadius: 4, background: 'var(--p2)', color: '#fff', marginLeft: 'auto', fontSize: 14, lineHeight: 1.4 }}>{msg.text}</div>
            : <div style={{ fontSize: 14, lineHeight: 1.45, color: 'var(--k)' }}>
                <ChatMsg text={msg.text} />
                {msg.srcs && msg.srcs.length > 0 && (
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginTop: 8 }}>
                    {msg.srcs.map((s, j) => <span key={j} style={{ display: 'inline-flex', alignItems: 'center', gap: 3, padding: '2px 7px', borderRadius: 5, background: 'var(--p2)', fontSize: 11, color: 'var(--k3)', fontWeight: 500 }}><IcoFile />{s}</span>)}
                  </div>
                )}
              </div>}
          </div>
        ))}
        {streaming && (
          streamBuf ? (
            <div style={{ marginTop: 10, fontSize: 14, lineHeight: 1.45, color: 'var(--k)' }}>
              <ChatMsg text={streamBuf} />
              <span style={{ display: 'inline-block', width: 7, height: 12, background: 'var(--k)', borderRadius: 2, marginLeft: 2, animation: 'blink 1s step-end infinite', verticalAlign: 'text-bottom' }} />
            </div>
          ) : (
            <div style={{ marginTop: 12, padding: '10px 14px', borderRadius: 10, background: 'var(--p2)', display: 'inline-flex', gap: 7, fontSize: 13, color: 'var(--k4)' }}>Generando...</div>
          )
        )}
      </div>
      <div style={{ position: 'absolute', bottom: 10, left: 13, right: 13, background: 'var(--w)', border: '1px solid var(--ln)', borderRadius: 14, padding: '8px 10px', display: 'flex', alignItems: 'center', gap: 8, boxShadow: '0 4px 20px -6px rgba(0,0,0,.12)' }}>
        <button onClick={() => { setShowSrc(s => !s); setSrcMode('arch'); }}
          style={{ width: 26, height: 26, borderRadius: 7, border: '1px solid var(--ln)', background: showSrc ? 'var(--p2)' : 'var(--p)', cursor: 'pointer', display: 'grid', placeItems: 'center', color: 'var(--k3)', flexShrink: 0 }}>
          <svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        {actSrc.length > 0 && <span style={{ background: c, color: '#fff', borderRadius: '50%', width: 16, height: 16, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, fontWeight: 700, flexShrink: 0 }}>{actSrc.length}</span>}
        <input value={inp} onChange={e => setInp(e.target.value)} placeholder="Pide ejercicios..." onKeyDown={e => e.key === 'Enter' && send()} style={{ flex: 1, border: 'none', outline: 'none', fontSize: 14, background: 'transparent', color: 'var(--k)', fontFamily: 'inherit' }} />
        <button onClick={send} disabled={streaming || !inp.trim()} style={{ width: 26, height: 26, borderRadius: '50%', background: streaming || !inp.trim() ? 'var(--p2)' : 'linear-gradient(125deg,#1654b0,#3a26a0)', border: 'none', display: 'grid', placeItems: 'center', cursor: streaming ? 'default' : 'pointer', flexShrink: 0 }}>
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" style={{ width: 14, height: 14 }}><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4z"/></svg>
        </button>
      </div>
    </div>
  );
}
