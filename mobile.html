function TrabajoDetail({ block, ramos, cuaderno }) {
  const ramo = ramos.find(r => r.id === cuaderno.ramo_id);
  const tipoLabel = { pdf: 'PDF', docx: 'Word', pptx: 'PowerPoint' }[block.tipo] || block.tipo;
  const [generating, setGenerating] = useState(false);
  const [streamBuf, setStreamBuf] = useState('');
  const [content, setContent] = useState(block.content || '');
  const [estado, setEstado] = useState(block.estado || (block.content ? 'listo' : 'generando'));

  const generate = () => {
    if (generating) return;
    setGenerating(true); setStreamBuf('');
    if (_devMode) {
      setTimeout(() => {
        const fake = '<h2>Contenido generado (modo dev)</h2><p>Este es un documento de ejemplo generado en modo desarrollo.</p>';
        setContent(fake); setEstado('listo'); setGenerating(false);
      }, 1200);
      return;
    }
    streamChat('/api/trabajos-generate', {
      titulo: block.t,
      tipo: block.tipo,
      plantilla: block.plantilla || 'libre',
      instruccionesTexto: block.instrucciones || '',
    }, {
      onChunk: (full) => setStreamBuf(full),
      onDone: (full) => {
        setStreamBuf(''); setContent(full); setEstado('listo'); setGenerating(false);
        dbUpdate('trabajos', { content_html: full, estado: 'listo' }, { id: block.id });
      },
      onError: (err) => {
        console.error('Trabajos generate error:', err);
        setStreamBuf(''); setGenerating(false);
      },
    });
  };

  const needsGeneration = !content && estado === 'generando';
  const displayHtml = generating ? streamBuf : content;

  return (
    <div style={{ padding: '14px 16px 20px' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
        <div style={{ width: 18, height: 24, borderRadius: 5, background: ramoGrad(ramo?.color || '#8e44ad'), flexShrink: 0 }} />
        <div style={{ flex: 1 }}>
          <p style={{ fontSize: 15, fontWeight: 600 }}>{block.t}</p>
          <p style={{ fontSize: 12, color: 'var(--k3)', marginTop: 1 }}>{ramo?.name || ''} · {tipoLabel}</p>
        </div>
        <span style={{ fontSize: 11, padding: '2px 8px', borderRadius: 4, background: 'var(--p2)', color: 'var(--k4)', fontWeight: 600 }}>{(block.tipo || '').toUpperCase()}</span>
      </div>
      {needsGeneration && !generating ? (
        <div style={{ textAlign: 'center', padding: '32px 18px' }}>
          <p style={{ fontSize: 14, color: 'var(--k3)', marginBottom: 14 }}>Este trabajo aún no ha sido generado.</p>
          <button className="btn btn-pri" onClick={generate}>Generar</button>
        </div>
      ) : (
        <div className="card" style={{ padding: '18px 16px', fontSize: 14, lineHeight: 1.65, color: 'var(--k)' }}
          dangerouslySetInnerHTML={{ __html: displayHtml || '<p style="color:var(--k3);text-align:center">Sin contenido generado</p>' }} />
      )}
      {generating && !streamBuf && (
        <div style={{ textAlign: 'center', padding: 18 }}>
          <div className="skeleton" style={{ width: '60%', height: 12, margin: '0 auto 10px', borderRadius: 6 }} />
          <div className="skeleton" style={{ width: '80%', height: 12, margin: '0 auto 10px', borderRadius: 6 }} />
          <div className="skeleton" style={{ width: '40%', height: 12, margin: '0 auto', borderRadius: 6 }} />
        </div>
      )}
    </div>
  );
}

/* ── Apunte editor — iOS Notes style ── */
const APUNTE_COLORS = ['var(--k)', '#1654b0', '#b00d6e', '#0e6e72', '#b25e09', '#8b5cf6', '#d70015'];
const APUNTE_COLOR_NAMES = ['Negro', 'Azul', 'Rosa', 'Verde', 'Naranja', 'Morado', 'Rojo'];

function ApunteDetail({ block, ramos, cuaderno }) {
  const [blocks, setBlocks] = useState(block.blocks || []);
  const [titulo, setTitulo] = useState(block.t);
  const [collapsed, setCollapsed] = useState({});
  const [selColor, setSelColor] = useState('var(--k)');
  const [showColors, setShowColors] = useState(false);
  const ramo = ramos.find(r => r.id === cuaderno.ramo_id);

  const saveTimerRef = useRef(null);
  const debouncedSave = (newBlocks, newTitulo) => {
    if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current = setTimeout(() => {
      if (!_devMode) {
        dbUpdate('apuntes', { blocks: newBlocks, titulo: newTitulo }, { id: block.id });
      }
    }, 1000);
  };

  const updateBlock = (id, text) => {
    setBlocks(prev => {
      const next = prev.map(b => b.id === id ? { ...b, text } : b);
      debouncedSave(next, titulo);
      return next;
    });
  };
  const addBlock = (type) => {
    setBlocks(prev => {
      const next = [...prev, { id: Date.now(), type, text: '', color: selColor }];
      debouncedSave(next, titulo);
      return next;
    });
  };
  const toggleCollapse = (id) => setCollapsed(p => ({ ...p, [id]: !p[id] }));

  const HST = {
    h1: { fontSize: 19, fontWeight: 700, marginTop: 14 },
    h2: { fontSize: 16, fontWeight: 600, marginTop: 12 },
    h3: { fontSize: 14, fontWeight: 600, marginTop: 10 },
  };

  // Compute visible blocks (collapse logic)
  const getVisible = () => {
    const vis = [];
    let skipLevel = null;
    const hLevel = { h1: 1, h2: 2, h3: 3 };
    for (const b of blocks) {
      const lvl = hLevel[b.type];
      if (skipLevel !== null) {
        if (lvl && lvl <= skipLevel) skipLevel = null;
        else { vis.push({ ...b, hidden: true }); continue; }
      }
      vis.push({ ...b, hidden: false });
      if (lvl && collapsed[b.id]) skipLevel = lvl;
    }
    return vis;
  };

  const visible = getVisible();

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      {/* Toolbar */}
      <div style={{ padding: '7px 16px', borderBottom: '1px solid var(--ln)', background: 'var(--w)', display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0, flexWrap: 'wrap' }}>
        <input value={titulo} onChange={e => { setTitulo(e.target.value); debouncedSave(blocks, e.target.value); }}
          style={{ fontSize: 14, fontWeight: 600, border: 'none', outline: 'none', background: 'transparent', color: 'var(--k)', flex: 1, minWidth: 80, fontFamily: 'inherit' }} />
        {ramo && <span style={{ fontSize: 11, color: ramo.color, fontWeight: 500 }}>{ramo.name}</span>}
      </div>

      {/* Block type buttons + color picker */}
      <div style={{ padding: '7px 16px', borderBottom: '1px solid var(--ls)', background: 'var(--w)', display: 'flex', alignItems: 'center', gap: 7, flexShrink: 0, position: 'relative' }}>
        {[{ t: 'h1', l: 'H1' }, { t: 'h2', l: 'H2' }, { t: 'h3', l: 'H3' }, { t: 'p', l: 'T' }, { t: 'bullet', l: '•' }].map(bt => (
          <button key={bt.t} onClick={() => addBlock(bt.t)}
            style={{ fontSize: 12, fontWeight: 600, padding: '2px 7px', borderRadius: 5, border: '1px solid var(--ln)', background: 'var(--p)', cursor: 'pointer', color: 'var(--k3)', fontFamily: 'inherit' }}>
            {bt.l}
          </button>
        ))}
        <div style={{ flex: 1 }} />
        {/* Color button */}
        <button onClick={() => setShowColors(s => !s)}
          style={{ width: 18, height: 18, borderRadius: '50%', border: '2px solid var(--ln)', background: selColor, cursor: 'pointer', flexShrink: 0 }} />
        {/* Color picker popup */}
        {showColors && (
          <div style={{ position: 'absolute', top: 28, right: 13, zIndex: 99, background: 'var(--w)', border: '1px solid var(--ln)', borderRadius: 8, padding: 8, display: 'flex', gap: 7, boxShadow: '0 6px 20px rgba(0,0,0,.14)' }}>
            {APUNTE_COLORS.map((c, i) => (
              <button key={c} onClick={() => { setSelColor(c); setShowColors(false); }} title={APUNTE_COLOR_NAMES[i]}
                style={{ width: 18, height: 18, borderRadius: '50%', border: selColor === c ? '2.5px solid #1654b0' : '2px solid transparent', background: c, cursor: 'pointer' }} />
            ))}
          </div>
        )}
      </div>

      {/* Content blocks */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '16px 16px' }}>
        {visible.map(b => {
          if (b.hidden) return null;
          const isH = b.type === 'h1' || b.type === 'h2' || b.type === 'h3';
          const isCollapsed = collapsed[b.id];

          if (b.type === 'bullet') {
            return (
              <div key={b.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 7, marginBottom: 3 }}>
                <span style={{ color: 'var(--k3)', marginTop: 2, fontSize: 13 }}>•</span>
                <div contentEditable suppressContentEditableWarning onBlur={e => updateBlock(b.id, e.target.innerText)}
                  style={{ outline: 'none', color: b.color || 'var(--k)', fontSize: 13, lineHeight: 1.55, flex: 1, wordBreak: 'break-word' }}>
                  {b.text}
                </div>
              </div>
            );
          }

          return (
            <div key={b.id} style={{ display: 'flex', alignItems: 'flex-start', gap: 6, marginBottom: 3, ...(HST[b.type] || {}) }}>
              {isH && (
                <button onClick={() => toggleCollapse(b.id)}
                  style={{ flexShrink: 0, width: 14, height: 14, marginTop: 2, border: 'none', background: 'transparent', cursor: 'pointer', color: 'var(--k4)', fontSize: 11, display: 'grid', placeItems: 'center', transform: isCollapsed ? 'none' : 'rotate(90deg)', transition: 'transform .15s' }}>
                  ›
                </button>
              )}
              <div contentEditable suppressContentEditableWarning onBlur={e => updateBlock(b.id, e.target.innerText)}
                style={{ outline: 'none', color: b.color || 'var(--k)', wordBreak: 'break-word', fontSize: HST[b.type]?.fontSize || 11, fontWeight: HST[b.type]?.fontWeight || 400, lineHeight: 1.55, flex: 1 }}>
                {b.text}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   TOOL: BIBLIOTECA — iOS Files style
───────────────────────────────────────────── */
const FILE_ICONS = {
  pdf: { bg: '#e74c3c', label: 'PDF' },
  docx: { bg: '#2980b9', label: 'DOCX' },
  pptx: { bg: '#e67e22', label: 'PPTX' },
  xlsx: { bg: '#27ae60', label: 'XLSX' },
  txt: { bg: '#95a5a6', label: 'TXT' },
};
function fileExt(name) { return (name || '').split('.').pop().toLowerCase(); }

function ToolBiblioteca({ push, ramos }) {
  const ramosWithFiles = ramos.filter(r => (r.archivos || []).length > 0);
  const totalFiles = ramos.reduce((s, r) => s + (r.archivos || []).length, 0);

  return (
    <div style={{ padding: '0 0 20px' }}>
      <div className="sec-header" style={{ paddingTop: 14 }}>
        <h2>{totalFiles} archivo{totalFiles !== 1 ? 's' : ''}</h2>
      </div>

      {/* Ramo folders — grid like iOS Files */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, margin: '0 16px' }}>
        {ramosWithFiles.map(r => {
          const c = r.color || '#1654b0';
          const count = (r.archivos || []).length;
          return (
            <button key={r.id} onClick={() => push('biblioteca-ramo', { ramoId: r.id, title: r.name })} className="card"
              style={{ padding: '16px 14px', cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left', display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div style={{ width: 32, height: 32, borderRadius: 8, background: ramoGrad(c), display: 'grid', placeItems: 'center' }}>
                <svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              </div>
              <div>
                <p style={{ fontSize: 13, fontWeight: 600, color: 'var(--k)' }}>{r.name}</p>
                <p style={{ fontSize: 11, color: 'var(--k4)', marginTop: 1 }}>{count} archivo{count !== 1 ? 's' : ''}</p>
              </div>
            </button>
          );
        })}
      </div>

      {ramosWithFiles.length === 0 && (
        <div style={{ padding: '40px 20px', textAlign: 'center', color: 'var(--k3)', fontSize: 13 }}>
          Sin archivos — importa material desde tus ramos
        </div>
      )}
    </div>
  );
}

/* Biblioteca inside a ramo — file list with collapsable folders */
function BibliotecaRamo({ ramo, updateRamo }) {
  const [openFolders, setOpenFolders] = useState({});
  const [editingFolder, setEditingFolder] = useState(null);
  const [editFolderName, setEditFolderName] = useState('');
  const [addingFolder, setAddingFolder] = useState(false);
  const [newFolderName, setNewFolderName] = useState('');
  const [confirmDeleteFolder, setConfirmDeleteFolder] = useState(null);
  const [confirmDeleteFile, setConfirmDeleteFile] = useState(null);
  const [uploading, setUploading] = useState(false);
  const archivos = ramo.archivos || [];
  const c = ramo.color || '#1654b0';
  const temario = ramo.temario || [];

  // Group: programa files, folder files (from temario), loose files
  const programaFiles = archivos.filter(f => f.programa);
  const folderFileIds = new Set(temario.flatMap(u => u.archivos || []));
  const looseFiles = archivos.filter(f => !f.programa && !folderFileIds.has(f.id));

  const toggleFolder = (id) => setOpenFolders(p => ({ ...p, [id]: !p[id] }));

  const startEditFolder = (e, unit) => {
    e.stopPropagation();
    setEditingFolder(unit.id);
    setEditFolderName(unit.titulo);
    setConfirmDeleteFolder(null);
  };
  const saveEditFolder = (uid) => {
    if (!editFolderName.trim()) return;
    updateRamo(ramo.id, r => ({ ...r, temario: r.temario.map(u => u.id === uid ? { ...u, titulo: editFolderName.trim() } : u) }));
    setEditingFolder(null);
  };
  const startDeleteFolder = (e, uid) => {
    e.stopPropagation();
    setConfirmDeleteFolder(uid);
    setEditingFolder(null);
  };
  const confirmDelete = (uid) => {
    updateRamo(ramo.id, r => ({ ...r, temario: r.temario.filter(u => u.id !== uid) }));
    setConfirmDeleteFolder(null);
  };
  const submitNewFolder = () => {
    if (!newFolderName.trim()) return;
    updateRamo(ramo.id, r => ({ ...r, temario: [...(r.temario || []), { id: 'u' + Date.now(), titulo: newFolderName.trim(), archivos: [] }] }));
    setNewFolderName('');
    setAddingFolder(false);
  };

  const uploadFile = () => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.pdf,.docx,.pptx,.xlsx,.txt,.png,.jpg'; input.multiple = true;
    input.onchange = async (ev) => {
      const files = Array.from(ev.target.files || []);
      if (!files.length) return;
      setUploading(true);
      for (const file of files) {
        const localId = 'f' + Date.now() + Math.random().toString(36).slice(2, 5);
        const newFile = { id: localId, name: file.name, date: new Date().toISOString().slice(0, 10), programa: false };
        updateRamo(ramo.id, r => ({ ...r, archivos: [...r.archivos, newFile] }));
        if (supabaseClient && !_devMode && _userId) {
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          const path = `${_userId}/${ramo.id}/${Date.now()}_${safeName}`;
          const { error } = await supabaseClient.storage.from('ramo-files').upload(path, file, { upsert: true });
          if (!error) {
            const { data } = await dbInsert('ramo_files', { ramo_id: ramo.id, name: file.name, size: file.size, storage_path: path, is_programa: false });
            if (data) updateRamo(ramo.id, r => ({ ...r, archivos: r.archivos.map(f => f.id === localId ? { ...f, id: data.id, storage_path: path } : f) }));
          }
        }
      }
      setUploading(false);
    };
    input.click();
  };
  const deleteFile = async (fid) => {
    const file = archivos.find(f => f.id === fid);
    updateRamo(ramo.id, r => ({
      ...r,
      archivos: r.archivos.filter(f => f.id !== fid),
      temario: r.temario.map(u => ({ ...u, archivos: u.archivos.filter(x => x !== fid) }))
    }));
    if (supabaseClient && !_devMode && file) {
      if (file.storage_path) await supabaseClient.storage.from('ramo-files').remove([file.storage_path]);
      dbDelete('ramo_files', { id: fid });
    }
    setConfirmDeleteFile(null);
  };

  const FileRow = ({ f }) => {
    const ext = fileExt(f.name);
    const fi = FILE_ICONS[ext] || { bg: 'var(--k4)', label: ext.toUpperCase() };
    return (
      <div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 14px' }}>
          <div style={{ width: 24, height: 36, borderRadius: 5, background: fi.bg + '18', border: `1px solid ${fi.bg}33`, display: 'grid', placeItems: 'center', flexShrink: 0 }}>
            <span style={{ fontSize: 10, fontWeight: 700, color: fi.bg }}>{fi.label}</span>
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <p style={{ fontSize: 13, fontWeight: 500, color: 'var(--k)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{f.name}</p>
            <p style={{ fontSize: 11, color: 'var(--k4)', marginTop: 1 }}>{f.date || ''}</p>
          </div>
          {f.programa && <span style={{ fontSize: 10, color: 'var(--wn)', fontWeight: 600 }}>★ Programa</span>}
          {updateRamo && (
            <button onClick={() => setConfirmDeleteFile(confirmDeleteFile === f.id ? null : f.id)} style={{ width: 36, height: 36, borderRadius: 7, border: 'none', background: 'transparent', cursor: 'pointer', display: 'grid', placeItems: 'center', color: 'var(--k4)', flexShrink: 0 }}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>
            </button>
          )}
        </div>
        {confirmDeleteFile === f.id && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 14px 10px', background: 'rgba(220,38,38,.04)' }}>
            <span style={{ fontSize: 12, color: 'var(--er)', fontWeight: 500, flex: 1 }}>¿Eliminar?</span>
            <button onClick={() => deleteFile(f.id)} style={{ padding: '6px 12px', borderRadius: 6, border: 'none', background: 'var(--er)', color: '#fff', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Confirmar</button>
            <button onClick={() => setConfirmDeleteFile(null)} style={{ padding: '6px 12px', borderRadius: 6, border: '1px solid var(--ln)', background: 'var(--p)', color: 'var(--k3)', fontSize: 12, cursor: 'pointer' }}>Cancelar</button>
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{ padding: '0 0 20px' }}>
      <div style={{ padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 10, borderBottom: '1px solid var(--ls)' }}>
        <div style={{ width: 18, height: 24, borderRadius: 5, background: ramoGrad(c), flexShrink: 0 }} />
        <div style={{ flex: 1 }}>
          <p style={{ fontSize: 14, fontWeight: 600 }}>{ramo.name}</p>
          <p style={{ fontSize: 11, color: 'var(--k3)' }}>{ramo.codigo} · {archivos.length} archivo{archivos.length !== 1 ? 's' : ''}</p>
        </div>
        <div style={{ display: 'flex', gap: 6 }}>
          {updateRamo && (
            <button onClick={uploadFile} disabled={uploading} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '8px 12px', minHeight: 44, background: 'transparent', color: 'var(--brand1)', border: '1px solid var(--brand1)', borderRadius: 8, fontSize: 12, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit', opacity: uploading ? .5 : 1 }}>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              {uploading ? 'Subiendo...' : 'Subir'}
            </button>
          )}
          {updateRamo && (
            <button onClick={() => { setAddingFolder(true); setNewFolderName(''); }} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '8px 12px', minHeight: 44, background: 'var(--brand1)', color: '#fff', border: 'none', borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>
              <span style={{ fontSize: 16, lineHeight: 1 }}>+</span> Carpeta
            </button>
          )}
        </div>
      </div>

      {/* Nueva carpeta — inline form */}
      {addingFolder && (
        <div style={{ margin: '12px 16px', padding: '12px 14px', background: 'var(--p)', border: '1px solid var(--ls)', borderRadius: 10, display: 'flex', gap: 8, alignItems: 'center' }}>
          <span style={{ fontSize: 16 }}>📁</span>
          <input
            autoFocus
            value={newFolderName}
            onChange={e => setNewFolderName(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') submitNewFolder(); if (e.key === 'Escape') setAddingFolder(false); }}
            placeholder="Nombre de la carpeta"
            style={{ flex: 1, border: 'none', outline: 'none', fontSize: 13, fontWeight: 500, background: 'transparent', color: 'var(--k)', fontFamily: 'inherit' }}
          />
          <button onClick={submitNewFolder} style={{ padding: '6px 12px', minHeight: 36, background: 'var(--brand1)', color: '#fff', border: 'none', borderRadius: 7, fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>Crear</button>
          <button onClick={() => setAddingFolder(false)} style={{ padding: '6px 10px', minHeight: 36, background: 'var(--k4)22', color: 'var(--k3)', border: 'none', borderRadius: 7, fontSize: 12, cursor: 'pointer', fontFamily: 'inherit' }}>✕</button>
        </div>
      )}

      {/* Programa files */}
      {programaFiles.length > 0 && (
        <>
          <div className="sec-header"><h2>Programa</h2></div>
          <div className="card" style={{ margin: '0 16px' }}>
            {programaFiles.map((f, i) => (
              <div key={f.id}>
                {i > 0 && <div style={{ height: 1, background: 'var(--ls)', margin: '0 14px' }} />}
                <FileRow f={f} />
              </div>
            ))}
          </div>
        </>
      )}

      {/* Folders from temario */}
      {temario.length > 0 && (
        <>
          <div className="sec-header"><h2>Carpetas</h2></div>
          <div className="card" style={{ margin: '0 16px' }}>
            {temario.map((unit, i) => {
              const isOpen = openFolders[unit.id];
              const unitFiles = (unit.archivos || []).map(fid => archivos.find(f => f.id === fid)).filter(Boolean);
              return (
                <div key={unit.id}>
                  {i > 0 && <div style={{ height: 1, background: 'var(--ls)', margin: '0 14px' }} />}
                  {confirmDeleteFolder === unit.id ? (
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 14px', flexWrap: 'wrap' }}>
                      <span style={{ fontSize: 12, color: 'var(--k3)', flex: 1 }}>¿Eliminar carpeta "{unit.titulo}"?</span>
                      <button onClick={() => confirmDelete(unit.id)} style={{ padding: '6px 12px', minHeight: 36, background: 'var(--er)', color: '#fff', border: 'none', borderRadius: 7, fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>Confirmar</button>
                      <button onClick={() => setConfirmDeleteFolder(null)} style={{ padding: '6px 10px', minHeight: 36, background: 'var(--k4)22', color: 'var(--k3)', border: 'none', borderRadius: 7, fontSize: 12, cursor: 'pointer', fontFamily: 'inherit' }}>Cancelar</button>
                    </div>
                  ) : editingFolder === unit.id ? (
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '10px 14px' }}>
                      <span style={{ fontSize: 16 }}>📁</span>
                      <input
                        autoFocus
                        value={editFolderName}
                        onChange={e => setEditFolderName(e.target.value)}
                        onKeyDown={e => { if (e.key === 'Enter') saveEditFolder(unit.id); if (e.key === 'Escape') setEditingFolder(null); }}
                        style={{ flex: 1, border: 'none', borderBottom: '1px solid var(--brand1)', outline: 'none', fontSize: 13, fontWeight: 600, background: 'transparent', color: 'var(--k)', fontFamily: 'inherit', padding: '2px 0' }}
                      />
                      <button onClick={() => saveEditFolder(unit.id)} style={{ padding: '6px 12px', minHeight: 36, background: 'var(--brand1)', color: '#fff', border: 'none', borderRadius: 7, fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>Guardar</button>
                      <button onClick={() => setEditingFolder(null)} style={{ padding: '6px 10px', minHeight: 36, background: 'var(--k4)22', color: 'var(--k3)', border: 'none', borderRadius: 7, fontSize: 12, cursor: 'pointer', fontFamily: 'inherit' }}>✕</button>
                    </div>
                  ) : (
                  <div style={{ display: 'flex', alignItems: 'center' }}>
                    <button onClick={() => toggleFolder(unit.id)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 14px', flex: 1, background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left' }}>
                      <span style={{ fontSize: 16, flexShrink: 0 }}>📁</span>
                      <span style={{ flex: 1, fontSize: 13, fontWeight: 600, color: 'var(--k)' }}>{unit.titulo}</span>
                      <span style={{ fontSize: 11, color: 'var(--k4)' }}>{unitFiles.length}</span>
                      <span style={{ fontSize: 12, color: 'var(--k4)', transform: isOpen ? 'rotate(90deg)' : 'none', transition: 'transform .15s' }}>›</span>
                    </button>
                    {updateRamo && (
                      <div style={{ display: 'flex', gap: 0, paddingRight: 6 }}>
                        <button onClick={e => startEditFolder(e, unit)} style={{ width: 44, height: 44, display: 'grid', placeItems: 'center', background: 'none', border: 'none', cursor: 'pointer', fontSize: 14, color: 'var(--k3)', borderRadius: 8 }} title="Renombrar">✏️</button>
                        <button onClick={e => startDeleteFolder(e, unit.id)} style={{ width: 44, height: 44, display: 'grid', placeItems: 'center', background: 'none', border: 'none', cursor: 'pointer', fontSize: 14, color: 'var(--er)', borderRadius: 8 }} title="Eliminar">🗑</button>
                      </div>
                    )}
                  </div>
                  )}
                  {isOpen && unitFiles.length > 0 && (
                    <div style={{ background: 'var(--p)', borderTop: '1px solid var(--ls)', animation: 'fadeIn .15s ease' }}>
                      {unitFiles.map((f, j) => (
                        <div key={f.id}>
                          {j > 0 && <div style={{ height: 1, background: 'var(--ls)', margin: '0 14px' }} />}
                          <FileRow f={f} />
                        </div>
                      ))}
                    </div>
                  )}
                  {isOpen && unitFiles.length === 0 && (
                    <div style={{ padding: '10px 14px 12px', background: 'var(--p)', borderTop: '1px solid var(--ls)', fontSize: 12, color: 'var(--k4)' }}>Carpeta vacía</div>
                  )}
                </div>
              );
            })}
          </div>
        </>
      )}

      {/* Loose files */}
      {looseFiles.length > 0 && (
        <>
          <div className="sec-header"><h2>Archivos</h2></div>
          <div className="card" style={{ margin: '0 16px' }}>
            {looseFiles.map((f, i) => (
              <div key={f.id}>
                {i > 0 && <div style={{ height: 1, background: 'var(--ls)', margin: '0 14px' }} />}
                <FileRow f={f} />
              </div>
            ))}
          </div>
        </>
      )}

      {archivos.length === 0 && (
        <div style={{ padding: '40px 20px', textAlign: 'center', color: 'var(--k3)', fontSize: 13 }}>Sin archivos en este ramo</div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────
   MAIN APP — state owner
───────────────────────────────────────────── */
function MainApp({ profile, user, devMode, onLogout }) {
  const [tab, setTab] = useState('inicio');
  const [stack, setStack] = useState([]);
  const [dataLoading, setDataLoading] = useState(!devMode);

  // ── Editable state ──
  const [ramos, setRamos] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [schedule, setSchedule] = useState([]);
  const [cuadernos, setCuadernos] = useState([]);
  const [ejercicios, setEjercicios] = useState([]);
  const [trabajos, setTrabajos] = useState([]);
  const [apuntes, setApuntes] = useState([]);

  // ── Load data ──
  useEffect(() => {
    if (devMode) {
      setRamos(MOCK_RAMOS); setTasks(MOCK_TASKS); setSchedule(MOCK_SCHEDULE);
      setCuadernos(MOCK_CUADERNOS); setEjercicios(MOCK_EJERCICIOS);
      setTrabajos(MOCK_TRABAJOS); setApuntes(MOCK_APUNTES);
      setDataLoading(false);
      return;
    }
    if (!supabaseClient || !user) return;
    setDataLoading(true);
    Promise.all([
      supabaseClient.from('ramos').select('*').eq('user_id', user.id).order('created_at'),
      supabaseClient.from('schedule').select('*').eq('user_id', user.id),
      supabaseClient.from('tasks').select('*').eq('user_id', user.id).order('due_date'),
      supabaseClient.from('ramo_files').select('*'),
      supabaseClient.from('learning_models').select('*').eq('user_id', user.id).order('created_at'),
      supabaseClient.from('aprender_blocks').select('*').eq('user_id', user.id).order('"order"'),
      supabaseClient.from('aprender_block_chats').select('id,block_id').eq('user_id', user.id),
      supabaseClient.from('ejercicios_blocks').select('*').eq('user_id', user.id).order('created_at', { ascending: false }),
      supabaseClient.from('trabajos').select('*').eq('user_id', user.id).order('created_at', { ascending: false }),
      supabaseClient.from('apuntes').select('*').eq('user_id', user.id).order('updated_at', { ascending: false }).then(r => r).catch(() => ({ data: [] })),
      supabaseClient.from('units').select('*').eq('user_id', user.id).order('"order"'),
    ]).then(([ramosR, schedR, tasksR, filesR, lmR, blocksR, chatsR, ejR, trR, apR, unitsR]) => {
      // Ramos
      if (filesR.error) console.error('Files error:', filesR.error);
      const allFiles = filesR.data || [];
      const allUnits = unitsR.data || [];
      setRamos((ramosR.data || []).map(r => normalizeRamo(r, allFiles.filter(f => f.ramo_id === r.id), allUnits.filter(u => u.ramo_id === r.id))));

      // Schedule — DB uses 0=Mon..4=Fri, mobile uses 1=Mon..5=Fri
      setSchedule((schedR.data || []).map(s => ({ ...s, day_of_week: (s.day_of_week || 0) + 1, tipo: s.block_type || 'catedra' })));

      // Tasks
      setTasks(tasksR.data || []);

      // Cuadernos (learning_models + blocks + chat counts)
      const allBlocks = blocksR.data || [];
      const allChats = chatsR.data || [];
      setCuadernos((lmR.data || []).map(lm => ({
        id: lm.id, name: lm.name, ramo_id: lm.ramo_id,
        bloques: allBlocks.filter(b => b.project_id === lm.id).map(b => ({
          id: b.id, t: b.title, s: b.summary || '', msgs: allChats.filter(c => c.block_id === b.id).length,
          ts: 'activo', chats: [] // chats loaded on demand when entering a block
        }))
      })));

      // Ejercicios
      setEjercicios((ejR.data || []).map(e => ({
        id: e.id, t: e.titulo, s: e.tipo + (e.con_pauta ? ' con pauta' : ''),
        ramo_id: e.ramo_id, tipo: e.tipo, msgs: 0, ts: 'activo', chats: []
      })));

      // Trabajos
      setTrabajos((trR.data || []).map(t => ({
        id: t.id, t: t.titulo, s: t.plantilla || '', ramo_id: t.ramo_id,
        tipo: t.tipo, ts: t.estado, content: t.content_html || ''
      })));

      // Apuntes
      setApuntes((apR.data || []).map(a => ({
        id: a.id, t: a.titulo, s: '', ramo_id: a.ramo_id,
        f: 'activo', blocks: a.blocks || []
      })));

      setDataLoading(false);
    }).catch(err => {
      console.error('Error loading data:', err);
      setDataLoading(false);
    });
  }, [user, devMode]);

  // ── Navigation ──
  const push = useCallback((screen, params = {}) => {
    setStack(s => [...s, { screen, params }]);
  }, []);
  const pop = useCallback(() => setStack(s => s.slice(0, -1)), []);
  const handleTabChange = useCallback((newTab) => { setTab(newTab); setStack([]); }, []);

  // ── Temario sync ──
  const syncTemario = useCallback(async (ramoId, newTemario, oldTemario) => {
    if (!supabaseClient || _devMode) return;
    const oldIds = new Set((oldTemario || []).map(u => u.id));
    const newIds = new Set((newTemario || []).map(u => u.id));
    // Deleted units — only delete from DB if it has a real (non-temporary) id
    for (const u of (oldTemario || [])) {
      if (!newIds.has(u.id) && !String(u.id).startsWith('u')) {
        await dbDelete('units', { id: u.id });
      }
    }
    // Upsert units
    for (let idx = 0; idx < (newTemario || []).length; idx++) {
      const u = newTemario[idx];
      if (String(u.id).startsWith('u')) {
        // New unit — insert
        const { data } = await dbInsert('units', { ramo_id: ramoId, name: u.titulo, materias: u.archivos || [], "order": idx });
        if (data) {
          // Update local state with real DB id
          setRamos(prev => prev.map(r => r.id === ramoId ? { ...r, temario: r.temario.map(t => t.id === u.id ? { ...t, id: data.id } : t) } : r));
        }
      } else if (oldIds.has(u.id)) {
        // Existing unit — update
        dbUpdate('units', { name: u.titulo, materias: u.archivos || [], "order": idx }, { id: u.id });
      }
    }
  }, []);

  // ── Ramo updater ──
  const updateRamo = useCallback((id, updater) => {
    setRamos(prev => {
      const oldRamo = prev.find(r => r.id === id);
      const updated = prev.map(r => r.id === id ? (typeof updater === 'function' ? updater(r) : { ...r, ...updater }) : r);
      // Persist to DB (optimistic)
      const ramo = updated.find(r => r.id === id);
      if (ramo) {
        const attDB = (ramo.attendance || []).map(a => ({ ...a, status: ({ presente: 'present', ausente: 'absent', tardanza: 'late' })[a.status] || a.status }));
        dbUpdate('ramos', { evaluation_modules: ramo.evaluation_modules, attendance_sessions: attDB }, { id });
        // Sync temario if changed
        const oldT = oldRamo?.temario || [];
        const newT = ramo.temario || [];
        if (JSON.stringify(oldT) !== JSON.stringify(newT)) {
          syncTemario(id, newT, oldT);
        }
      }
      return updated;
    });
  }, [syncTemario]);

  // ── DB-synced setters (wrap setTasks/setSchedule to also write to DB) ──
  const origSetTasks = setTasks;
  const syncedSetTasks = useCallback((updater) => {
    origSetTasks(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      // Detect additions
      const added = next.filter(t => !prev.find(p => p.id === t.id));
      added.forEach(t => dbInsert('tasks', { title: t.title, due_date: t.due_date, ramo_id: t.ramo_id || null, type: t.type || 'evaluacion', completed: !!t.completed }));
      // Detect deletions
      const removed = prev.filter(t => !next.find(n => n.id === t.id));
      removed.forEach(t => dbDelete('tasks', { id: t.id }));
      // Detect updates (completed toggle, edits)
      next.forEach(t => {
        const old = prev.find(p => p.id === t.id);
        if (old && (old.completed !== t.completed || old.title !== t.title || old.due_date !== t.due_date)) {
          dbUpdate('tasks', { completed: t.completed, title: t.title, due_date: t.due_date, ramo_id: t.ramo_id, type: t.type }, { id: t.id });
        }
      });
      return next;
    });
  }, []);

  const origSetSchedule = setSchedule;
  const syncedSetSchedule = useCallback((updater) => {
    origSetSchedule(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      const added = next.filter(s => !prev.find(p => p.id === s.id));
      added.forEach(s => dbInsert('schedule', { ramo_id: s.ramo_id, day_of_week: (s.day_of_week || 1) - 1, start_time: s.start_time, end_time: s.end_time, sala: s.sala, block_type: s.tipo || 'catedra' }));
      const removed = prev.filter(s => !next.find(n => n.id === s.id));
      removed.forEach(s => dbDelete('schedule', { id: s.id }));
      return next;
    });
  }, []);

  // ── Current screen ──
  const current = stack.length > 0 ? stack[stack.length - 1] : null;
  let topTitle = { inicio: 'Inicio', ramos: 'Mis ramos', aprender: 'Aprender', calendario: 'Calendario', mas: 'Herramientas' }[tab];
  if (current) topTitle = current.params?.title || current.screen;

  const findRamo = (id) => ramos.find(r => r.id === id);

  function renderSection() {
    if (current) {
      if (current.screen === 'ramo-detail') {
        const ramo = findRamo(current.params.ramoId);
        if (ramo) return <RamoDetail ramo={ramo} updateRamo={updateRamo} setRamos={setRamos} pop={pop} />;
      }
      if (current.screen === 'cuaderno-blocks') {
        const cuad = cuadernos.find(c => c.id === current.params.cuadId);
        if (cuad) return <CuadernoBlocks cuaderno={cuad} push={push} ramos={ramos} setCuadernos={setCuadernos} pop={pop} />;
      }
      if (current.screen === 'block-chat') {
        const cuad = cuadernos.find(c => c.id === current.params.cuadId);
        const block = cuad?.bloques.find(b => b.id === current.params.blockId);
        if (cuad && block) return <BlockChat block={block} cuaderno={cuad} ramos={ramos} />;
      }
      if (current.screen === 'profile') {
        return <SecProfile profile={profile} ramos={ramos} onLogout={onLogout} push={push} />;
      }
      if (current.screen === 'settings') {
        return <SecSettings profile={profile} ramos={ramos} onLogout={onLogout} />;
      }
      if (current.screen === 'tool-ejercicios') return <ToolEjercicios items={ejercicios} setItems={setEjercicios} ramos={ramos} push={push} />;
      if (current.screen === 'tool-trabajos') return <ToolTrabajos items={trabajos} setItems={setTrabajos} ramos={ramos} push={push} />;
      if (current.screen === 'tool-apuntes') return <ToolApuntes items={apuntes} setItems={setApuntes} ramos={ramos} push={push} />;
      if (current.screen === 'biblioteca') return <ToolBiblioteca push={push} ramos={ramos} />;
      if (current.screen === 'biblioteca-ramo') { const r = findRamo(current.params.ramoId); if (r) return <BibliotecaRamo ramo={r} updateRamo={updateRamo} />; }
      if (current.screen === 'ej-detail') { const b = ejercicios.find(x => x.id === current.params.blockId); if (b) return <EjercicioChat block={b} ramos={ramos} cuaderno={{ ramo_id: b.ramo_id }} />; }
      if (current.screen === 'tr-detail') { const b = trabajos.find(x => x.id === current.params.blockId); if (b) return <TrabajoDetail block={b} ramos={ramos} cuaderno={{ ramo_id: b.ramo_id }} />; }
      if (current.screen === 'ap-detail') { const b = apuntes.find(x => x.id === current.params.blockId); if (b) return <ApunteDetail block={b} ramos={ramos} cuaderno={{ ramo_id: b.ramo_id }} />; }
      return <div className="placeholder-screen"><p>Sub-pantalla: {current.screen}</p></div>;
    }
    switch(tab) {
      case 'inicio':    return <SecInicio profile={profile} push={push} ramos={ramos} tasks={tasks} setTasks={syncedSetTasks} schedule={schedule} setSchedule={syncedSetSchedule} cuadernos={cuadernos} />;
      case 'ramos':     return <SecRamos push={push} ramos={ramos} setRamos={setRamos} />;
      case 'aprender':  return <SecAprender push={push} ramos={ramos} cuadernos={cuadernos} setCuadernos={setCuadernos} />;
      case 'calendario':return <SecCalendario push={push} ramos={ramos} tasks={tasks} setTasks={syncedSetTasks} />;
      case 'mas':       return <SecMas push={push} />;
      default:          return null;
    }
  }

  if (dataLoading) {
    return (
      <div style={{ height: '100dvh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--p)' }}>
        <div style={{ textAlign: 'center' }}>
          <div className="skeleton" style={{ width: 40, height: 40, borderRadius: 10, margin: '0 auto 12px' }} />
          <div className="skeleton" style={{ width: 100, height: 10, borderRadius: 4, margin: '0 auto 8px' }} />
          <div className="skeleton" style={{ width: 60, height: 8, borderRadius: 3, margin: '0 auto' }} />
        </div>
      </div>
    );
  }

  return (
    <>
      <TopBar title={topTitle} showBack={stack.length > 0} onBack={pop} profile={profile} onAvatarClick={() => push('profile', { title: 'Mi perfil' })} />
      <div className="screen-content">{renderSection()}</div>
      <BottomNav activeTab={tab} onTabChange={handleTabChange} />
    </>
  );
}

/* ─────────────────────────────────────────────
   ROOT APP
───────────────────────────────────────────── */
function App() {
  const [user, setUser] = useState(null);       // Supabase auth user
  const [profile, setProfile] = useState(null);  // Profile from DB
  const [authLoading, setAuthLoading] = useState(true);
  const [devMode, setDevMode] = useState(false);

  // Detectar preferencia de color
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.matches) document.documentElement.setAttribute('data-theme', 'dark');
    mq.addEventListener('change', e => {
      document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
    });
  }, []);

  // Auth session management
  useEffect(() => {
    if (!supabaseClient) { setAuthLoading(false); return; }

    // Check existing session
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      setUser(session?.user || null);
      setAuthLoading(false);
    });

    // Listen for auth changes
    const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
      const u = session?.user || null;
      setUser(u);
      if (!u) { setProfile(null); setDevMode(false); }
    });

    return () => subscription.unsubscribe();
  }, []);

  // Fetch profile when user changes
  useEffect(() => {
    if (!user || !supabaseClient || devMode) return;
    supabaseClient.from('profiles')
      .select('name,apellido1,apellido2,carrera,study_year,university,subscription_status,username')
      .eq('id', user.id)
      .single()
      .then(({ data }) => {
        if (data) setProfile({
          name: data.name || '',
          apellido: data.apellido1 || '',
          apellido2: data.apellido2 || '',
          carrera: data.carrera || '',
          university: data.university || '',
          subscription_status: data.subscription_status || 'free',
          username: data.username || '',
        });
      });
  }, [user, devMode]);

  // Sync global helpers
  useEffect(() => { _devMode = devMode; _userId = user?.id || null; }, [devMode, user]);

  const handleLogout = async () => {
    if (supabaseClient && !devMode) await supabaseClient.auth.signOut();
    setUser(null); setProfile(null); setDevMode(false);
    _devMode = false; _userId = null;
  };

  const handleDevLogin = () => {
    setDevMode(true);
    setUser({ id: 'dev' });
    setProfile(MOCK_PROFILE);
  };

  // Loading state
  if (authLoading) {
    return (
      <div style={{ height: '100dvh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--p)' }}>
        <div style={{ textAlign: 'center' }}>
          <div className="skeleton" style={{ width: 48, height: 48, borderRadius: 12, margin: '0 auto 14px' }} />
          <div className="skeleton" style={{ width: 120, height: 12, borderRadius: 4 }} />
        </div>
      </div>
    );
  }

  if (!user || !profile) {
    return <LoginScreen onDevLogin={handleDevLogin} />;
  }

  return <MainApp profile={profile} user={user} devMode={devMode} onLogout={handleLogout} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
