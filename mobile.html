<!DOCTYPE html>
<html lang="es">
<head>

  <!-- React 18 + Babel + Supabase -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    /* ─── Reset ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: var(--p);
      color: var(--k);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    #root {
      height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, textarea, select { font-family: inherit; }

    /* ─── CSS Variables ─── */
    :root {
      --w: #ffffff;
      --p: #f5f5f7;
      --p2: #ebebef;
      --ln: #d2d2d7;
      --ls: rgba(0,0,0,.06);
      --k: #1d1d1f;
      --k2: #424245;
      --k3: #6e6e73;
      --k4: #86868b;
      --ok: #1d8348;
      --wn: #b25e09;
      --er: #d70015;
      --brand1: #1654b0;
      --brand2: #3a26a0;
      --brand: linear-gradient(125deg, #1654b0, #3a26a0);

      --nav-h: 56px;
      --top-h: 52px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);

      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --r-xl: 20px;

      --shadow-sm: 0 1px 2px rgba(0,0,0,.08);
      --shadow-md: 0 3px 12px rgba(0,0,0,.10);
      --shadow-lg: 0 6px 24px rgba(0,0,0,.14);

      /* Base spacing unit */
      --sp: 16px;
    }

    /* ─── Dark mode ─── */
    [data-theme="dark"] {
      --w: #1c1c1e;
      --p: #111113;
      --p2: #2c2c2e;
      --ln: rgba(255,255,255,.12);
      --ls: rgba(255,255,255,.05);
      --k: #f5f5f7;
      --k2: #ebebef;
      --k3: #adadb0;
      --k4: #8e8e93;
      --ok: #32d74b;
      --wn: #ff9f0a;
      --er: #ff453a;
    }

    /* ─── TopBar ─── */
    .topbar {
      height: calc(var(--top-h) + var(--safe-top));
      padding-top: var(--safe-top);
      background: var(--w);
      border-bottom: 1px solid var(--ln);
      display: flex;
      align-items: flex-end;
      padding-bottom: 12px;
      padding-left: var(--sp);
      padding-right: var(--sp);
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }
    .topbar-back {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--brand1);
      font-size: 18px;
      margin-right: 4px;
      flex-shrink: 0;
    }
    .topbar-back:active { background: var(--p); }
    .topbar-title {
      flex: 1;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.022em;
      color: var(--k);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .avatar-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0;
    }
    .avatar-btn:active { opacity: .8; }

    /* ─── Screen Content ─── */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    /* ─── Bottom Nav ─── */
    .bottom-nav {
      height: calc(var(--nav-h) + var(--safe-bot));
      padding-bottom: var(--safe-bot);
      background: var(--w);
      border-top: 1px solid var(--ln);
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    .nav-tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding-bottom: 2px;
      color: var(--k4);
      transition: color .15s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .nav-tab.active { color: var(--brand1); }
    .nav-tab:active { opacity: .7; }
    .nav-tab svg { width: 24px; height: 24px; stroke-width: 1.8; }
    .nav-tab span {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .nav-tab-dot {
      position: absolute;
      top: 5px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--brand1);
      display: none;
    }
    .nav-tab.active .nav-tab-dot { display: block; }

    /* ─── Shared Components ─── */

    /* Cards */
    .card {
      background: var(--w);
      border: 1px solid var(--ln);
      border-radius: var(--r-md);
      overflow: hidden;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 var(--sp);
      height: 44px;
      border-radius: var(--r-sm);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: opacity .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .btn:active { opacity: .75; transform: scale(.97); }
    .btn-pri { background: var(--brand); color: #fff; }
    .btn-sec { background: var(--p); color: var(--k); border: 1px solid var(--ln); }
    .btn-ghost { color: var(--brand1); }
    .btn-dan { background: var(--er); color: #fff; }
    .btn-sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 6px; }

    /* Chips */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      background: var(--p2);
      color: var(--k3);
    }

    /* Section headers */
    .sec-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px var(--sp) 10px;
    }
    .sec-header h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--k4);
    }

    /* Dividers */
    .divider { height: 1px; background: var(--ln); margin: 0 var(--sp); }

    /* Bottom sheet overlay */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 100;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .sheet-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--w);
      border-radius: 20px 20px 0 0;
      padding-bottom: calc(var(--nav-h) + var(--safe-bot) + var(--sp));
      z-index: 101;
      animation: slideUp .25s cubic-bezier(.32,.72,0,1);
      max-height: 92dvh;
      overflow-y: auto;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--ln);
      margin: 12px auto var(--sp);
    }
    .sheet-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.022em;
      padding: 0 var(--sp) var(--sp);
      color: var(--k);
    }

    /* ─── Login Screen ─── */
    .login-screen {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px;
      background: var(--w);
    }
    .login-logo {
      width: 64px;
      height: 64px;
      background: var(--brand);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      box-shadow: 0 6px 20px rgba(22,84,176,.35);
    }
    .login-logo svg { width: 32px; height: 32px; stroke: #fff; stroke-width: 1.8; fill: none; }
    .login-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--k);

    }
    .login-sub {

      color: var(--k3);
      margin-bottom: 32px;

    }
    .login-form {

    }
    .field {

    }
    .field label {

      font-weight: 500;
      color: var(--k3);
      letter-spacing: -0.01em;

    .field input {

      font-weight: 600;
      letter-spacing: -0.01em;

      font-size: 13px;
      color: var(--k4);
      text-align: center;

    .login-dev button {
      color: var(--brand1);
      font-size: 13px;
      font-weight: 500;
      text-decoration: underline;
      margin-left: 3px;

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 44px 24px;
      gap: 12px;
      text-align: center;

    .empty-state svg { width: 42px; height: 42px; stroke: var(--k4); stroke-width: 1.4; fill: none; }
    .empty-state p { font-size: 14px; color: var(--k3); line-height: 1.5; }

    /* ─── Loading skeleton ─── */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }

    .skeleton {
      background: linear-gradient(90deg, var(--p2) 25%, var(--p) 50%, var(--p2) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 6px;

    /* ─── Grade chip ─── */
    .grade-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      padding: 3px 8px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;

    .grade-wn { background: #fff3e0; color: var(--wn); }
    .grade-er { background: #fde8ea; color: var(--er); }

    [data-theme="dark"] .grade-wn { background: rgba(255,159,10,.15); }
    [data-theme="dark"] .grade-er { background: rgba(255,69,58,.15); }

    /* ─── Progress bar ─── */
    .progress-bar {
      height: 4px;
      border-radius: 2px;
      background: var(--p2);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--brand);
      transition: width .3s ease;

    .fab {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-bot) + var(--sp));
      right: var(--sp);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 12px rgba(22,84,176,.4);
      z-index: 50;
      transition: transform .15s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;

    .fab:active { transform: scale(.93); box-shadow: 0 2px 6px rgba(22,84,176,.3); }
    .fab svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2; fill: none; }

    /* ─── Swipeable list item ─── */
    .list-item {
      display: flex;
      align-items: center;
      padding: 12px var(--sp);
      gap: 12px;
      background: var(--w);
      transition: background .1s;

    /* ─── Segmented control ─── */
    .seg-ctrl {
      display: flex;
      background: var(--p2);
      border-radius: var(--r-sm);
      padding: 3px;
      gap: 2px;

    .seg-opt {

      font-weight: 500;

    .seg-opt.active {
      background: var(--w);

    /* ─── Placeholder screens ─── */
    .placeholder-screen {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 38px 24px;

    .placeholder-screen h3 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.022em;
      color: var(--k);

    .placeholder-screen p { font-size: 13px; color: var(--k3); text-align: center; }

    /* ─── Schedule day selector ─── */
    .day-selector {
      display: flex;
      gap: 6px;
      padding: 0 var(--sp);
      margin-bottom: 12px;
    }
    .day-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 8px 0 6px;
      border-radius: 0;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      transition: all .15s;

    }
    .day-btn.active {
      border-bottom-color: var(--brand1);
    }
    .day-btn .day-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--k3);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .day-btn.active .day-label { color: var(--k); font-weight: 700; }
    .day-btn:active { opacity: .7; }

    /* Schedule timeline */
    .schedule-timeline {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 0 var(--sp);
      position: relative;
    }
    .schedule-item {

    }
    .schedule-time {

      flex-shrink: 0;

      color: var(--k3);

    }

      font-size: 11px;

      margin-top: 1px;

    .schedule-card {
      flex: 1;

      padding: 10px 12px;

      min-width: 0;

    .schedule-card-info { flex: 1; min-width: 0; }
    .schedule-card-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--k);
      letter-spacing: -0.01em;
      margin-bottom: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }
    .schedule-card-detail {
      font-size: 11px;
      color: var(--k3);
      display: flex;
      align-items: center;
      gap: 3px;
      line-height: 1.25;
    }
    .schedule-card-detail svg {

    /* Form inputs for sheets */
    .field-input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1.5px solid var(--ln);
      border-radius: var(--r-sm);
      font-size: 15px;
      color: var(--k);
      background: var(--p);
      outline: none;
      font-family: inherit;
      -webkit-appearance: none;
    }
    .field-input:focus { border-color: var(--brand1); background: var(--w); }

    .schedule-empty {
      padding: 24px var(--sp);
      text-align: center;
      color: var(--k3);
      font-size: 13px;
      background: var(--w);
      border: 1px solid var(--ln);
      border-radius: var(--r-md);
      margin: 0 var(--sp);
    }
  </style>
</head>

let _devMode = false; // set by App on login

async function dbInsert(table, data) {
  if (!supabaseClient || _devMode) return { data: null };
  const res = await supabaseClient.from(table).insert({ ...data, user_id: _userId }).select().single();
  if (res.error) console.error(`dbInsert ${table}:`, res.error.message);
  return res;
}
async function dbUpdate(table, data, match) {
  if (!supabaseClient || _devMode) return { data: null };
  const res = await supabaseClient.from(table).update(data).match(match);
  if (res.error) console.error(`dbUpdate ${table}:`, res.error.message);
  return res;
}
async function dbDelete(table, match) {
  if (!supabaseClient || _devMode) return { data: null };
  const res = await supabaseClient.from(table).delete().match(match);
  if (res.error) console.error(`dbDelete ${table}:`, res.error.message);
  return res;
}

/* SSE streaming helper for AI chat endpoints */
async function streamChat(endpoint, body, { onChunk, onDone, onError }) {
  try {
    const resp = await fetch(API_BASE + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!resp.ok) { const e = await resp.text(); onError?.(e); return; }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let full = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const lines = dec.decode(value, { stream: true }).split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const j = JSON.parse(line.slice(6));
          if (j.chunk) { full += j.chunk; onChunk(full); }
          if (j.done) { onDone?.(full, j); return; }
        } catch {}
      }
    }
    onDone?.(full, {});
  } catch (e) { onError?.(e.message || 'Error de conexión'); }
}

function nc(n) {
  if (n === null || n === undefined || isNaN(n)) return '';
  if (n >= 5.5) return 'grade-ok';
  if (n >= 4.0) return 'grade-wn';
  return 'grade-er';
}

function ncColor(n) {
  if (n === null || n === undefined || isNaN(n) || n === 0) return 'var(--k4)';
  if (n >= 5.5) return 'var(--ok)';
  if (n >= 4.0) return 'var(--wn)';
  return 'var(--er)';
}

function computeNota(evMods) {
  let num = 0, den = 0;
  (evMods || []).forEach(m => {
    const graded = (m.items || []).filter(it => it.grade != null);
    if (graded.length > 0) {
      const avg = graded.reduce((a, it) => a + Number(it.grade), 0) / graded.length;
      num += avg * (m.weight || 0);
      den += m.weight || 0;
    }
  });
  return den > 0 ? parseFloat((num / den).toFixed(1)) : 0;
}

/* Normalize a ramo from DB format to mobile format */
function normalizeRamo(r, files, units) {
  const evMods = r.evaluation_modules || [];
  const attSessions = (r.attendance_sessions || []).map(a => ({
    ...a,
    status: ({ present: 'presente', absent: 'ausente', late: 'tardanza' })[a.status] || a.status
  }));
  const pCount = attSessions.filter(a => a.status === 'presente').length;
  const asist = attSessions.length > 0 ? Math.round((pCount / attSessions.length) * 100) : 0;
  return {
    id: r.id,
    name: r.name || '',
    codigo: r.code || r.codigo || '',
    seccion: r.section || r.seccion || '',
    profesor: r.professor || r.profesor || '',
    color: r.color || '#1654b0',
    credits: r.credits || 0,
    nota: computeNota(evMods),
    asist,
    evaluation_modules: evMods,
    attendance: attSessions,
    archivos: (files || []).map(f => ({ id: f.id, name: f.name, date: (f.created_at || '').slice(0, 10), programa: !!f.is_programa, storage_path: f.storage_path })),
    temario: (units || []).map(u => {
      let fileIds = u.materias || u.archivos || [];
      const allF = (files || []);
      if (fileIds.length > 0 && typeof fileIds[0] === 'object' && fileIds[0] !== null) {
        const names = fileIds.flatMap(m => (m.files || []));
        fileIds = allF.filter(f => names.some(n => f.name && f.name.includes(n) || n && n.includes(f.name))).map(f => f.id);
      }
      return { id: u.id, titulo: u.name || u.titulo || '', archivos: fileIds };
    }),
  };
}

function todayDayOfWeek() {
  const d = new Date().getDay();
  return d === 0 ? 7 : d; // 1=lun, 7=dom
}

function daysUntil(dateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dateStr + 'T00:00:00');
  return Math.round((due - today) / 86400000);
}

function fmtDue(dateStr) {
  const d = daysUntil(dateStr);
  if (d < 0) return `hace ${Math.abs(d)}d`;
  if (d === 0) return 'hoy';
  if (d === 1) return 'mañana';
  return `en ${d}d`;
}

function initials(name) {
  return name.trim().split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
}

/* ─────────────────────────────────────────────
   LOGIN SCREEN
───────────────────────────────────────────── */
function LoginScreen({ onLogin, onDevLogin }) {
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  const doLogin = async () => {
    if (!email.trim() || !pass.trim()) return;
    setErr(''); setLoading(true);
    try {
      let loginEmail = email.trim();
      // Support username login (no @)
      if (!loginEmail.includes('@') && supabaseClient) {
        const { data } = await supabaseClient.rpc('resolve_login_identifier', { p_identifier: loginEmail });
        if (data) loginEmail = data;
        else { setErr('Usuario no encontrado'); setLoading(false); return; }
      }
      if (!supabaseClient) { setErr('Sin conexión a Supabase'); setLoading(false); return; }
      const { error } = await supabaseClient.auth.signInWithPassword({ email: loginEmail, password: pass });
      if (error) setErr(error.message === 'Invalid login credentials' ? 'Credenciales incorrectas' : error.message);
    } catch (e) { setErr(e.message || 'Error de conexión'); }
    setLoading(false);
  };

  return (
    <div className="login-screen">
      <div className="login-logo">
        <Icon.GraduationCap />
      </div>
      <h1 className="login-title">Universidad</h1>
      <p className="login-sub">Tu asistente académico con IA</p>

      <div className="login-form">
        <div className="field">
          <label>Correo o usuario</label>
          <input
            type="text"
            placeholder="tu@correo.cl"
            value={email}
            onChange={e => setEmail(e.target.value)}
            autoComplete="email"
            onKeyDown={e => e.key === 'Enter' && doLogin()}
          />
        </div>
        <div className="field">
          <label>Contraseña</label>
          <input
            type="password"
            placeholder="••••••••"
            value={pass}
            onChange={e => setPass(e.target.value)}
            autoComplete="current-password"
            onKeyDown={e => e.key === 'Enter' && doLogin()}
          />
        </div>
        {err && <p style={{ fontSize: 13, color: 'var(--er)', textAlign: 'center', padding: '6px 0' }}>{err}</p>}
        <button className="login-btn" onClick={doLogin} disabled={loading} style={{ opacity: loading ? .6 : 1 }}>
          {loading ? 'Entrando...' : 'Iniciar sesión'}
        </button>
        <button onClick={() => {
          if (!email.trim()) { setErr('Ingresa tu correo primero'); return; }
          setLoading(true); setErr('');
          supabaseClient?.auth.resetPasswordForEmail(email.trim()).then(({ error }) => {
            setLoading(false);
            if (error) setErr(error.message);
            else setErr(''); alert('Se envió un correo para restablecer tu contraseña.');
          }).catch(() => { setLoading(false); setErr('Error al enviar correo'); });
        }} style={{ background: 'none', border: 'none', color: 'var(--brand1)', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit', marginTop: 6, textAlign: 'center', width: '100%' }}>
          ¿Olvidaste tu contraseña?
        </button>
      </div>

      {window.location.protocol === 'file:' && (
        <p className="login-dev">
          Modo desarrollo:
          <button onClick={onDevLogin}>Entrar como dev</button>
        </p>
      )}
    </div>
  );
}

/* ── Edit Schedule Sheet (desktop-like, multi-day) ── */
function EditScheduleSheet({ ramos, schedule, setSchedule, selectedDay, onClose }) {
  const [editing, setEditing] = useState(null); // cls id being edited
  const [editForm, setEditForm] = useState({});
  const [ramoId, setRamoId] = useState(ramos[0]?.id || '');
  const [start, setStart] = useState('08:30');
  const [end, setEnd] = useState('10:00');
  const [sala, setSala] = useState('');
  const [tipo, setTipo] = useState('catedra');
  const [days, setDays] = useState({ 1: false, 2: false, 3: false, 4: false, 5: false });
  const DN = ['','Lun','Mar','Mié','Jue','Vie'];
  const DF = ['','Lunes','Martes','Miércoles','Jueves','Viernes'];
  const TO = [{ v: 'catedra', l: 'Cátedra' }, { v: 'ayudantia', l: 'Ayudantía' }, { v: 'laboratorio', l: 'Laboratorio' }, { v: 'taller', l: 'Taller' }];
  const TL = { catedra: 'cátedra', ayudantia: 'ayudantía', laboratorio: 'lab', taller: 'taller' };

  const toggleDay = (d) => setDays(p => ({ ...p, [d]: !p[d] }));

  const startEdit = (cls) => {
    // Find all sibling blocks (same ramo, time, sala, tipo) to pre-check their days
    const siblings = schedule.filter(s => s.ramo_id === cls.ramo_id && s.start_time === cls.start_time && s.end_time === cls.end_time && s.sala === cls.sala && s.tipo === cls.tipo);
    const editDays = { 1: false, 2: false, 3: false, 4: false, 5: false };
    siblings.forEach(s => { editDays[s.day_of_week] = true; });
    setEditing(cls.id);
    setEditForm({ ramo_id: cls.ramo_id, start_time: cls.start_time, end_time: cls.end_time, sala: cls.sala, tipo: cls.tipo || 'catedra', days: editDays, siblingIds: siblings.map(s => s.id) });
  };

  const saveEdit = () => {
    if (!editForm.ramo_id) return;
    // Remove all old siblings
    setSchedule(prev => {
      const without = prev.filter(s => !editForm.siblingIds.includes(s.id));
      // Add new entries for each checked day
      const newItems = Object.entries(editForm.days).filter(([, v]) => v).map(([d]) => ({
        id: 's' + Date.now() + d, ramo_id: editForm.ramo_id, day_of_week: Number(d),
        start_time: editForm.start_time, end_time: editForm.end_time, sala: editForm.sala, tipo: editForm.tipo
      }));
      return [...without, ...newItems];
    });
    setEditing(null);
  };

  const delEdit = () => {
    setSchedule(prev => prev.filter(s => !editForm.siblingIds.includes(s.id)));
    setEditing(null);
  };

  const toggleEditDay = (d) => setEditForm(p => ({ ...p, days: { ...p.days, [d]: !p.days[d] } }));

  const add = () => {
    if (!ramoId || !start || !end) return;
    const selDays = Object.entries(days).filter(([, v]) => v).map(([k]) => Number(k));
    if (selDays.length === 0) return;
    setSchedule(prev => [...prev, ...selDays.map(d => ({ id: 's' + Date.now() + d, ramo_id: ramoId, day_of_week: d, start_time: start, end_time: end, sala: sala || '—', tipo }))]);
    setSala(''); setStart('08:30'); setEnd('10:00'); setDays({ 1: false, 2: false, 3: false, 4: false, 5: false });
  };

  const del = (id) => setSchedule(prev => prev.filter(s => s.id !== id));

  return (
    <Sheet title="Personalizar horario" onClose={onClose}>
      {/* Existing classes grouped by day */}
      {[1,2,3,4,5].map(day => {
        const clases = schedule.filter(s => s.day_of_week === day).sort((a,b) => a.start_time.localeCompare(b.start_time));
        if (clases.length === 0) return null;
        return (
          <div key={day} style={{ marginBottom: 12 }}>
            <p style={{ fontSize: 11, fontWeight: 600, color: 'var(--k4)', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 6 }}>{DF[day]}</p>
            {clases.map(cls => {
              const r = ramos.find(x => x.id === cls.ramo_id);
              const c = r?.color || '#1654b0';
              const isEd = editing === cls.id;
              return (
                <div key={cls.id}>
                  <div onClick={() => isEd ? setEditing(null) : startEdit(cls)}
                    style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 0', borderBottom: '1px solid var(--ls)', cursor: 'pointer' }}>
                    <div style={{ width: 3, height: 22, borderRadius: 2, background: c, flexShrink: 0 }} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <p style={{ fontSize: 13, fontWeight: 500, color: 'var(--k)' }}>{r?.name || '—'}{TL[cls.tipo] ? ' · ' + TL[cls.tipo] : ''}</p>
                      <p style={{ fontSize: 11, color: 'var(--k3)' }}>{cls.start_time}–{cls.end_time} · {cls.sala}</p>
                    </div>
                    <span style={{ fontSize: 11, color: 'var(--k4)' }}>{isEd ? '▾' : '›'}</span>
                  </div>
                  {/* Inline edit form */}
                  {isEd && (
                    <div style={{ padding: '10px 0 12px', borderBottom: '1px solid var(--ls)', animation: 'fadeIn .15s ease', display: 'flex', flexDirection: 'column', gap: 8 }}>
                      <FormRow label="Ramo">
                        <select value={editForm.ramo_id} onChange={e => setEditForm(p => ({ ...p, ramo_id: e.target.value }))} className="field-input">
                          {ramos.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                        </select>
                      </FormRow>
                      <FormRow label="Tipo">
                        <select value={editForm.tipo} onChange={e => setEditForm(p => ({ ...p, tipo: e.target.value }))} className="field-input">
                          {TO.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
                        </select>
                      </FormRow>
                      <div className="field" style={{ marginBottom: 0 }}>
                        <label>Días</label>
                        <div style={{ display: 'flex', gap: 6, marginTop: 6 }}>
                          {[1,2,3,4,5].map(d => (
                            <button key={d} onClick={() => toggleEditDay(d)}
                              style={{ flex: 1, padding: '7px 0', borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', border: editForm.days[d] ? '1.5px solid var(--brand1)' : '1.5px solid var(--ln)', background: editForm.days[d] ? 'rgba(22,84,176,.09)' : 'var(--p)', color: editForm.days[d] ? 'var(--brand1)' : 'var(--k3)' }}>
                              {DN[d]}
                            </button>
                          ))}
                        </div>
                      </div>
                      <div style={{ display: 'flex', gap: 10 }}>
                        <FormRow label="Inicio"><input type="time" value={editForm.start_time} onChange={e => setEditForm(p => ({ ...p, start_time: e.target.value }))} className="field-input" /></FormRow>
                        <FormRow label="Fin"><input type="time" value={editForm.end_time} onChange={e => setEditForm(p => ({ ...p, end_time: e.target.value }))} className="field-input" /></FormRow>
                      </div>
                      <FormRow label="Sala"><input value={editForm.sala} onChange={e => setEditForm(p => ({ ...p, sala: e.target.value }))} className="field-input" /></FormRow>
                      <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
                        <button onClick={delEdit} style={{ padding: '7px 14px', borderRadius: 6, border: 'none', background: 'rgba(215,0,21,.08)', color: 'var(--er)', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>Eliminar</button>
                        <button onClick={saveEdit} style={{ padding: '7px 14px', borderRadius: 6, border: 'none', background: 'linear-gradient(125deg,#1654b0,#3a26a0)', color: '#fff', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>Guardar</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}

      {/* Add new — multi-day */}
      <div style={{ borderTop: '1px solid var(--ln)', paddingTop: 12, marginTop: 6 }}>
        <p style={{ fontSize: 11, fontWeight: 600, color: 'var(--k4)', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 8 }}>Añadir clase</p>
        <FormRow label="Ramo">
          <select value={ramoId} onChange={e => setRamoId(e.target.value)} className="field-input">
            {ramos.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
          </select>
        </FormRow>
        <FormRow label="Tipo">
          <select value={tipo} onChange={e => setTipo(e.target.value)} className="field-input">
            {TO.map(o => <option key={o.v} value={o.v}>{o.l}</option>)}
          </select>
        </FormRow>
        <div className="field" style={{ marginBottom: 10 }}>
          <label>Días</label>
          <div style={{ display: 'flex', gap: 6, marginTop: 6 }}>
            {[1,2,3,4,5].map(d => (
              <button key={d} onClick={() => toggleDay(d)}
                style={{ flex: 1, padding: '7px 0', borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit', border: days[d] ? '1.5px solid var(--brand1)' : '1.5px solid var(--ln)', background: days[d] ? 'rgba(22,84,176,.09)' : 'var(--p)', color: days[d] ? 'var(--brand1)' : 'var(--k3)' }}>
                {DN[d]}
              </button>
            ))}
          </div>
        </div>
        <div style={{ display: 'flex', gap: 10 }}>
          <FormRow label="Inicio"><input type="time" value={start} onChange={e => setStart(e.target.value)} className="field-input" /></FormRow>
          <FormRow label="Fin"><input type="time" value={end} onChange={e => setEnd(e.target.value)} className="field-input" /></FormRow>
        </div>
        <FormRow label="Sala"><input value={sala} onChange={e => setSala(e.target.value)} placeholder="Ej: B6-301" className="field-input" /></FormRow>
        <button className="btn btn-pri" style={{ width: '100%', marginTop: 6 }} onClick={add}>Añadir clase</button>
      </div>
    </Sheet>
  );
}

/* ─────────────────────────────────────────────
   SECTION: INICIO
───────────────────────────────────────────── */
function SecInicio({ profile, push, ramos, tasks, setTasks, schedule, setSchedule, cuadernos }) {
  const todayDow = todayDayOfWeek();
  const [selectedDay, setSelectedDay] = useState(() => todayDow >= 1 && todayDow <= 5 ? todayDow : 1);
  const [showEditSchedule, setShowEditSchedule] = useState(false);
  const [showAddTask, setShowAddTask] = useState(false);
  const [viewTask, setViewTask] = useState(null);
  const [editTask, setEditTask] = useState(null);
  const [viewClase, setViewClase] = useState(null);
  const [showCompleted, setShowCompleted] = useState(false);

  const ramoByIdLocal = (id) => ramos.find(r => r.id === id);
  const dayClases = schedule.filter(s => s.day_of_week === selectedDay).sort((a,b) => a.start_time.localeCompare(b.start_time));
  const pendingTasks = tasks.filter(t => !t.completed).sort((a,b) => new Date(a.due_date) - new Date(b.due_date)).slice(0, 4);
  const completedTasks = tasks.filter(t => t.completed).sort((a,b) => new Date(b.due_date) - new Date(a.due_date));

  const dayName = ['', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'][todayDow];
  const dateStr = new Date().toLocaleDateString('es-CL', { day: 'numeric', month: 'long' });

  // Get dates for this week (Mon-Fri)
  const today = new Date();
  const currentDow = today.getDay() === 0 ? 7 : today.getDay();
  const weekDays = [1,2,3,4,5].map(d => {
    const date = new Date(today);
    date.setDate(today.getDate() + (d - currentDow));
    return { dow: d, label: ['','Lun','Mar','Mié','Jue','Vie'][d], num: date.getDate() };
  });

  return (
    <div style={{ padding: '0 0 20px' }}>
      {/* Greeting */}
      <div style={{ padding: '18px 16px 8px' }}>
        <h1 style={{ fontSize: 20, fontWeight: 600, letterSpacing: '-0.022em', color: 'var(--k)', marginBottom: 6 }}>
          {(() => { const h = new Date().getHours(); return h < 12 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches'; })()}, {profile.name}
        </h1>
        {pendingTasks.length > 0 && (() => {
          const next = pendingTasks[0];
          const ramo = ramoByIdLocal(next.ramo_id);
          const d = daysUntil(next.due_date);
          return (
            <p style={{ fontSize: 13, color: 'var(--k3)', lineHeight: 1.5 }}>
              💡 {next.title} {d > 0 ? `en ${d} días` : d === 0 ? 'hoy' : ''}{ramo ? ` — ${ramo.name}` : ''}
            </p>
          );
        })()}
      </div>

      {/* Horario semanal — prominent section */}
      <div style={{ padding: '14px 16px 6px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div>
          <h2 style={{ fontSize: 18, fontWeight: 700, letterSpacing: '-0.02em', color: 'var(--k)' }}>Horario</h2>
          <p style={{ fontSize: 12, color: 'var(--k4)', marginTop: 2 }}>Semana {(() => { const d = new Date(); const start = new Date(d.getFullYear(), 0, 1); return Math.ceil(((d - start) / 86400000 + start.getDay() + 1) / 7); })()}</p>
        </div>
        <button onClick={() => setShowEditSchedule(true)}
          style={{ width: 28, height: 28, borderRadius: 8, border: '1px solid var(--ln)', background: 'var(--w)', cursor: 'pointer', color: 'var(--k3)', display: 'grid', placeItems: 'center', fontSize: 14 }}>
          ✎
        </button>
      </div>

      {/* Day selector — taller, more prominent */}
      <div style={{ display: 'flex', gap: 6, margin: '0 16px', padding: '4px 0' }}>
        {weekDays.map(d => {
          const isToday = d.dow === todayDow;
          const isActive = selectedDay === d.dow;
          return (
            <button key={d.dow} onClick={() => setSelectedDay(d.dow)} className="card"
              style={{
                flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2,
                padding: '10px 0 8px', cursor: 'pointer', fontFamily: 'inherit',
                background: isActive ? 'var(--brand1)' : 'var(--w)',
                borderColor: isActive ? 'var(--brand1)' : undefined,
                transition: 'all .15s', WebkitTapHighlightColor: 'transparent',
              }}>
              <span style={{ fontSize: 10, fontWeight: 500, color: isActive ? 'rgba(255,255,255,.6)' : 'var(--k4)', textTransform: 'uppercase', letterSpacing: '.06em' }}>
                {d.label}
              </span>
              <span style={{ fontSize: 17, fontWeight: 700, color: isActive ? '#fff' : 'var(--k)', letterSpacing: '-0.01em' }}>
                {d.num}
              </span>
              {isToday && <div style={{ width: 5, height: 5, borderRadius: '50%', background: isActive ? '#fff' : 'var(--brand1)', marginTop: 1 }} />}
            </button>
          );
        })}
      </div>

      {/* Schedule blocks — spacious, prominent */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, margin: '12px 16px 0' }}>
        {dayClases.length === 0 ? (
          <div className="card" style={{ padding: '24px 0', textAlign: 'center', color: 'var(--k3)', fontSize: 14 }}>Sin clases este día</div>
        ) : dayClases.map(clase => {
          const ramo = ramoByIdLocal(clase.ramo_id);
          const c = ramo?.color || '#1654b0';
          const tipoLabel = { catedra: 'cátedra', ayudantia: 'ayudantía', laboratorio: 'laboratorio', taller: 'taller' }[clase.tipo] || clase.tipo || 'cátedra';
          return (
            <div key={clase.id} onClick={() => setViewClase({ ...clase, ramoName: ramo?.name, ramoColor: c, tipoLabel })} style={{ display: 'flex', gap: 12, alignItems: 'center', cursor: 'pointer' }}>
              {/* Time outside on left — bigger */}
              <div style={{ width: 44, flexShrink: 0, textAlign: 'right' }}>
                <p style={{ fontSize: 14, fontWeight: 700, color: 'var(--k2)', letterSpacing: '-0.01em' }}>{clase.start_time}</p>
                <p style={{ fontSize: 11, color: 'var(--k4)', marginTop: 1 }}>{clase.end_time}</p>
              </div>
              {/* Block — taller padding */}
              <div style={{ flex: 1, borderRadius: 10, background: c + '14', borderLeft: `3px solid ${c}`, padding: '14px 14px', lineHeight: 1.35 }}>
                <p style={{ fontWeight: 600, color: 'var(--k)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', fontSize: 15 }}>
                  {ramo?.name}
                </p>
                <p style={{ color: 'var(--k3)', marginTop: 3, fontSize: 12 }}>
                  {tipoLabel} · {clase.sala}
                </p>
              </div>
            </div>
          );
        })}
      </div>

      {/* Schedule block detail */}
      {viewClase && (
        <Sheet title="Detalle clase" onClose={() => setViewClase(null)}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 16 }}>
            <div style={{ width: 4, height: 36, borderRadius: 3, background: viewClase.ramoColor }} />
            <div>
              <p style={{ fontSize: 16, fontWeight: 600, color: 'var(--k)' }}>{viewClase.ramoName}</p>
              <p style={{ fontSize: 13, color: viewClase.ramoColor, fontWeight: 500, marginTop: 2 }}>{viewClase.tipoLabel}</p>
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 12 }}>
            <div style={{ padding: '12px 14px', borderRadius: 8, background: 'var(--p)' }}>
              <p style={{ fontSize: 11, color: 'var(--k4)', marginBottom: 2 }}>Horario</p>
              <p style={{ fontSize: 14, fontWeight: 600, color: 'var(--k)' }}>{viewClase.start_time} – {viewClase.end_time}</p>
            </div>
            <div style={{ padding: '12px 14px', borderRadius: 8, background: 'var(--p)' }}>
              <p style={{ fontSize: 11, color: 'var(--k4)', marginBottom: 2 }}>Sala</p>
              <p style={{ fontSize: 14, fontWeight: 600, color: 'var(--k)' }}>{viewClase.sala}</p>
            </div>
          </div>
          <div style={{ padding: '12px 14px', borderRadius: 8, background: 'var(--p)' }}>
            <p style={{ fontSize: 11, color: 'var(--k4)', marginBottom: 2 }}>Día</p>
            <p style={{ fontSize: 14, fontWeight: 500, color: 'var(--k)' }}>{['','Lunes','Martes','Miércoles','Jueves','Viernes'][viewClase.day_of_week] || ''}</p>
          </div>
        </Sheet>
      )}

      {/* Edit schedule sheet */}
      {showEditSchedule && <EditScheduleSheet ramos={ramos} schedule={schedule} setSchedule={setSchedule} selectedDay={selectedDay} onClose={() => setShowEditSchedule(false)} />}

      {/* Próximas evaluaciones — clean, clickable items */}
      <div className="sec-header" style={{ marginTop: 10 }}>
        <h2>Próximas evaluaciones</h2>
        <button className="btn btn-ghost btn-sm" onClick={() => setShowAddTask(true)}>+ Añadir</button>
      </div>
      <div className="card" style={{ margin: '0 16px', padding: '0 14px' }}>
        {pendingTasks.length === 0 ? (
          <div style={{ padding: '18px 0', textAlign: 'center', color: 'var(--k3)', fontSize: 13 }}>Sin tareas pendientes</div>
        ) : pendingTasks.map((task, i) => {
          const ramo = ramoByIdLocal(task.ramo_id);
          const d = daysUntil(task.due_date);
          const urgColor = d <= 2 ? 'var(--er)' : d <= 7 ? 'var(--wn)' : 'var(--k4)';
          const c = ramo?.color || '#1654b0';
          const dueDate = new Date(task.due_date + 'T00:00:00');
          const dueDateStr = dueDate.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
          return (
            <div key={task.id}>
              {i > 0 && <div style={{ height: 1, background: 'var(--ls)', marginLeft: 16 }} />}
              <button onClick={() => setViewTask(task)} style={{ display: 'grid', gridTemplateColumns: '3px 1fr auto', gap: 12, alignItems: 'center', padding: '12px 0', width: '100%', background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left' }}>
                <div style={{ width: 3, height: 28, borderRadius: 3, background: `linear-gradient(135deg, ${c}cc, ${c}77)` }} />
                <div style={{ minWidth: 0 }}>
                  <p style={{ fontSize: 13, fontWeight: 500, color: 'var(--k)', letterSpacing: '-0.01em' }}>{task.title}</p>
                  <p style={{ fontSize: 12, color: 'var(--k3)', marginTop: 1 }}>{ramo?.name}</p>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <p style={{ fontSize: 12, fontWeight: 700, color: urgColor }}>{dueDateStr}</p>
                  <p style={{ fontSize: 11, color: 'var(--k4)', marginTop: 1 }}>{fmtDue(task.due_date)}</p>
                </div>
              </button>
            </div>
          );
        })}
        {completedTasks.length > 0 && (
          <>
            <div style={{ height: 1, background: 'var(--ls)', margin: '0' }} />
            <button onClick={() => setShowCompleted(!showCompleted)} style={{ width: '100%', padding: '12px 14px', background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 13, fontWeight: 500, color: 'var(--brand1)', textAlign: 'center', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6 }}>
              {showCompleted ? 'Ocultar anteriores' : `Ver ${completedTasks.length} anteriores`}
              <span style={{ fontSize: 11, transform: showCompleted ? 'rotate(180deg)' : 'rotate(0deg)', transition: 'transform .2s' }}>▼</span>
            </button>
            {showCompleted && completedTasks.map((task, i) => {
              const ramo = ramoByIdLocal(task.ramo_id);
              const c = ramo?.color || '#1654b0';
              const dueDate = new Date(task.due_date + 'T00:00:00');
              const dueDateStr = dueDate.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
              return (
                <div key={task.id}>
                  <div style={{ height: 1, background: 'var(--ls)', marginLeft: 16 }} />
                  <button onClick={() => setViewTask(task)} style={{ display: 'grid', gridTemplateColumns: '3px 1fr auto', gap: 12, alignItems: 'center', padding: '12px 14px', width: '100%', background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left', opacity: 0.6 }}>
                    <div style={{ width: 3, height: 28, borderRadius: 3, background: `linear-gradient(135deg, ${c}cc, ${c}77)` }} />
                    <div style={{ minWidth: 0 }}>
                      <p style={{ fontSize: 13, fontWeight: 500, color: 'var(--k)', letterSpacing: '-0.01em', textDecoration: 'line-through' }}>{task.title}</p>
                      <p style={{ fontSize: 12, color: 'var(--k3)', marginTop: 1 }}>{ramo?.name}</p>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <p style={{ fontSize: 12, color: 'var(--ok)', fontWeight: 600 }}>✓</p>
                      <p style={{ fontSize: 11, color: 'var(--k4)', marginTop: 1 }}>{dueDateStr}</p>
                    </div>
                  </button>
                </div>
              );
            })}
          </>
        )}
      </div>

      {/* Task detail sheet */}
      {viewTask && <TaskDetailSheet task={viewTask} ramo={ramoByIdLocal(viewTask.ramo_id)} onEdit={() => { setEditTask(viewTask); setViewTask(null); }} onClose={() => setViewTask(null)} />}

      {/* Edit task sheet */}
      {editTask && <EditTaskSheet task={editTask} ramos={ramos} onSave={(updated) => { setTasks(prev => prev.map(t => t.id === updated.id ? updated : t)); setEditTask(null); }} onDelete={() => { setTasks(prev => prev.filter(t => t.id !== editTask.id)); setEditTask(null); }} onClose={() => setEditTask(null)} />}

      {/* Add task sheet */}
      {showAddTask && <AddTaskSheet ramos={ramos} onAdd={(t) => { setTasks(prev => [...prev, { ...t, id: 't' + Date.now(), completed: false }]); setShowAddTask(false); }} onClose={() => setShowAddTask(false)} />}

      {/* Cuadernos recientes — wrapped in card */}
      <div className="sec-header" style={{ marginTop: 10 }}>
        <h2>Cuadernos recientes</h2>
      </div>
      <div className="card" style={{ margin: '0 16px', padding: '6px 0' }}>
        {cuadernos.map((cuad, i) => {
          const ramo = ramoByIdLocal(cuad.ramo_id);
          const c = ramo?.color || '#1654b0';
          return (
            <div key={cuad.id}>
              {i > 0 && <div style={{ height: 1, background: 'var(--ls)', margin: '0 14px' }} />}
              <div style={{
                display: 'flex',
                alignItems: 'center',
                gap: 12,
                padding: '10px 14px',
              }}>
                <div style={{
                  width: 16, height: 22, borderRadius: 4,
                  background: `linear-gradient(135deg, ${c}, ${c}99)`,
                  flexShrink: 0,
                }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <p style={{ fontSize: 12, fontWeight: 600, color: 'var(--k3)', marginBottom: 1 }}>{ramo?.name || cuad.name}</p>
                  <p style={{ fontSize: 13, fontWeight: 500, color: 'var(--k)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                    {cuad.bloques?.[0]?.t || 'Sin bloques'}
                  </p>
                  <p style={{ fontSize: 11, color: 'var(--k4)', marginTop: 1 }}>{cuad.bloques?.[0]?.msgs || 0} mensajes · activo</p>
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   SECTION: RAMOS — Lista + Detalle (Desktop format)
───────────────────────────────────────────── */
const EICO = { presente: '●', ausente: '○', tardanza: '◐' };
const ECO = { presente: 'var(--ok)', ausente: 'var(--er)', tardanza: 'var(--wn)' };
const ramoGrad = c => `linear-gradient(135deg, ${c}cc, ${c}77)`;

/* ── Notas Tab ── */
function RamoNotas({ ramo, updateRamo }) {
  const c = ramo.color || '#1654b0';
  const [editGrade, setEditGrade] = useState(null);
  const [gVal, setGVal] = useState('');
  const [addItem, setAddItem] = useState(null);
  const [itemName, setItemName] = useState('');
  const [expanded, setExpanded] = useState(null); // item id that shows delete
  const [showNewMod, setShowNewMod] = useState(false);
  const [newModName, setNewModName] = useState('');
  const [newModWeight, setNewModWeight] = useState('');
  const [editWeight, setEditWeight] = useState(null); // mod id being edited
  const [editWeightVal, setEditWeightVal] = useState('');
  const [expandedMod, setExpandedMod] = useState(null); // mod id showing delete
  const promTotal = computeNota(ramo.evaluation_modules);
  const totalPeso = (ramo.evaluation_modules || []).reduce((s, m) => s + (m.weight || 0), 0);

  const saveGrade = (mid, iid) => {
    const v = gVal === '' ? null : Math.min(7, Math.max(1, parseFloat(gVal)));
    updateRamo(ramo.id, r => ({ ...r, evaluation_modules: r.evaluation_modules.map(m => m.id === mid ? { ...m, items: m.items.map(it => it.id === iid ? { ...it, grade: isNaN(v) ? null : v } : it) } : m) }));
    setEditGrade(null);
  };
  const doAddItem = (mid) => {
    if (!itemName.trim()) return;
    updateRamo(ramo.id, r => ({ ...r, evaluation_modules: r.evaluation_modules.map(m => m.id === mid ? { ...m, items: [...m.items, { id: 'g' + Date.now(), name: itemName.trim(), date: new Date().toISOString().slice(0, 10), grade: null }] } : m) }));
    setItemName(''); setAddItem(null);
  };
  const delItem = (mid, iid) => { updateRamo(ramo.id, r => ({ ...r, evaluation_modules: r.evaluation_modules.map(m => m.id === mid ? { ...m, items: m.items.filter(it => it.id !== iid) } : m) })); setExpanded(null); };
  const addModule = () => {
    if (!newModName.trim()) return;
    const w = parseInt(newModWeight) || 0;
    updateRamo(ramo.id, r => ({ ...r, evaluation_modules: [...(r.evaluation_modules || []), { id: 'em' + Date.now(), name: newModName.trim(), weight: w, items: [] }] }));
    setNewModName(''); setNewModWeight(''); setShowNewMod(false);
  };
  const delModule = (mid) => {
    updateRamo(ramo.id, r => ({ ...r, evaluation_modules: (r.evaluation_modules || []).filter(m => m.id !== mid) }));
    setExpandedMod(null);
  };
  const saveWeight = (mid) => {
    const w = parseInt(editWeightVal) || 0;
    updateRamo(ramo.id, r => ({ ...r, evaluation_modules: r.evaluation_modules.map(m => m.id === mid ? { ...m, weight: w } : m) }));
    setEditWeight(null);
  };

  return (
    <div style={{ padding: '16px 16px 20px' }}>
      {/* New module button */}
      {!showNewMod ? (
        <button onClick={() => setShowNewMod(true)} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 14, padding: '10px 16px', borderRadius: 8, border: '1.5px dashed rgba(22,84,176,.3)', background: 'rgba(22,84,176,.03)', color: 'var(--brand1)', fontSize: 13, fontWeight: 500, cursor: 'pointer', fontFamily: 'inherit', width: '100%', justifyContent: 'center' }}>+ Nuevo modulo</button>
      ) : (
        <div style={{ marginBottom: 14, padding: 12, borderRadius: 8, border: '1.5px dashed rgba(22,84,176,.3)', background: 'rgba(22,84,176,.03)', display: 'flex', gap: 8, alignItems: 'center' }}>
          <input autoFocus value={newModName} onChange={e => setNewModName(e.target.value)} placeholder="Nombre modulo" onKeyDown={e => e.key === 'Enter' && addModule()}
            style={{ flex: 1, padding: '8px 10px', border: '1px solid var(--ln)', borderRadius: 6, fontSize: 13, outline: 'none', background: 'var(--w)', color: 'var(--k)', fontFamily: 'inherit' }} />
          <input value={newModWeight} onChange={e => setNewModWeight(e.target.value)} placeholder="%" onKeyDown={e => e.key === 'Enter' && addModule()}
            style={{ width: 48, padding: '8px 10px', border: '1px solid var(--ln)', borderRadius: 6, fontSize: 13, outline: 'none', background: 'var(--w)', color: 'var(--k)', fontFamily: 'inherit', textAlign: 'center' }} />
          <button onClick={addModule} style={{ padding: '8px 12px', borderRadius: 6, border: 'none', background: 'var(--brand1)', color: '#fff', fontSize: 13, fontWeight: 500, cursor: 'pointer' }}>Crear</button>
          <button onClick={() => { setShowNewMod(false); setNewModName(''); setNewModWeight(''); }} style={{ padding: '8px 10px', borderRadius: 6, border: '1px solid var(--ln)', background: 'var(--p)', color: 'var(--k3)', fontSize: 13, cursor: 'pointer' }}>x</button>
        </div>
      )}

      {totalPeso !== 100 && (ramo.evaluation_modules || []).length > 0 && (
        <div style={{ fontSize: 12, color: 'var(--wn)', marginBottom: 12, padding: '7px 12px', borderRadius: 6, background: 'rgba(178,94,9,.08)', border: '1px solid rgba(178,94,9,.2)' }}>
          Las ponderaciones suman {totalPeso}% (deben sumar 100%)
        </div>
      )}

      {(ramo.evaluation_modules || []).map(mod => {
        const graded = mod.items.filter(it => it.grade != null);
        const modAvg = graded.length > 0 ? graded.reduce((s, it) => s + it.grade, 0) / graded.length : null;
        const isModExp = expandedMod === mod.id;
        return (
          <div key={mod.id} style={{ marginBottom: 18, background: 'var(--w)', borderRadius: 10, border: '1px solid var(--ln)', overflow: 'hidden' }}>
            <div onClick={() => setExpandedMod(isModExp ? null : mod.id)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 14px', background: c + '0a', borderBottom: '1px solid var(--ls)', cursor: 'pointer' }}>
              <span style={{ flex: 1, fontSize: 13, fontWeight: 600 }}>{mod.name}</span>
              {editWeight === mod.id ? (
                <span style={{ display: 'flex', alignItems: 'center', gap: 6 }} onClick={e => e.stopPropagation()}>
                  <span style={{ fontSize: 12, color: 'var(--k4)' }}>Pondera:</span>
                  <input autoFocus type="number" value={editWeightVal} onChange={e => setEditWeightVal(e.target.value)}
                    onBlur={() => saveWeight(mod.id)} onKeyDown={e => e.key === 'Enter' && saveWeight(mod.id)}
                    style={{ width: 40, padding: '2px 6px', border: `1px solid ${c}`, borderRadius: 4, fontSize: 13, fontWeight: 700, textAlign: 'center', outline: 'none', background: 'var(--w)', color: 'var(--k)', fontFamily: 'inherit' }} />
                  <span style={{ fontSize: 12, color: 'var(--k4)' }}>%</span>
                </span>
              ) : (
                <button onClick={e => { e.stopPropagation(); setEditWeight(mod.id); setEditWeightVal(String(mod.weight || 0)); }} style={{ fontSize: 12, color: 'var(--k4)', background: 'transparent', border: 'none', cursor: 'pointer', fontFamily: 'inherit', padding: '2px 6px', borderRadius: 4 }}>Pondera: <strong style={{ color: 'var(--k2)' }}>{mod.weight}%</strong></button>
              )}
              <button onClick={e => { e.stopPropagation(); setAddItem(mod.id); setItemName(''); }} style={{ width: 20, height: 20, border: 'none', background: 'transparent', cursor: 'pointer', color: 'var(--k3)', display: 'grid', placeItems: 'center', borderRadius: 4, fontSize: 16 }}>+</button>
            </div>
            {/* Module delete row */}
            {isModExp && (
              <div style={{ padding: '7px 14px 7px', background: 'var(--p)', borderBottom: '1px solid var(--ls)', display: 'flex', justifyContent: 'flex-end', animation: 'fadeIn .15s ease' }}>
                <button onClick={() => delModule(mod.id)}
                  style={{ padding: '6px 14px', borderRadius: 6, border: 'none', background: 'var(--er)', color: '#fff', fontSize: 12, fontWeight: 500, cursor: 'pointer', opacity: .9 }}>
                  Eliminar modulo
                </button>
              </div>
            )}
            {addItem === mod.id && (
              <div style={{ display: 'flex', gap: 8, padding: '7px 14px', borderBottom: '1px solid var(--ls)', background: 'rgba(22,84,176,.04)' }}>
                <input autoFocus value={itemName} onChange={e => setItemName(e.target.value)} placeholder="Nombre evaluación" onKeyDown={e => e.key === 'Enter' && doAddItem(mod.id)}
                  style={{ flex: 1, padding: '6px 10px', border: '1px solid var(--ln)', borderRadius: 6, fontSize: 13, outline: 'none', background: 'var(--w)', color: 'var(--k)', fontFamily: 'inherit' }} />
                <button onClick={() => doAddItem(mod.id)} style={{ padding: '6px 12px', borderRadius: 6, border: 'none', background: 'var(--brand1)', color: '#fff', fontSize: 13, fontWeight: 500, cursor: 'pointer' }}>Añadir</button>
                <button onClick={() => setAddItem(null)} style={{ padding: '6px 10px', borderRadius: 6, border: '1px solid var(--ln)', background: 'var(--p)', color: 'var(--k3)', fontSize: 13, cursor: 'pointer' }}>×</button>
              </div>
            )}
            {mod.items.map(item => {
              const isEd = editGrade?.m === mod.id && editGrade?.i === item.id;
              const isExp = expanded === item.id;
              return (
                <div key={item.id}>
                  <div onClick={() => setExpanded(isExp ? null : item.id)}
                    style={{ display: 'grid', gridTemplateColumns: '1fr 70px 56px', gap: 8, padding: '7px 14px', borderBottom: '1px solid var(--ls)', alignItems: 'center', cursor: 'pointer' }}>
                    <span style={{ fontSize: 13, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{item.name}</span>
                    <span style={{ fontSize: 12, color: 'var(--k4)' }}>{item.date || ''}</span>
                    {isEd ? (
                      <input autoFocus type="number" min="1" max="7" step="0.1" value={gVal}
                        onClick={e => e.stopPropagation()}
                        onChange={e => setGVal(e.target.value)} onBlur={() => saveGrade(mod.id, item.id)} onKeyDown={e => e.key === 'Enter' && saveGrade(mod.id, item.id)}
                        style={{ padding: '2px 6px', border: `1px solid ${c}`, borderRadius: 5, fontSize: 15, fontWeight: 700, textAlign: 'center', outline: 'none', width: '100%', background: 'var(--w)', color: 'var(--k)', fontFamily: 'inherit' }} />
                    ) : (
                      <button onClick={e => { e.stopPropagation(); setEditGrade({ m: mod.id, i: item.id }); setGVal(item.grade != null ? String(item.grade) : ''); }}
                        style={{ fontSize: 18, fontWeight: 700, color: item.grade != null ? ncColor(item.grade) : 'var(--k4)', background: 'transparent', border: `1px dashed ${item.grade != null ? 'transparent' : 'var(--ln)'}`, borderRadius: 5, cursor: 'pointer', padding: '1px 6px', textAlign: 'center', fontFamily: 'inherit', width: '100%' }}>
                        {item.grade != null ? item.grade.toFixed(1) : '—'}
                      </button>
                    )}
                  </div>
                  {/* Expandable delete row */}
                  {isExp && (
                    <div style={{ padding: '7px 14px 7px', background: 'var(--p)', borderBottom: '1px solid var(--ls)', display: 'flex', justifyContent: 'flex-end', animation: 'fadeIn .15s ease' }}>
                      <button onClick={() => delItem(mod.id, item.id)}
                        style={{ padding: '6px 14px', borderRadius: 6, border: 'none', background: 'var(--er)', color: '#fff', fontSize: 12, fontWeight: 500, cursor: 'pointer', opacity: .9 }}>
                        Eliminar
                      </button>
                    </div>
                  )}
                </div>
              );
            })}
            {modAvg != null && (
              <div style={{ padding: '7px 14px', fontSize: 12, color: 'var(--k3)', textAlign: 'right' }}>
                Promedio módulo: <span style={{ fontWeight: 700, color: ncColor(modAvg) }}>{modAvg.toFixed(1)}</span>
              </div>
            )}
          </div>
        );
      })}

      <div style={{ padding: '14px 16px', borderRadius: 10, background: promTotal > 0 ? c + '0a' : 'var(--p2)', border: '1px solid var(--ln)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span style={{ fontSize: 13, color: 'var(--k3)' }}>Nota final ponderada</span>
        <span style={{ fontSize: 24, fontWeight: 700, color: promTotal > 0 ? ncColor(promTotal) : 'var(--k4)' }}>{promTotal > 0 ? promTotal.toFixed(1) : '—'}</span>
      </div>
    </div>
  );
}

/* ── Asistencia Tab ── */
function RamoAsistencia({ ramo, updateRamo }) {
  const [showAdd, setShowAdd] = useState(false);
  const [expanded, setExpanded] = useState(null);
  const att = ramo.attendance || [];
  const pr = att.filter(a => a.status === 'presente').length;
  const ab = att.filter(a => a.status === 'ausente').length;
  const ta = att.filter(a => a.status === 'tardanza').length;
  const pct = att.length > 0 ? Math.round((pr / att.length) * 100) : 0;
  const cycle = { presente: 'ausente', ausente: 'tardanza', tardanza: 'presente' };

  const toggle = (id) => updateRamo(ramo.id, r => ({ ...r, attendance: r.attendance.map(a => a.id === id ? { ...a, status: cycle[a.status] } : a) }));
  const del = (id) => { updateRamo(ramo.id, r => ({ ...r, attendance: r.attendance.filter(a => a.id !== id) })); setExpanded(null); };
  const add = (date, status) => { updateRamo(ramo.id, r => ({ ...r, attendance: [...r.attendance, { id: 'a' + Date.now(), date, status }] })); setShowAdd(false); };

  return (
    <div style={{ padding: '16px 16px 20px' }}>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 18, marginBottom: 20 }}>
        {[
          { l: 'Asistencia', v: pct + '%', c: 'var(--k)' },
          { l: 'Presentes', v: pr, c: 'var(--ok)' },
          { l: 'Ausentes', v: ab, c: 'var(--er)' },
          { l: 'Tardanzas', v: ta, c: 'var(--wn)' },
        ].map(s => (
          <div key={s.l}>
            <p style={{ fontSize: 12, color: 'var(--k4)', marginBottom: 2 }}>{s.l}</p>
            <p style={{ fontSize: 24, fontWeight: 700, letterSpacing: '-0.022em', color: s.c }}>{s.v}</p>
          </div>
        ))}
      </div>

      {showAdd && <AddAttInline onAdd={add} onClose={() => setShowAdd(false)} />}

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
        <span style={{ fontSize: 12, fontWeight: 600, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--k4)' }}>Registro de clases</span>
        <button onClick={() => setShowAdd(true)} style={{ padding: '6px 12px', borderRadius: 6, border: 'none', background: 'var(--brand1)', color: '#fff', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>+ Añadir clase</button>
      </div>

      {att.length === 0 ? (
        <p style={{ padding: '18px 0', textAlign: 'center', color: 'var(--k3)', fontSize: 13 }}>Sin registros</p>
      ) : [...att].sort((a,b) => b.date.localeCompare(a.date)).map(rec => {
        const isExp = expanded === rec.id;
        return (
          <div key={rec.id}>
            <div onClick={() => setExpanded(isExp ? null : rec.id)}
              style={{ display: 'grid', gridTemplateColumns: '60px 1fr 90px', gap: 10, padding: '10px 0', borderBottom: '1px solid var(--ls)', alignItems: 'center', cursor: 'pointer' }}>
              <span style={{ fontSize: 12, color: 'var(--k3)', fontFeatureSettings: '"tnum"' }}>
                {new Date(rec.date + 'T00:00:00').toLocaleDateString('es-CL', { day: '2-digit', month: 'short' })}
              </span>
              <span style={{ fontSize: 12, padding: '2px 7px', borderRadius: 999, background: 'var(--p2)', color: 'var(--k2)', fontWeight: 500, width: 'fit-content' }}>Clase</span>
              <button onClick={e => { e.stopPropagation(); toggle(rec.id); }} style={{ display: 'flex', alignItems: 'center', gap: 6, fontWeight: 600, fontSize: 13, color: ECO[rec.status], background: 'transparent', border: 'none', cursor: 'pointer', padding: 0, fontFamily: 'inherit' }}>
                {EICO[rec.status]} <span style={{ textTransform: 'capitalize' }}>{rec.status}</span>
              </button>
            </div>
            {isExp && (
              <div style={{ padding: '7px 0 7px', display: 'flex', justifyContent: 'flex-end', animation: 'fadeIn .15s ease' }}>
                <button onClick={() => del(rec.id)}
                  style={{ padding: '6px 14px', borderRadius: 6, border: 'none', background: 'var(--er)', color: '#fff', fontSize: 12, fontWeight: 500, cursor: 'pointer', opacity: .9 }}>
                  Eliminar
                </button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ── Archivos Tab ── */
function RamoArchivos({ ramo, updateRamo }) {
  const fileRef = useRef(null);
  const [openFolders, setOpenFolders] = useState({});
  const [expanded, setExpanded] = useState(null);
  const [addingFolder, setAddingFolder] = useState(false);
  const [folderName, setFolderName] = useState('');
  const archivos = ramo.archivos || [];
  const temario = ramo.temario || [];
  const programa = archivos.filter(f => f.programa);
  const folderFileIds = new Set(temario.flatMap(u => u.archivos || []));
  const looseFiles = archivos.filter(f => !f.programa && !folderFileIds.has(f.id));

  const toggleProg = (fid) => {
    updateRamo(ramo.id, r => ({ ...r, archivos: r.archivos.map(f => f.id === fid ? { ...f, programa: !f.programa } : f) }));
    const file = archivos.find(f => f.id === fid);
    if (file) dbUpdate('ramo_files', { is_programa: !file.programa }, { id: fid });
  };
  const delFile = (fid) => {
    updateRamo(ramo.id, r => ({ ...r, archivos: r.archivos.filter(f => f.id !== fid) }));
    dbDelete('ramo_files', { id: fid });
    setExpanded(null);
  };
  const upload = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    for (const file of files) {
      const localId = 'f' + Date.now() + Math.random().toString(36).slice(2, 5);
      const newFile = { id: localId, name: file.name, date: new Date().toISOString().slice(0, 10), programa: false };
      updateRamo(ramo.id, r => ({ ...r, archivos: [...r.archivos, newFile] }));
      if (supabaseClient && !_devMode && _userId) {
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const path = `${_userId}/${ramo.id}/${Date.now()}_${safeName}`;
        const { error } = await supabaseClient.storage.from('ramo-files').upload(path, file, { upsert: true });
        if (!error) {
          const { data } = await dbInsert('ramo_files', { ramo_id: ramo.id, name: file.name, size: file.size, storage_path: path, is_programa: false });
          if (data) updateRamo(ramo.id, r => ({ ...r, archivos: r.archivos.map(f => f.id === localId ? { ...f, id: data.id, storage_path: path } : f) }));
        }
      }
    }
  };
  const toggleFolder = (id) => setOpenFolders(p => ({ ...p, [id]: !p[id] }));
  const createFolder = () => {
    if (!folderName.trim()) return;
    updateRamo(ramo.id, r => ({ ...r, temario: [...(r.temario || []), { id: 'u' + Date.now(), titulo: folderName.trim(), archivos: [] }] }));
    setFolderName(''); setAddingFolder(false);
  };

  const FileRow = ({ f }) => {
    const isExp = expanded === f.id;
    return (
      <div>
        <div onClick={() => setExpanded(isExp ? null : f.id)} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 0', borderBottom: '1px solid var(--ls)', cursor: 'pointer' }}>
          <div style={{ width: 24, height: 36, borderRadius: 5, background: 'var(--p2)', border: '1px solid var(--ln)', display: 'grid', placeItems: 'center', flexShrink: 0, color: 'var(--k3)' }}>
            <svg width={11} height={11} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <p style={{ fontSize: 13, fontWeight: 500, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{f.name}</p>
            <p style={{ fontSize: 11, color: 'var(--k4)', marginTop: 1 }}>{f.date}</p>
          </div>
        </div>
        {isExp && (
          <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', padding: '7px 0 7px', animation: 'fadeIn .15s ease' }}>
            <button onClick={() => toggleProg(f.id)} style={{ padding: '6px 12px', borderRadius: 6, border: '1px solid var(--ln)', background: 'var(--p)', color: 'var(--k3)', fontSize: 12, cursor: 'pointer' }}>{f.programa ? 'Quitar ★' : '☆ Destacar'}</button>
            <button onClick={() => delFile(f.id)} style={{ padding: '6px 12px', borderRadius: 6, border: 'none', background: 'var(--er)', color: '#fff', fontSize: 12, cursor: 'pointer', opacity: .9 }}>Eliminar</button>
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{ padding: '16px 16px 20px' }}>
      <input ref={fileRef} type="file" accept=".pdf,.docx,.pptx,.xlsx,.txt" multiple onChange={upload} style={{ display: 'none' }} />

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
        <span style={{ fontSize: 12, fontWeight: 600, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--k4)' }}>Archivos del ramo</span>
        <div style={{ display: 'flex', gap: 7 }}>
          <button onClick={() => { setAddingFolder(true); setFolderName(''); }} style={{ padding: '6px 12px', borderRadius: 6, border: '1px solid var(--ln)', background: 'var(--p)', color: 'var(--k3)', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>+ Carpeta</button>
          <button onClick={() => fileRef.current?.click()} style={{ padding: '6px 12px', borderRadius: 6, border: 'none', background: 'var(--brand1)', color: '#fff', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>+ Importar</button>
        </div>
      </div>

      {/* Add folder inline */}
      {addingFolder && (
        <div style={{ display: 'flex', gap: 8, marginBottom: 12, animation: 'fadeIn .15s ease' }}>
          <input autoFocus value={folderName} onChange={e => setFolderName(e.target.value)} placeholder="Nombre de la carpeta" onKeyDown={e => e.key === 'Enter' && createFolder()}
            style={{ flex: 1, padding: '8px 12px', borderRadius: 7, border: '1px solid var(--ln)', fontSize: 13, outline: 'none', fontFamily: 'inherit', background: 'var(--w)', color: 'var(--k)' }} />
          <button type="button" onClick={e => { e.preventDefault(); e.stopPropagation(); createFolder(); }} style={{ padding: '8px 14px', borderRadius: 7, border: 'none', background: 'var(--brand1)', color: '#fff', fontSize: 13, fontWeight: 500, cursor: 'pointer' }}>Crear</button>
          <button type="button" onClick={e => { e.preventDefault(); e.stopPropagation(); setAddingFolder(false); setFolderName(''); }} style={{ padding: '8px 12px', borderRadius: 7, border: '1px solid var(--ln)', background: 'var(--p)', color: 'var(--k3)', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }}>×</button>
        </div>
      )}

      {/* Programa */}
      {programa.length > 0 && (
        <div style={{ marginBottom: 14 }}>
          <p style={{ fontSize: 11, fontWeight: 600, letterSpacing: '.05em', textTransform: 'uppercase', color: 'var(--wn)', marginBottom: 8 }}>Destacado · Programa del ramo</p>
          {programa.map(f => (
            <div key={f.id}>
              <div onClick={() => setExpanded(expanded === f.id ? null : f.id)} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 14px', borderRadius: 8, background: 'rgba(178,94,9,.06)', border: '1.5px solid rgba(178,94,9,.25)', marginBottom: 7, cursor: 'pointer' }}>
                <div style={{ width: 24, height: 36, borderRadius: 5, background: 'rgba(178,94,9,.12)', border: '1px solid rgba(178,94,9,.2)', display: 'grid', placeItems: 'center', flexShrink: 0, color: 'var(--wn)' }}>
                  <svg width={11} height={11} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <p style={{ fontSize: 13, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{f.name}</p>
                  <p style={{ fontSize: 11, color: 'var(--wn)', marginTop: 1 }}>Programa del ramo</p>
                </div>
              </div>
              {expanded === f.id && (
                <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end', marginBottom: 8, animation: 'fadeIn .15s ease' }}>
                  <button onClick={() => toggleProg(f.id)} style={{ padding: '6px 12px', borderRadius: 6, border: '1px solid var(--ln)', background: 'var(--p)', color: 'var(--k3)', fontSize: 12, cursor: 'pointer' }}>Quitar ★</button>
                  <button onClick={() => delFile(f.id)} style={{ padding: '6px 12px', borderRadius: 6, border: 'none', background: 'var(--er)', color: '#fff', fontSize: 12, cursor: 'pointer', opacity: .9 }}>Eliminar</button>
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {/* Carpetas from temario */}
      {temario.length > 0 && temario.map(unit => {
        const isOpen = openFolders[unit.id];
        const unitFiles = (unit.archivos || []).map(fid => archivos.find(f => f.id === fid)).filter(Boolean);
        return (
          <div key={unit.id} style={{ marginBottom: 8 }}>
            <button onClick={() => toggleFolder(unit.id)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 0', width: '100%', background: 'none', border: 'none', borderBottom: '1px solid var(--ls)', cursor: 'pointer', fontFamily: 'inherit', textAlign: 'left' }}>
              <span style={{ fontSize: 16, flexShrink: 0 }}>📁</span>
              <span style={{ flex: 1, fontSize: 13, fontWeight: 600, color: 'var(--k)' }}>{unit.titulo}</span>
              <span style={{ fontSize: 11, color: 'var(--k4)' }}>{unitFiles.length}</span>
              <span style={{ fontSize: 12, color: 'var(--k4)', transform: isOpen ? 'rotate(90deg)' : 'none', transition: 'transform .15s' }}>›</span>
            </button>
            {isOpen && (
              <div style={{ paddingLeft: 22, animation: 'fadeIn .15s ease' }}>
                {unitFiles.length === 0 ? (
                  <p style={{ padding: '8px 0', fontSize: 12, color: 'var(--k4)' }}>Carpeta vacía</p>
                ) : unitFiles.map(f => <FileRow key={f.id} f={f} />)}
              </div>
            )}
          </div>
        );
      })}

      {/* Loose files (not in any folder) */}
      {looseFiles.length > 0 && (
        <div style={{ marginTop: temario.length > 0 ? 8 : 0 }}>
          {temario.length > 0 && <p style={{ fontSize: 11, fontWeight: 600, letterSpacing: '.05em', textTransform: 'uppercase', color: 'var(--k4)', marginBottom: 8 }}>Sin carpeta</p>}
          {looseFiles.map(f => <FileRow key={f.id} f={f} />)}
        </div>
      )}

      {archivos.length === 0 && (
        <p style={{ padding: '20px 0', textAlign: 'center', color: 'var(--k3)', fontSize: 13 }}>Sin archivos — importa material para comenzar</p>
      )}
    </div>
  );
}

/* ── Temario Tab ── */
function RamoTemario({ ramo, updateRamo }) {
  const [expanded, setExpanded] = useState(null);
  const [adding, setAdding] = useState(false);
  const [unitName, setUnitName] = useState('');
  const [editingUnit, setEditingUnit] = useState(null);
  const [editName, setEditName] = useState('');
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [confirmDeleteFile, setConfirmDeleteFile] = useState(null);
  const [showAssign, setShowAssign] = useState(null);
  const temario = ramo.temario || [];
  const addUnit = () => { if (!unitName.trim()) return; updateRamo(ramo.id, r => ({ ...r, temario: [...r.temario, { id: 'u' + Date.now(), titulo: unitName.trim(), archivos: [] }] })); setUnitName(''); setAdding(false); };
  const delUnit = (uid) => { updateRamo(ramo.id, r => ({ ...r, temario: r.temario.filter(u => u.id !== uid) })); setEditingUnit(null); setConfirmDelete(null); };
  const renameUnit = (uid) => { if (!editName.trim()) return; updateRamo(ramo.id, r => ({ ...r, temario: r.temario.map(u => u.id === uid ? { ...u, titulo: editName.trim() } : u) })); setEditingUnit(null); };
  const toggleFile = (uid, fid) => updateRamo(ramo.id, r => ({ ...r, temario: r.temario.map(u => u.id === uid ? { ...u, archivos: u.archivos.includes(fid) ? u.archivos.filter(f => f !== fid) : [...u.archivos, fid] } : u) }));
  const deleteFileFromRamo = async (fid) => {
    const file = (ramo.archivos || []).find(f => f.id === fid);
    // Remove file from all units + from ramo.archivos
    updateRamo(ramo.id, r => ({
      ...r,
      archivos: r.archivos.filter(f => f.id !== fid),
      temario: r.temario.map(u => ({ ...u, archivos: u.archivos.filter(x => x !== fid) }))
    }));
    // Remove from storage + DB
    if (supabaseClient && !_devMode && file) {
      if (file.storage_path) await supabaseClient.storage.from('ramo-files').remove([file.storage_path]);
      dbDelete('ramo_files', { id: fid });
    }
    setConfirmDeleteFile(null);
  };

  return (
    <div style={{ padding: '16px 16px 20px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
        <span style={{ fontSize: 12, fontWeight: 600, letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--k4)' }}>Temario del ramo</span>
        <button onClick={() => { setAdding(true); setUnitName(''); }} style={{ padding: '6px 12px', borderRadius: 6, border: 'none', background: 'var(--brand1)', color: '#fff', fontSize: 12, fontWeight: 500, cursor: 'pointer' }}>+ Nueva unidad</button>
      </div>
      <p style={{ fontSize: 12, color: 'var(--k3)', marginBottom: 14 }}>Haz clic en una unidad para asignar archivos.</p>

      {temario.map((unit, i) => {
        const isOpen = expanded === unit.id;
        const fc = (unit.archivos || []).length;
        return (
          <div key={unit.id} style={{ marginBottom: 7, borderRadius: 8, border: '1.5px solid var(--ln)', background: 'var(--w)', overflow: 'hidden' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '12px 14px' }}>
              <span style={{ color: 'var(--k4)', fontSize: 12 }}>☰</span>
              <button onClick={() => setExpanded(isOpen ? null : unit.id)} style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 10, background: 'none', border: 'none', textAlign: 'left', cursor: 'pointer', fontFamily: 'inherit', padding: 0 }}>
                <span style={{ flex: 1, fontSize: 13, fontWeight: 600, color: 'var(--k)' }}>{unit.titulo}</span>
                <span style={{ fontSize: 12, color: 'var(--k4)' }}>{fc} archivo{fc !== 1 ? 's' : ''}</span>
              </button>
